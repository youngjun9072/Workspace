<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="600" fill="#ffffff"/>

  <!-- MASTER node -->
  <rect x="20" y="20" width="680" height="140" rx="10" fill="#eef3f8" stroke="#9bb4cc"/>
  <text x="36" y="44" fill="#5a6b7b" font-size="13" font-weight="bold">MASTER node</text>
  <rect x="60" y="70" width="150" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="135" y="98" text-anchor="middle" font-size="15" fill="#1a2733">cub_master</text>
  <rect x="285" y="70" width="150" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="360" y="98" text-anchor="middle" font-size="15" fill="#1a2733">cub_server</text>
  <rect x="500" y="70" width="150" height="46" rx="6" fill="#fff6e6" stroke="#d9a441"/>
  <text x="575" y="98" text-anchor="middle" font-size="15" fill="#1a2733">Tx log</text>
  <line x1="210" y1="93" x2="281" y2="93" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="86" text-anchor="middle" font-size="11" fill="#777">manage</text>
  <line x1="435" y1="93" x2="496" y2="93" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="466" y="86" text-anchor="middle" font-size="11" fill="#777">write</text>

  <!-- network arrow -->
  <line x1="575" y1="116" x2="575" y2="246" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="160" text-anchor="end" font-size="12" fill="#444">(1) copylogdb fetches</text>
  <text x="565" y="176" text-anchor="end" font-size="11" fill="#777">over network (SYNC/ASYNC)</text>

  <!-- SLAVE node -->
  <rect x="20" y="200" width="680" height="380" rx="10" fill="#eef8f1" stroke="#9bccac"/>
  <text x="36" y="224" fill="#5a7b66" font-size="13" font-weight="bold">SLAVE node</text>

  <rect x="500" y="248" width="150" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="575" y="276" text-anchor="middle" font-size="15" fill="#1a2733">copylogdb</text>

  <rect x="490" y="330" width="170" height="50" rx="6" fill="#fff6e6" stroke="#d9a441"/>
  <text x="575" y="352" text-anchor="middle" font-size="14" fill="#1a2733">Copied repl log</text>
  <text x="575" y="369" text-anchor="middle" font-size="10" fill="#a07a2a">ha_copy_log_base</text>

  <rect x="500" y="416" width="150" height="48" rx="6" fill="#ffe9e6" stroke="#d9534f" stroke-width="2"/>
  <text x="575" y="438" text-anchor="middle" font-size="15" fill="#1a2733">applylogdb</text>
  <text x="575" y="455" text-anchor="middle" font-size="10" fill="#c0392b">design target</text>

  <rect x="170" y="416" width="180" height="48" rx="6" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="260" y="438" text-anchor="middle" font-size="14" fill="#1a2733">Slave DB</text>
  <text x="260" y="455" text-anchor="middle" font-size="10" fill="#888">cub_server</text>

  <rect x="120" y="506" width="530" height="52" rx="6" fill="#fff6e6" stroke="#d9a441"/>
  <text x="385" y="528" text-anchor="middle" font-size="14" fill="#1a2733">db_ha_apply_info</text>
  <text x="385" y="546" text-anchor="middle" font-size="10" fill="#a07a2a">final_lsa / required_lsa / committed_lsa ...</text>

  <line x1="575" y1="294" x2="575" y2="326" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="585" y="314" font-size="11" fill="#777">store</text>
  <line x1="575" y1="380" x2="575" y2="412" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="396" text-anchor="end" font-size="12" fill="#444">(2) logical re-apply</text>
  <text x="565" y="411" text-anchor="end" font-size="10" fill="#777">re-execute row/stmt</text>
  <line x1="496" y1="440" x2="354" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="425" y="433" text-anchor="middle" font-size="11" fill="#777">(3a) apply</text>
  <text x="260" y="485" text-anchor="middle" font-size="10" fill="#8a6d3b">re-execution &#8594; slave’s own log (LSA ≠ master)</text>
  <line x1="540" y1="464" x2="430" y2="506" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="492" text-anchor="middle" font-size="11" fill="#777">(3b) save progress</text>
</svg>
