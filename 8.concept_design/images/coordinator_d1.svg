<svg xmlns="http://www.w3.org/2000/svg" width="820" height="612" viewBox="0 0 820 612" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="pg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f7d4a"/>
    </marker>
    <marker id="po" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e07b00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="612" fill="#ffffff"/>

  <!-- master input (D.4) -->
  <rect x="95" y="10" width="630" height="44" rx="6" fill="#fff1cc" stroke="#e07b00" stroke-width="2.5"/>
  <text x="120" y="28" font-size="12" fill="#5c4209"><tspan font-weight="bold" fill="#8a4b00">★ Master (cub_server):</tspan>  compute writeset / conflict check (conflict keys)</text>
  <text x="138" y="46" font-size="12" fill="#5c4209">→ emit only <tspan font-weight="bold">last_committed_lsa</tspan> to repl log  (D.4)</text>
  <line x1="410" y1="54" x2="410" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>

  <!-- LogReader -->
  <rect x="210" y="66" width="400" height="98" rx="8" fill="#ffffff" stroke="#3b6ea5" stroke-width="2"/>
  <text x="410" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2733">LogReader (Reader)</text>
  <line x1="210" y1="98" x2="610" y2="98" stroke="#cdd7e1"/>
  <text x="230" y="118" font-size="12" fill="#33414f">• read log → build LA_ITEM / LA_APPLY</text>
  <text x="230" y="138" font-size="12" fill="#33414f">• decode <tspan font-weight="bold">last_committed_lsa</tspan> (sent by master)</text>
  <text x="230" y="158" font-size="12" fill="#33414f">• collect results → advance committed_lsa (in order)</text>

  <line x1="410" y1="164" x2="410" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <text x="420" y="176" font-size="11" fill="#777">completed tx</text>

  <!-- Coordinator (HIGHLIGHT = NEW) -->
  <rect x="150" y="182" width="520" height="100" rx="8" fill="#fff1cc" stroke="#e07b00" stroke-width="3"/>
  <text x="170" y="206" font-size="15" font-weight="bold" fill="#8a4b00">★ Coordinator</text>
  <rect x="298" y="192" width="362" height="20" rx="10" fill="#e07b00"/>
  <text x="479" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">NEW — replaces PoC's  tranid % worker  dispatch</text>
  <line x1="150" y1="216" x2="670" y2="216" stroke="#eccf93"/>
  <text x="170" y="236" font-size="12" fill="#5c4209">• <tspan font-weight="bold">last_committed_lsa ≤ committed_lsa</tspan>  →  dispatch / else pending</text>
  <text x="170" y="256" font-size="12" fill="#5c4209">• SBR (incl. DDL) · unknown change-set  →  <tspan font-weight="bold">barrier</tspan> (serialize)</text>
  <text x="170" y="276" font-size="12" fill="#5c4209">• pick worker for runnable tx <tspan fill="#8a4b00">(conflict/order already decided by master)</tspan></text>

  <!-- dispatch fan-out -->
  <line x1="410" y1="282" x2="410" y2="294" stroke="#e07b00" stroke-width="1.8"/>
  <line x1="130" y1="294" x2="690" y2="294" stroke="#e07b00" stroke-width="1.8"/>
  <line x1="130" y1="294" x2="130" y2="312" stroke="#e07b00" stroke-width="1.8" marker-end="url(#po)"/>
  <line x1="410" y1="294" x2="410" y2="312" stroke="#e07b00" stroke-width="1.8" marker-end="url(#po)"/>
  <line x1="690" y1="294" x2="690" y2="312" stroke="#e07b00" stroke-width="1.8" marker-end="url(#po)"/>
  <text x="422" y="290" font-size="11" fill="#b45309">parallel dispatch</text>

  <!-- workers -->
  <g>
    <rect x="40" y="314" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="130" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker 0</text>
    <line x1="40" y1="342" x2="220" y2="342" stroke="#cdd7e1"/>
    <text x="54" y="360" font-size="11" fill="#33414f">• queue · session · ws</text>
    <text x="54" y="377" font-size="11" fill="#33414f">• process repl items</text>
    <text x="54" y="394" font-size="11" fill="#33414f">• flush row items</text>
    <text x="54" y="411" font-size="11" fill="#33414f">• execute stmt</text>
    <text x="54" y="428" font-size="11" font-weight="bold" fill="#b45309">• commit tx  ★D.3 gate</text>
    <text x="54" y="445" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>
  <g>
    <rect x="320" y="314" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="410" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker 1</text>
    <line x1="320" y1="342" x2="500" y2="342" stroke="#cdd7e1"/>
    <text x="334" y="360" font-size="11" fill="#33414f">• queue · session · ws</text>
    <text x="334" y="377" font-size="11" fill="#33414f">• process repl items</text>
    <text x="334" y="394" font-size="11" fill="#33414f">• flush row items</text>
    <text x="334" y="411" font-size="11" fill="#33414f">• execute stmt</text>
    <text x="334" y="428" font-size="11" font-weight="bold" fill="#b45309">• commit tx  ★D.3 gate</text>
    <text x="334" y="445" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>
  <text x="550" y="394" text-anchor="middle" font-size="18" fill="#999">· · ·</text>
  <g>
    <rect x="600" y="314" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="690" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker N</text>
    <line x1="600" y1="342" x2="780" y2="342" stroke="#cdd7e1"/>
    <text x="614" y="360" font-size="11" fill="#33414f">• queue · session · ws</text>
    <text x="614" y="377" font-size="11" fill="#33414f">• process repl items</text>
    <text x="614" y="394" font-size="11" fill="#33414f">• flush row items</text>
    <text x="614" y="411" font-size="11" fill="#33414f">• execute stmt</text>
    <text x="614" y="428" font-size="11" font-weight="bold" fill="#b45309">• commit tx  ★D.3 gate</text>
    <text x="614" y="445" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>

  <!-- converge to Slave DB -->
  <line x1="130" y1="464" x2="130" y2="488" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="464" x2="410" y2="488" stroke="#555" stroke-width="1.5"/>
  <line x1="690" y1="464" x2="690" y2="488" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="488" x2="690" y2="488" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="488" x2="410" y2="502" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <rect x="320" y="504" width="180" height="40" rx="6" fill="#fff6e6" stroke="#d9a441"/>
  <text x="410" y="529" text-anchor="middle" font-size="13" fill="#1a2733">Slave DB / Server</text>
  <text x="422" y="482" font-size="11" fill="#777">apply &amp; commit</text>

  <!-- feedback: report completed lsa -->
  <polyline points="780,400 802,400 802,128 610,128" fill="none" stroke="#2f7d4a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#pg)"/>
  <text x="806" y="120" text-anchor="end" font-size="11" fill="#2f7d4a">report completed lsa → committed_lsa ↑</text>

  <!-- contrast caption -->
  <text x="20" y="566" font-size="11.5" fill="#333"><tspan font-weight="bold" fill="#8a4b00">★ = new vs PoC.</tspan>  PoC: LogReader dispatches by tranid % worker (ignores conflict/order).</text>
  <text x="20" y="583" font-size="11.5" fill="#333">To-be (★): master computes writeset→last_committed_lsa · Coordinator dispatches · worker D.3 commit-order gate.</text>
  <text x="20" y="602" font-size="11" fill="#666"><tspan font-weight="bold">SBR</tspan> = statement-based path, incl. DDL (CREATE/ALTER/DROP, CREATE INDEX).  <tspan font-weight="bold">unknown change-set</tspan> = sysop · partial-decode · unsupported ops.  (no row writeset → serialized)</text>
</svg>
