<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="pg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f7d4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>

  <!-- LogReader -->
  <rect x="200" y="20" width="400" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2733">LogReader (Reader)</text>
  <line x1="200" y1="52" x2="600" y2="52" stroke="#cdd7e1"/>
  <text x="220" y="74" font-size="12" fill="#33414f">• read log → build LA_ITEM / LA_APPLY</text>
  <text x="220" y="94" font-size="12" fill="#33414f">• detect long tx</text>
  <text x="220" y="114" font-size="12" fill="#33414f">• enqueue committed tx → workers</text>
  <text x="220" y="134" font-size="12" fill="#33414f">• collect results → update db_ha_apply_info</text>
  <text x="220" y="154" font-size="12" fill="#33414f">• reclaim items</text>

  <!-- enqueue fan -->
  <line x1="400" y1="170" x2="400" y2="186" stroke="#555" stroke-width="1.5"/>
  <line x1="120" y1="186" x2="680" y2="186" stroke="#555" stroke-width="1.5"/>
  <line x1="120" y1="186" x2="120" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <line x1="400" y1="186" x2="400" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <line x1="680" y1="186" x2="680" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <text x="412" y="182" font-size="11" fill="#777">enqueue committed tx</text>


  <!-- workers -->
  <g>
    <rect x="30" y="210" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="120" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker 0</text>
    <line x1="30" y1="238" x2="210" y2="238" stroke="#cdd7e1"/>
    <rect x="38" y="244" width="164" height="20" rx="4" fill="#eef1f5" stroke="#d4dbe3"/>
    <text x="46" y="258" font-size="10.5" fill="#5b6b7b"><tspan font-weight="bold">state</tspan>: queue · session · ws</text>
    <text x="44" y="286" font-size="11" fill="#33414f">• process repl items</text>
    <text x="44" y="306" font-size="11" fill="#33414f">• flush row items</text>
    <text x="44" y="326" font-size="11" fill="#33414f">• commit tx</text>
    <text x="44" y="346" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>
  <g>
    <rect x="310" y="210" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="400" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker 1</text>
    <line x1="310" y1="238" x2="490" y2="238" stroke="#cdd7e1"/>
    <rect x="318" y="244" width="164" height="20" rx="4" fill="#eef1f5" stroke="#d4dbe3"/>
    <text x="326" y="258" font-size="10.5" fill="#5b6b7b"><tspan font-weight="bold">state</tspan>: queue · session · ws</text>
    <text x="324" y="286" font-size="11" fill="#33414f">• process repl items</text>
    <text x="324" y="306" font-size="11" fill="#33414f">• flush row items</text>
    <text x="324" y="326" font-size="11" fill="#33414f">• commit tx</text>
    <text x="324" y="346" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>
  <text x="500" y="290" text-anchor="middle" font-size="18" fill="#999">· · ·</text>
  <g>
    <rect x="590" y="210" width="180" height="150" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
    <text x="680" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2733">Worker N</text>
    <line x1="590" y1="238" x2="770" y2="238" stroke="#cdd7e1"/>
    <rect x="598" y="244" width="164" height="20" rx="4" fill="#eef1f5" stroke="#d4dbe3"/>
    <text x="606" y="258" font-size="10.5" fill="#5b6b7b"><tspan font-weight="bold">state</tspan>: queue · session · ws</text>
    <text x="604" y="286" font-size="11" fill="#33414f">• process repl items</text>
    <text x="604" y="306" font-size="11" fill="#33414f">• flush row items</text>
    <text x="604" y="326" font-size="11" fill="#33414f">• commit tx</text>
    <text x="604" y="346" font-size="11" fill="#33414f">• report completed lsa</text>
  </g>

  <!-- apply converge to Slave DB -->
  <line x1="120" y1="360" x2="120" y2="392" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="360" x2="400" y2="392" stroke="#555" stroke-width="1.5"/>
  <line x1="680" y1="360" x2="680" y2="392" stroke="#555" stroke-width="1.5"/>
  <line x1="120" y1="392" x2="680" y2="392" stroke="#555" stroke-width="1.5"/>
  <line x1="400" y1="392" x2="400" y2="408" stroke="#555" stroke-width="1.5" marker-end="url(#p)"/>
  <rect x="310" y="410" width="180" height="44" rx="6" fill="#fff6e6" stroke="#d9a441"/>
  <text x="400" y="437" text-anchor="middle" font-size="13" fill="#1a2733">Slave DB / Server</text>
  <text x="412" y="386" font-size="11" fill="#777">apply &amp; commit</text>

  <!-- legend: state vs role (bottom-left, clear area) -->
  <rect x="30" y="424" width="14" height="12" rx="3" fill="#eef1f5" stroke="#d4dbe3"/>
  <text x="50" y="434" font-size="10.5" fill="#5b6b7b">= state (data structures)   • = role (does)</text>

  <!-- feedback: report completed lsa (dashed, right margin) -->
  <polyline points="770,300 788,300 788,90 600,90" fill="none" stroke="#2f7d4a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#pg)"/>
  <text x="690" y="80" text-anchor="middle" font-size="11" fill="#2f7d4a">report completed lsa &#8593;</text>
</svg>
