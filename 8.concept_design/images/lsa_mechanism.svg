<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b4524c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="230" fill="#ffffff"/>

  <!-- direction -->
  <text x="40" y="28" font-size="12" fill="#999">past</text>
  <line x1="90" y1="24" x2="520" y2="24" stroke="#cfcfcf" stroke-width="1" marker-end="url(#a)"/>
  <text x="532" y="28" font-size="12" fill="#999">newer (LSA increases)</text>

  <!-- replication log bar -->
  <rect x="40"  y="72" width="400" height="54" fill="#cfe3d4"/>
  <rect x="440" y="72" width="280" height="54" fill="#f1f3f5"/>
  <rect x="40"  y="72" width="680" height="54" rx="8" fill="none" stroke="#adb5bd"/>
  <text x="240" y="104" text-anchor="middle" font-size="14" fill="#2f7d4a">applied (in commit order)</text>
  <text x="580" y="104" text-anchor="middle" font-size="13" fill="#999">not yet applied</text>

  <!-- progress marker -->
  <line x1="440" y1="58" x2="440" y2="140" stroke="#2f7d4a" stroke-width="2"/>
  <text x="440" y="50" text-anchor="middle" font-size="13" fill="#1a2733">committed_lsa</text>
  <text x="440" y="158" text-anchor="middle" font-size="11" fill="#888">progress (how far applied)</text>

  <!-- master end marker -->
  <line x1="720" y1="58" x2="720" y2="140" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="50" text-anchor="end" font-size="13" fill="#1a2733">master log end</text>

  <!-- lag bracket -->
  <line x1="440" y1="182" x2="720" y2="182" stroke="#b4524c" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="440" y1="176" x2="440" y2="188" stroke="#b4524c" stroke-width="1.3"/>
  <text x="580" y="202" text-anchor="middle" font-size="12" fill="#b4524c">replication lag</text>

  <!-- note -->
  <text x="40" y="202" font-size="10" fill="#aaa">restart point &amp; other LSA markers: see B.3</text>
</svg>
