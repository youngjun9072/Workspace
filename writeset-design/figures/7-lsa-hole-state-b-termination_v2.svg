<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">종료 직전 committed LSA와 final LSA 사이의 hole</title>
  <desc id="desc">로그 축에서 C1과 C3은 완료됐지만 C2가 hole이다. committed LSA는 C1에 머물고 reader의 final LSA는 R까지 전진했다. 이 상태에서 종료되면 두 위치 사이에 이미 적용된 트랜잭션과 미완료 트랜잭션이 함께 존재한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526170}.h{font-size:20px;font-weight:700}.t{font-size:16px}.m{font-family:"D2Coding","Noto Sans Mono",monospace;font-size:17px}
      .done{fill:#e9f7ef;stroke:#2f855a;stroke-width:2}.hole{fill:#fff0f0;stroke:#c53030;stroke-width:2}.bound{fill:#eaf2ff;stroke:#3569b7;stroke-width:2}.read{fill:#f5f0fa;stroke:#8d67a0;stroke-width:2}.window{fill:#fff4e5;stroke:#cc7a00;stroke-width:2}
      .axis{stroke:#526170;stroke-width:3}.pointerSafe{stroke:#3569b7;stroke-width:3}.pointerRead{stroke:#8d67a0;stroke-width:3}.crash{stroke:#c53030;stroke-width:3;stroke-dasharray:9 7}
    </style>
  </defs>
  <rect width="1600" height="560" fill="#fff"/>
  <text x="55" y="52" class="title">종료 직전 · 안전한 완료 위치와 reader의 최고 위치 사이에 hole이 남는다</text>
  <text x="55" y="84" class="sub">그림 6-2-2b의 상태 B: C1 완료 · C2 미완료 · C3 선완료</text>

  <line x1="120" y1="270" x2="1470" y2="270" class="axis"/>

  <rect x="250" y="225" width="150" height="90" rx="12" class="done"/>
  <text x="325" y="260" text-anchor="middle" class="h">C1 ✓</text><text x="325" y="289" text-anchor="middle" class="t">DB COMMIT 완료</text>
  <rect x="610" y="225" width="150" height="90" rx="12" class="hole"/>
  <text x="685" y="260" text-anchor="middle" class="h">C2</text><text x="685" y="289" text-anchor="middle" class="t">미완료 hole</text>
  <rect x="970" y="225" width="150" height="90" rx="12" class="done"/>
  <text x="1045" y="260" text-anchor="middle" class="h">C3 ✓</text><text x="1045" y="289" text-anchor="middle" class="t">DB COMMIT 완료</text>
  <circle cx="1350" cy="270" r="12" class="read"/>
  <text x="1350" y="245" text-anchor="middle" class="m">R</text>

  <line x1="325" y1="315" x2="325" y2="405" class="pointerSafe"/>
  <path d="M313 327L325 315L337 327" fill="none" class="pointerSafe"/>
  <rect x="155" y="405" width="340" height="78" rx="11" class="bound"/>
  <text x="325" y="436" text-anchor="middle" class="h">committed_lsa = C1</text>
  <text x="325" y="463" text-anchor="middle" class="t">빈 구간 없이 완료된 안전 경계</text>

  <line x1="1350" y1="125" x2="1350" y2="258" class="pointerRead"/>
  <path d="M1338 246L1350 258L1362 246" fill="none" class="pointerRead"/>
  <rect x="1180" y="112" width="340" height="78" rx="11" class="read"/>
  <text x="1350" y="143" text-anchor="middle" class="h">final_lsa = R</text>
  <text x="1350" y="170" text-anchor="middle" class="t">reader가 도달한 복구 상한</text>

  <path d="M420 350V335H1330V350" fill="none" stroke="#cc7a00" stroke-width="3"/>
  <rect x="610" y="355" width="530" height="72" rx="11" class="window"/>
  <text x="875" y="384" text-anchor="middle" class="h">재시작 복구 구간 (C1, R]</text>
  <text x="875" y="411" text-anchor="middle" class="t">이미 적용된 C3과 미완료 C2가 함께 존재</text>

  <line x1="1470" y1="175" x2="1470" y2="360" class="crash"/>
  <text x="1470" y="395" text-anchor="middle" class="h" fill="#c53030">프로세스 종료</text>

  <rect x="450" y="505" width="700" height="38" rx="8" fill="#17212b"/>
  <text x="800" y="530" text-anchor="middle" style="font:700 15px 'Pretendard','Noto Sans KR',sans-serif;fill:#fff">종료 후에는 이 구간을 다시 처리해야 하므로 final_lsa를 복구 모드의 끝으로 사용한다.</text>
</svg>
