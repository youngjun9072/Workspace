<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">최소 부하 worker 선택</title>
  <desc id="desc">왼쪽의 reader coordinator가 오른쪽에 세로로 배치한 worker들의 대기 task와 실행 중 task를 합산하고, 부하가 가장 작은 worker 1을 선택해 Dispatch Order 기록 뒤 task를 전달한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#64748b}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#64748b}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
      .reader{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.task{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.worker{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.selected{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}.load{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.loadBest{fill:#dcfce7;stroke:#22c55e;stroke-width:1.5}.order{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.note{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.green{fill:none;stroke:#16a34a;stroke-width:3;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1180" height="680" fill="#fff"/>
  <text x="40" y="44" class="title">queue 대기 수와 실행 중인 task 수를 더해 worker를 고른다</text>
  <text x="40" y="73" class="sub">worker 부하 = queue에서 기다리는 task 수 + 현재 실행 중이면 1</text>

  <rect x="40" y="125" width="350" height="150" rx="18" class="reader"/>
  <text x="215" y="161" text-anchor="middle" class="head">reader/coordinator</text>
  <rect x="105" y="188" width="220" height="60" rx="12" class="task"/>
  <text x="215" y="214" text-anchor="middle" class="head">gate 통과 task</text>
  <text x="215" y="238" text-anchor="middle" class="mono">T4 · seq=21</text>

  <rect x="40" y="335" width="350" height="105" rx="15" class="order"/>
  <text x="215" y="369" text-anchor="middle" class="head">Dispatch Order 기록</text>
  <text x="215" y="398" text-anchor="middle" class="mono">seq=21 · worker=1</text>
  <text x="215" y="423" text-anchor="middle" class="mono">apply→T4 slot</text>
  <path d="M215 275V330" class="line"/>

  <rect x="40" y="505" width="350" height="105" rx="14" class="note"/>
  <text x="215" y="539" text-anchor="middle" class="head">선택한 queue가 가득 찬 경우</text>
  <text x="215" y="570" text-anchor="middle" class="body">pending으로 되돌리지 않고 reader 대기</text>
  <text x="215" y="594" text-anchor="middle" class="body">빈자리가 생기면 enqueue 후 로그 읽기 재개</text>

  <text x="500" y="108" class="head">worker별 현재 부하</text>

  <rect x="500" y="125" width="620" height="125" rx="18" class="worker"/>
  <text x="535" y="162" class="head">worker[0]</text>
  <text x="535" y="198" class="body">실행 중 1</text>
  <text x="660" y="198" class="body">queue 대기 2</text>
  <rect x="920" y="153" width="155" height="68" rx="12" class="load"/>
  <text x="997" y="180" text-anchor="middle" class="small">부하</text>
  <text x="997" y="206" text-anchor="middle" class="mono">1 + 2 = 3</text>

  <rect x="500" y="285" width="620" height="125" rx="18" class="selected"/>
  <text x="535" y="322" class="head">worker[1] · 선택</text>
  <text x="535" y="358" class="body">실행 중 0</text>
  <text x="660" y="358" class="body">queue 대기 0</text>
  <rect x="920" y="313" width="155" height="68" rx="12" class="loadBest"/>
  <text x="997" y="340" text-anchor="middle" class="small">최소 부하</text>
  <text x="997" y="366" text-anchor="middle" class="mono">0 + 0 = 0</text>

  <rect x="500" y="445" width="620" height="125" rx="18" class="worker"/>
  <text x="535" y="482" class="head">worker[2]</text>
  <text x="535" y="518" class="body">실행 중 1</text>
  <text x="660" y="518" class="body">queue 대기 1</text>
  <rect x="920" y="473" width="155" height="68" rx="12" class="load"/>
  <text x="997" y="500" text-anchor="middle" class="small">부하</text>
  <text x="997" y="526" text-anchor="middle" class="mono">1 + 1 = 2</text>

  <path d="M390 387H455V347H495" class="green"/>
  <text x="433" y="328" text-anchor="middle" class="small">기록 후 enqueue</text>
  <text x="810" y="620" text-anchor="middle" class="body">부하 0인 worker를 만나면 더 비교하지 않고 바로 선택한다.</text>
</svg>
