<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc"><title id="title">STEP 1 T1: 첫 번째 seed 행 INSERT</title><desc id="desc">prev_commit_lsa와 parent_lsa가 모두 NULL이므로 dependency도 NULL이다. COMMIT C1 뒤 첫 WRITE를 게시한다.</desc><defs><style>
    text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.paneltitle{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;font-weight:600}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{font-size:13px;fill:#64748b}.step{font-size:14px;font-weight:700;fill:#fff}.oldval{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dc2626}.newval{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#059669;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.probe{fill:none;stroke:#f97316;stroke-width:2.4;marker-end:url(#orange)}.publish{fill:none;stroke:#10b981;stroke-width:2.4;marker-end:url(#green)}
    </style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#10b981"/></marker></defs><rect width="1800" height="900" fill="#fff"/><circle cx="55" cy="45" r="22" fill="#334155"/><text x="55" y="51" class="step" text-anchor="middle">1</text><text x="93" y="53" class="title" text-anchor="start">T1: 첫 번째 seed 행 INSERT</text><rect x="35" y="78" width="1730" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="104" class="small" text-anchor="start">history_start</text><text x="168" y="104" class="body" text-anchor="start">history 초기화 때 남긴 보수적 하한</text><text x="570" y="104" class="small" text-anchor="start">parent_lsa</text><text x="704" y="104" class="body" text-anchor="start">history_start와 키별 후보를 누적한 최댓값</text><text x="1120" y="104" class="small" text-anchor="start">dependency_seq</text><text x="1245" y="104" class="body" text-anchor="start">슬레이브에 전달할 선행 조건</text><text x="60" y="128" class="small" text-anchor="start">prev_commit_lsa</text><text x="220" y="128" class="body" text-anchor="start">현재 probe가 읽은 commit-order 기준</text><text x="570" y="128" class="small" text-anchor="start">write_seq / ref_seq</text><text x="720" y="128" class="body" text-anchor="start">같은 키의 마지막 변경 / 마지막 참조 위치</text><rect x="35" y="165" width="345" height="575" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="58" y="200" class="paneltitle" text-anchor="start">① 현재 행에서 충돌 키 수집</text><text x="58" y="238" class="body" text-anchor="start">최초 기동: history와 기준 LSA는 NULL</text><text x="58" y="266" class="body" text-anchor="start">seed(id=1) INSERT</text><text x="58" y="304" class="small" text-anchor="start">로컬 writeset</text><rect x="58" y="320" width="275" height="42" rx="7" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><text x="75" y="347" class="mono" text-anchor="start">H_S1</text><text x="310" y="347" class="small" text-anchor="end">WRITE</text><text x="58" y="384" class="mono" text-anchor="start">history_start = NULL</text><text x="58" y="413" class="mono" text-anchor="start">prev_commit_lsa = NULL</text><text x="58" y="442" class="body" text-anchor="start">parent_lsa = history_start = NULL에서 시작</text><rect x="410" y="165" width="610" height="575" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="435" y="200" class="paneltitle" text-anchor="start">② 로컬 키로 과거 COMMIT 조회</text><text x="438" y="230" class="paneltitle" text-anchor="start">조회 전 전역 history</text><text x="438" y="257" class="mono" text-anchor="start">history_start = NULL</text><rect x="438" y="278" width="550" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="608" y1="278" x2="608" y2="310" stroke="#94a3b8"/><line x1="733" y1="278" x2="733" y2="310" stroke="#94a3b8"/><text x="523" y="300" class="small" text-anchor="middle">hash</text><text x="670" y="300" class="small" text-anchor="middle">write_seq</text><text x="860.5" y="300" class="small" text-anchor="middle">ref_seq</text><rect x="438" y="310" width="550" height="46" fill="#fff" stroke="#94a3b8"/><text x="713.0" y="339" class="muted" text-anchor="middle">비어 있음</text><text x="438" y="475" class="paneltitle" text-anchor="start">candidate 계산과 parent_lsa 변화</text><text x="438" y="509" class="mono" text-anchor="start">parent_lsa 시작 = history_start = NULL</text><text x="438" y="538" class="mono" text-anchor="start">H_S1 WRITE 후보 = max(NULL, NULL) = NULL</text><text x="438" y="567" class="mono" text-anchor="start">parent_lsa = max(NULL, NULL) = NULL</text><path d="M380 420 H410" class="probe"/><rect x="1050" y="165" width="715" height="260" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1075" y="201" class="paneltitle" text-anchor="start">③ 슬레이브에 전달할 dependency 확정</text><text x="1075" y="244" class="body" text-anchor="start">일반 경로 → min(prev_commit_lsa, parent_lsa)</text><text x="1075" y="284" class="mono" text-anchor="start">dependency_seq = min(prev_commit_lsa=NULL, parent_lsa=NULL) = NULL</text><text x="1075" y="320" class="mono" text-anchor="start">dependency_is_ref=false</text><text x="1075" y="365" class="body" text-anchor="start">WS_LABEL: dependency=NULL, dependency_is_ref=false</text><path d="M1020 295 H1050" class="arrow"/><rect x="1050" y="455" width="715" height="285" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1075" y="491" class="paneltitle" text-anchor="start">④ COMMIT C1 뒤 history 갱신</text><text x="1075" y="530" class="mono" text-anchor="start">H_S1.write_seq = C1</text><text x="1378" y="500" class="paneltitle" text-anchor="start">갱신 뒤 전역 history</text><text x="1378" y="527" class="mono" text-anchor="start">history_start = NULL</text><rect x="1378" y="548" width="350" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="1548" y1="548" x2="1548" y2="580" stroke="#94a3b8"/><line x1="1673" y1="548" x2="1673" y2="580" stroke="#94a3b8"/><text x="1463" y="570" class="small" text-anchor="middle">hash</text><text x="1610" y="570" class="small" text-anchor="middle">write_seq</text><text x="1700.5" y="570" class="small" text-anchor="middle">ref_seq</text><rect x="1378" y="580" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1548" y1="580" x2="1548" y2="618" stroke="#cbd5e1"/><line x1="1673" y1="580" x2="1673" y2="618" stroke="#cbd5e1"/><text x="1463" y="605" class="mono" text-anchor="middle">H_S1</text><text x="1610" y="605" class="mono" text-anchor="middle">C1</text><text x="1700.5" y="605" class="mono" text-anchor="middle">—</text><path d="M1405 425 V455" class="publish"/><rect x="35" y="772" width="1730" height="91" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="805" class="small" text-anchor="start">한 장면의 순서</text><text x="190" y="805" class="body" text-anchor="start">행 연산·키 수집  →  과거 이력 조회  →  선행 후보 선택  →  dependency 기록  →  COMMIT  →  history 갱신</text><text x="60" y="839" class="small" text-anchor="start">이 장면의 결과</text><text x="190" y="839" class="body" text-anchor="start">prev_commit_lsa와 parent_lsa가 모두 NULL이므로 dependency도 NULL이다. COMMIT C1 뒤 첫 WRITE를 게시한다.</text></svg>