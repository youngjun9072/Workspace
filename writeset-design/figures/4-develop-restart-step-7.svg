<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<defs><marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker></defs>
<rect width="1200" height="540" fill="#fff"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#111827">7/7 · C1을 처리한다 — 기준선을 지나면 실제 값이 저장된다</text>
<text x="40" y="88" font-size="16" font-weight="700" fill="#374151">① 로그와 포인터</text>
<line x1="40" y1="177" x2="1160" y2="177" stroke="#374151" stroke-width="3"/>
<rect x="70" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="122" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">Q</text><text x="122" y="193" font-size="12" text-anchor="middle" fill="#6b7280">장기 TX 첫 로그</text><rect x="188" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="240" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">D0</text><text x="240" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T0 data</text><rect x="306" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="358" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R0</text><text x="358" y="193" font-size="12" text-anchor="middle" fill="#6b7280">target=D0</text><rect x="424" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="476" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C0</text><text x="476" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T0 COMMIT</text><rect x="542" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="594" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">D1</text><text x="594" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 data</text><rect x="660" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="712" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">D2</text><text x="712" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 data</text><rect x="778" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="830" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R1</text><text x="830" y="193" font-size="12" text-anchor="middle" fill="#6b7280">target=D1</text><rect x="896" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="948" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R2</text><text x="948" y="193" font-size="12" text-anchor="middle" fill="#6b7280">target=D2</text><rect x="1014" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="1066" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C1</text><text x="1066" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 COMMIT</text>
<line x1="476" y1="138" x2="476" y2="150" stroke="#6b7280" stroke-width="2"/><rect x="278" y="104" width="395" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="476" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#6b7280">last_committed_lsa = C0 · 더 이상 걸리지 않음</text><line x1="948" y1="226" x2="948" y2="204" stroke="#ea580c" stroke-width="2"/><rect x="840" y="226" width="215" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="948" y="249" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">committed_rep_lsa = R2</text><line x1="1066" y1="138" x2="1066" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="976" y="104" width="181" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1066" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">committed_lsa = C1</text>
<line x1="484" y1="292" x2="1040" y2="292" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/><text x="484" y="284" font-size="15" font-weight="700" text-anchor="start" fill="#ea580c">C0 → C1 다시 읽고 반영</text>
<text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면에서 바뀐 값</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="354" font-size="17" font-weight="700" fill="#9a3412">la_Info.committed_rep_lsa</text><text x="440" y="354" font-size="17" fill="#9a3412">R0 → R2  (R1 · R2 &gt; last_committed_rep_lsa → 적용)</text><text x="64" y="378" font-size="17" font-weight="700" fill="#9a3412">la_Info.committed_lsa</text><text x="440" y="378" font-size="17" fill="#9a3412">Q → C1  (C1 &gt; last_committed_lsa)</text><text x="64" y="402" font-size="17" font-weight="700" fill="#9a3412">la_log_commit()</text><text x="440" y="402" font-size="17" fill="#9a3412">required_lsa 재계산 → 장기 TX가 남아 Q 유지 · 데이터와 함께 DB commit</text><text x="64" y="426" font-size="14" fill="#6b7280">last_committed_lsa = C0 · last_committed_rep_lsa = R0: 이번 실행이 끝날 때까지 그대로</text>
<text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ DB</text><text x="100" y="458" font-size="15" font-weight="700" fill="#ea580c">_db_ha_apply_info: committed_lsa = C1 · committed_rep_lsa = R2 · required_lsa = Q   (la_log_commit()으로 확정)</text>
<rect x="0" y="476" width="1200" height="64" fill="#0f172a"/>
<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">C0를 지나면 기준선은 더 이상 걸리지 않는다. 다음 기동은 C1·R2로 새 기준선을 찍는다.</text>
</svg>