<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm 1 · add_pke의 키 수집과 폴백 상태 표시</title>
  <desc id="desc">행 이미지를 add_pke에 전달하면 PK와 UNIQUE 키, 자식 FK 키를 조립하고 generate_hash_pke를 호출한다. 생성된 해시는 transaction writeset에 저장하며, 참조되는 부모 테이블과 최종 해시 없음은 별도의 상태 플래그로 전달한다.</desc>
  <defs>
    <style>
      .h1{font:700 28px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}
      .h2{font:400 14px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#657488}
      .module-title{font:700 19px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#294965}
      .bh{font:700 15px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}
      .tx{font:400 13px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}
      .sm{font:400 12px 'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#667487}
      .mono{font:400 12px monospace;fill:#445062}
      .module{fill:#f7fafc;stroke:#47769e;stroke-width:2.4}
      .input{fill:#eef5fb;stroke:#5681ad;stroke-width:1.6}
      .key{fill:#e8f5ec;stroke:#3fa35b;stroke-width:1.6}
      .fk{fill:#f5edf7;stroke:#97558a;stroke-width:1.6}
      .fkvalue{fill:#fff;stroke:#b786ae;stroke-width:1.1}
      .gate{fill:#fff7e8;stroke:#d9822b;stroke-width:1.8}
      .callee{fill:#fff;stroke:#74869a;stroke-width:1.4;stroke-dasharray:6 4}
      .flag{fill:#fff0f0;stroke:#c94b4b;stroke-width:2.2}
      .neutral{fill:#f4f7fa;stroke:#8996a8;stroke-width:1.4}
      .out{fill:#edf7f0;stroke:#378f51;stroke-width:1.8}
      .out-flags{fill:#fff5ec;stroke:#cb7625;stroke-width:1.8}
      .terminal{fill:#fafbfd;stroke:#8996a8;stroke-width:1.3;stroke-dasharray:7 5}
      .band{fill:#fff;stroke:#a8b2bf;stroke-width:1.2;stroke-dasharray:7 5}
      .arrow{stroke:#526174;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .call{stroke:#74869a;stroke-width:1.8;stroke-dasharray:5 4;fill:none;marker-end:url(#c)}
      .hash{stroke:#378f51;stroke-width:2.2;fill:none;marker-end:url(#g)}
      .yes{stroke:#3fa35b;stroke-width:2.2;fill:none;marker-end:url(#g)}
      .no{stroke:#d9822b;stroke-width:2.2;fill:none;marker-end:url(#o)}
      .state{stroke:#cb7625;stroke-width:1.9;stroke-dasharray:6 4;fill:none;marker-end:url(#o)}
      .fallback{stroke:#c94b4b;stroke-width:2.5;fill:none;marker-end:url(#r)}
      .fallback-state{stroke:#c94b4b;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#r)}
      .handoff{stroke:#294965;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#74869a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#378f51"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#cb7625"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94b4b"/></marker>
  </defs>

  <rect width="1800" height="900" fill="#fff"/>
  <text x="35" y="45" class="h1">Algorithm 1 · add_pke의 키 수집과 폴백 상태 표시</text>
  <text x="35" y="73" class="h2">행 이미지는 add_pke()에 입력된다. add_pke()는 키 해시와 상태 플래그를 서로 다른 출력으로 만들고, 실제 의존성 판정은 커밋 시 수행한다.</text>

  <!-- caller input: outside add_pke -->
  <rect x="25" y="205" width="230" height="205" rx="12" class="input"/>
  <text x="140" y="242" text-anchor="middle" class="bh">행 이미지 입력</text>
  <text x="140" y="284" text-anchor="middle" class="tx">INSERT · 새 행</text>
  <text x="140" y="318" text-anchor="middle" class="tx">DELETE · 기존 행</text>
  <text x="140" y="352" text-anchor="middle" class="tx">UPDATE · old/new 행</text>
  <text x="140" y="387" text-anchor="middle" class="sm">변경 종류에 맞는 record 전달</text>

  <!-- add_pke module boundary -->
  <rect x="335" y="105" width="1075" height="700" rx="18" class="module"/>
  <rect x="360" y="88" width="190" height="35" rx="8" fill="#f7fafc"/>
  <text x="377" y="113" class="module-title">add_pke(record)</text>
  <text x="1380" y="129" text-anchor="end" class="sm">키 조립 · 하위 해시 함수 호출 · 상태 표시</text>

  <path d="M255 307H335" class="arrow"/>
  <text x="295" y="292" text-anchor="middle" class="mono">record</text>

  <!-- control flow inside add_pke -->
  <polygon points="380,220 480,145 580,220 480,295" class="gate"/>
  <text x="480" y="204" text-anchor="middle" class="bh">1. PK 역할 인덱스가</text>
  <text x="480" y="231" text-anchor="middle" class="bh">있는가?</text>
  <text x="480" y="261" text-anchor="middle" class="mono">primary_key &lt; MAX_KEY</text>

  <rect x="650" y="145" width="215" height="150" rx="11" class="key"/>
  <text x="757" y="180" text-anchor="middle" class="bh">2. PK·UNIQUE 키 조립</text>
  <text x="757" y="216" text-anchor="middle" class="tx">HA_NOSAME 인덱스</text>
  <text x="757" y="247" text-anchor="middle" class="tx">인덱스·DB·테이블·키 값</text>
  <text x="757" y="276" text-anchor="middle" class="sm">일반 INDEX 제외</text>

  <rect x="925" y="125" width="240" height="195" rx="12" class="fk"/>
  <text x="1045" y="151" text-anchor="middle" class="bh">3. 자식 FK</text>
  <text x="1045" y="174" text-anchor="middle" class="bh">→ 부모 키 형식으로 조립</text>
  <rect x="945" y="184" width="200" height="28" rx="7" class="fkvalue"/>
  <text x="1045" y="203" text-anchor="middle" class="mono">값 출처: child.pid = 7</text>
  <text x="1045" y="234" text-anchor="middle" class="tx">부모 UNIQUE 인덱스명 +</text>
  <text x="1045" y="256" text-anchor="middle" class="tx">부모 DB·테이블 + FK 값</text>
  <text x="1045" y="282" text-anchor="middle" class="mono">해시 예: H(parent, PRIMARY, 7)</text>
  <text x="1050" y="304" text-anchor="middle" class="sm">부모 키와 같은 충돌 공간</text>

  <polygon points="1230,220 1310,145 1390,220 1310,295" class="gate"/>
  <text x="1310" y="191" text-anchor="middle" class="bh">4. 현재 테이블이</text>
  <text x="1310" y="218" text-anchor="middle" class="bh">다른 FK에서 참조되는</text>
  <text x="1310" y="245" text-anchor="middle" class="bh">부모인가?</text>
  <text x="1310" y="273" text-anchor="middle" class="mono">foreign_key_parents &gt; 0</text>

  <path d="M580 220H650" class="yes"/>
  <text x="611" y="205" class="sm">YES</text>
  <path d="M865 220H925" class="arrow"/>
  <path d="M1165 220H1230" class="arrow"/>

  <!-- nested/callee calls: visually subordinate -->
  <rect x="650" y="370" width="215" height="105" rx="10" class="callee"/>
  <text x="757" y="398" text-anchor="middle" class="sm">호출하는 하위 함수</text>
  <text x="757" y="431" text-anchor="middle" class="mono">generate_hash_pke()</text>
  <text x="757" y="458" text-anchor="middle" class="sm">PK·UNIQUE 해시 생성·저장</text>
  <path d="M757 295V370" class="call"/>
  <text x="770" y="338" class="sm">키 전달</text>

  <rect x="945" y="370" width="215" height="105" rx="10" class="callee"/>
  <text x="1052" y="398" text-anchor="middle" class="sm">호출하는 하위 함수</text>
  <text x="1052" y="431" text-anchor="middle" class="mono">generate_hash_pke()</text>
  <text x="1052" y="458" text-anchor="middle" class="sm">FK 해시 생성·저장</text>
  <path d="M1050 320V370" class="call"/>
  <text x="1063" y="349" class="sm">조립된 표현 전달</text>

  <!-- hash result bus to writeset output -->
  <circle cx="757" cy="535" r="5" fill="#378f51"/>
  <circle cx="1052" cy="535" r="5" fill="#378f51"/>
  <path d="M757 475V535H1390" class="hash"/>
  <path d="M1052 475V535" class="hash"/>
  <text x="880" y="522" class="sm">생성된 해시를 transaction writeset에 저장</text>

  <!-- related-FK state, separate from hash -->
  <rect x="1195" y="370" width="190" height="155" rx="10" class="neutral"/>
  <text x="1290" y="401" text-anchor="middle" class="bh">부모 참조 플래그 표시</text>
  <text x="1290" y="431" text-anchor="middle" class="mono">has_related_</text>
  <text x="1290" y="452" text-anchor="middle" class="mono">foreign_keys</text>
  <text x="1290" y="479" text-anchor="middle" class="sm">여기서는 상태만 기록</text>
  <text x="1290" y="500" text-anchor="middle" class="sm">→ Algorithm 2에서</text>
  <text x="1290" y="517" text-anchor="middle" class="sm">writeset 사용 가능 여부 판정</text>
  <path d="M1310 295V370" class="arrow"/>
  <text x="1323" y="337" class="sm">YES</text>
  <path d="M1230 252H1185V500" class="yes"/>
  <text x="1200" y="331" text-anchor="middle" class="sm">NO</text>

  <!-- common check outside the PK-gate block, still inside add_pke -->
  <rect x="370" y="605" width="995" height="155" rx="12" class="band"/>
  <text x="392" y="632" class="bh">5. PK gate 바깥의 공통 후처리</text>
  <text x="392" y="654" class="sm">PK gate의 NO 경로와 키 추출 경로가 모두 이 검사로 합류한다.</text>

  <rect x="590" y="674" width="270" height="62" rx="9" class="neutral"/>
  <text x="725" y="699" text-anchor="middle" class="mono">if (!writeset_hashes_added)</text>
  <text x="725" y="721" text-anchor="middle" class="sm">최종 해시가 하나도 없는가?</text>

  <rect x="1010" y="674" width="285" height="62" rx="9" class="flag"/>
  <text x="1152" y="699" text-anchor="middle" class="bh">missing-key 플래그 표시</text>
  <text x="1152" y="722" text-anchor="middle" class="mono">set_has_missing_keys()</text>

  <path d="M480 295V570H725V674" class="no"/>
  <text x="494" y="373" class="sm">NO</text>
  <path d="M1185 500V570H800V674" class="arrow"/>
  <path d="M1290 525V570H1185" class="arrow"/>
  <path d="M860 705H1010" class="no"/>
  <text x="922" y="690" class="sm">YES</text>
  <text x="725" y="756" text-anchor="middle" class="sm">NO → 추가 플래그 없음</text>

  <!-- outputs outside add_pke -->
  <text x="1605" y="123" text-anchor="middle" class="module-title">add_pke() 출력</text>
  <rect x="1480" y="160" width="270" height="155" rx="12" class="out"/>
  <text x="1615" y="195" text-anchor="middle" class="bh">transaction writeset</text>
  <text x="1615" y="235" text-anchor="middle" class="mono">{ H(PK), H(UNIQUE), H(FK), ... }</text>
  <text x="1615" y="268" text-anchor="middle" class="tx">generate_hash_pke()가 저장한</text>
  <text x="1615" y="291" text-anchor="middle" class="tx">종류 없는 해시 집합</text>
  <path d="M1390 535H1445V237H1480" class="hash"/>

  <rect x="1480" y="385" width="270" height="190" rx="12" class="out-flags"/>
  <text x="1615" y="420" text-anchor="middle" class="bh">상태 플래그</text>
  <text x="1615" y="458" text-anchor="middle" class="mono">has_related_foreign_keys</text>
  <text x="1615" y="484" text-anchor="middle" class="sm">참조되는 부모 테이블</text>
  <line x1="1510" y1="505" x2="1720" y2="505" stroke="#d8a16d" stroke-width="1"/>
  <text x="1615" y="535" text-anchor="middle" class="mono">missing-key</text>
  <text x="1615" y="558" text-anchor="middle" class="sm">최종 writeset 해시 없음</text>
  <path d="M1385 447H1480" class="state"/>
  <path d="M1295 705H1435V535H1480" class="state"/>

  <!-- compact hand-off -->
  <rect x="1480" y="665" width="270" height="82" rx="10" class="terminal"/>
  <text x="1615" y="690" text-anchor="middle" class="sm">키 해시와 상태 플래그를 전달</text>
  <text x="1615" y="715" text-anchor="middle" class="bh">→ Algorithm 2</text>
  <text x="1615" y="737" text-anchor="middle" class="tx">커밋 시 의존성 판정</text>
  <path d="M1575 315V635H1588V665" class="handoff"/>
  <path d="M1655 575V635H1642V665" class="handoff"/>

  <rect x="1182" y="132" width="221" height="406" rx="16" fill="none" stroke="#d83b3b" stroke-width="4" pointer-events="none"/>
  <text x="900" y="866" text-anchor="middle" class="sm">이 단계에서는 commit-order 유지, history_start 갱신, history clear를 수행하지 않는다.</text>
</svg>
