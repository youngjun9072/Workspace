<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">역할 전환 drain에서 남은 작업을 모두 소진하는 순환</title>
  <desc id="desc">새 task 유입을 차단한 뒤 남은 task를 기존 dependency gate로 판정한다. dependency가 없거나 충족된 task는 worker가 실행하고, 미충족 task는 pending에 둔다. 완료 결과를 수거해 완료 상태와 연속 완료 경계를 갱신한 뒤 pending task를 같은 gate에서 다시 판정한다. 이 순환으로 이미 받아들인 작업을 모두 소진하면 승격 가능 여부를 판정한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}
      .title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#526170}
      .h{font-size:21px;font-weight:700}.t{font-size:17px}.small{font-size:15px;fill:#526170}
      .blocked{fill:#fff0f0;stroke:#c53030;stroke-width:2}
      .gate{fill:#f5f0fa;stroke:#8d67a0;stroke-width:2}
      .ready{fill:#e9f7ef;stroke:#2f855a;stroke-width:2}
      .pending{fill:#fff4e5;stroke:#cc7a00;stroke-width:2}
      .state{fill:#eaf2ff;stroke:#3569b7;stroke-width:2}
      .finish{fill:#eef7ff;stroke:#4a7ca8;stroke-width:2}
      .arrow{stroke:#526170;stroke-width:3;fill:none}
      .loop{stroke:#cc7a00;stroke-width:3;fill:none;stroke-dasharray:8 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526170"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#cc7a00"/>
    </marker>
  </defs>

  <rect width="1600" height="820" fill="#fff"/>
  <text x="55" y="54" class="title">failover drain · 신규 유입을 막고 남은 작업을 같은 gate로 소진한다</text>
  <text x="55" y="88" class="sub">dependency의 존재 자체가 아니라 현재 충족 여부가 worker 배정과 pending 보류를 가른다.</text>

  <rect x="55" y="134" width="310" height="92" rx="13" class="blocked"/>
  <text x="210" y="170" text-anchor="middle" class="h">신규 task 유입 차단</text>
  <text x="210" y="201" text-anchor="middle" class="t">이미 받아들인 작업만 처리</text>

  <path d="M365 180H465" class="arrow" marker-end="url(#arrow)"/>
  <rect x="465" y="134" width="330" height="92" rx="13" class="state"/>
  <text x="630" y="170" text-anchor="middle" class="h">남은 task 가져오기</text>
  <text x="630" y="201" text-anchor="middle" class="t">대기 · 실행 · 결과 처리 대상</text>

  <path d="M795 180H895" class="arrow" marker-end="url(#arrow)"/>
  <polygon points="1070,116 1245,180 1070,244 895,180" class="gate"/>
  <text x="1070" y="166" text-anchor="middle" class="h">dependency gate</text>
  <text x="1070" y="198" text-anchor="middle" class="t">없음 또는 충족?</text>

  <path d="M1070 244V321" class="arrow" marker-end="url(#arrow)"/>
  <text x="1092" y="285" class="t">예</text>
  <rect x="900" y="321" width="340" height="94" rx="13" class="ready"/>
  <text x="1070" y="358" text-anchor="middle" class="h">worker에 배정 · 실행</text>
  <text x="1070" y="389" text-anchor="middle" class="t">DB COMMIT 결과 반환</text>

  <path d="M895 180H735V321" class="arrow" marker-end="url(#arrow)"/>
  <text x="790" y="165" class="t">아니요</text>
  <rect x="565" y="321" width="340" height="94" rx="13" class="pending"/>
  <text x="735" y="358" text-anchor="middle" class="h">pending에 보류</text>
  <text x="735" y="389" text-anchor="middle" class="t">dependency 상태가 바뀔 때까지 대기</text>

  <path d="M1070 415V500" class="arrow" marker-end="url(#arrow)"/>
  <rect x="855" y="500" width="430" height="112" rx="13" class="state"/>
  <text x="1070" y="539" text-anchor="middle" class="h">coordinator가 완료 결과 수거</text>
  <text x="1070" y="572" text-anchor="middle" class="t">개별 완료 상태 등록</text>
  <text x="1070" y="599" text-anchor="middle" class="t">연속 완료 경계 전진</text>

  <path d="M855 556H735V415" class="loop" marker-end="url(#loopArrow)"/>
  <text x="589" y="514" class="t">완료 상태 변경</text>
  <path d="M565 368H425V180H895" class="loop" marker-end="url(#loopArrow)"/>
  <text x="445" y="348" class="t">pending task를 꺼내</text>
  <text x="445" y="374" class="t">같은 gate로 재판정</text>

  <path d="M1285 556H1370V675" class="arrow" marker-end="url(#arrow)"/>
  <text x="1300" y="535" class="small">남은 작업이 있으면 순환 반복</text>
  <rect x="1160" y="675" width="420" height="92" rx="13" class="finish"/>
  <text x="1370" y="711" text-anchor="middle" class="h">받아들인 작업 모두 소진</text>
  <text x="1370" y="742" text-anchor="middle" class="t">승격 가능 여부 판정으로 이동</text>

  <rect x="55" y="675" width="920" height="92" rx="13" fill="#f7f8fa" stroke="#aeb8c2" stroke-width="2"/>
  <text x="515" y="711" text-anchor="middle" class="h">drain에서도 dependency 조건은 그대로 유지한다</text>
  <text x="515" y="742" text-anchor="middle" class="t">완료 결과가 상태를 바꾸고, 그때 풀린 pending task만 worker로 이동한다.</text>
</svg>
