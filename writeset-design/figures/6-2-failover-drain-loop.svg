<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">reader가 기존 병렬 적용 경로를 반복해 남은 작업을 drain하는 과정</title>
  <desc id="desc">copy log 처리가 끝나면 신규 task 생성을 멈춘다. reader는 worker의 병합된 result signal을 기다렸다가 여러 queue를 batch 수거하고 pending 재판정, worker 실행과 완료 상태 갱신 경로를 반복한다. 남은 작업이 없으면 안전 LSA를 영속하고 DONE을 통보한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#526170}.h{font-size:19px;font-weight:700}.t{font-size:15px}.small{font-size:13px;fill:#526170}.start{fill:#fff7ed;stroke:#f97316;stroke-width:2}.existing{fill:#ef4444;fill-opacity:.06;stroke:#dc2626;stroke-width:2.5}.work{fill:#fff;stroke:#ef4444;stroke-width:1.8}.decision{fill:#f8fafc;stroke:#64748b;stroke-width:2}.finish{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.promote{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.arrow{stroke:#526170;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.loop{stroke:#dc2626;stroke-width:2.7;fill:none;stroke-dasharray:8 6;marker-end:url(#redArrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526170"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1600" height="800" fill="#fff"/>
  <text x="52" y="50" class="title">신규 입력을 멈추고 기존 병렬 적용 경로를 반복해 남은 작업을 소진한다</text>
  <text x="52" y="80" class="sub">붉은 영역은 drain 전용 알고리즘이 아니라 정상 처리 중에도 사용하는 기존 함수 호출 경로다.</text>

  <rect x="55" y="132" width="300" height="96" rx="13" class="start"/>
  <text x="205" y="169" text-anchor="middle" class="h">copy log 처리 종료 조건</text>
  <text x="205" y="199" text-anchor="middle" class="t">신규 task 생성·배정 중단</text>
  <path d="M355 180H410" class="arrow"/>

  <rect x="410" y="108" width="720" height="520" rx="18" class="existing"/>
  <text x="440" y="143" class="h" fill="#b91c1c">기존 병렬 적용 경로 반복</text>
  <text x="440" y="167" class="small">reader loop에서 기존 함수들을 그대로 호출</text>

  <rect x="455" y="200" width="285" height="100" rx="12" class="work"/>
  <text x="598" y="237" text-anchor="middle" class="h">pending 재판정</text>
  <text x="598" y="268" text-anchor="middle" class="t">풀린 task를 worker에 배정</text>

  <path d="M740 250H800" class="arrow"/>
  <rect x="810" y="200" width="275" height="100" rx="12" class="work"/>
  <text x="948" y="237" text-anchor="middle" class="h">worker 실행</text>
  <text x="948" y="268" text-anchor="middle" class="t">적용·DB COMMIT·result 반환</text>

  <path d="M948 300V318" class="arrow"/>
  <rect x="810" y="322" width="275" height="42" rx="10" class="decision"/>
  <text x="948" y="348" text-anchor="middle" class="t">result_pending · condition signal</text>
  <path d="M948 364V370" class="arrow"/>
  <rect x="810" y="375" width="275" height="112" rx="12" class="work"/>
  <text x="948" y="411" text-anchor="middle" class="h">result 수거</text>
  <text x="948" y="442" text-anchor="middle" class="t">worker result queue 수거</text>
  <text x="948" y="467" text-anchor="middle" class="t">Dispatch Order에 연결</text>

  <path d="M810 431H750" class="arrow"/>
  <rect x="455" y="375" width="285" height="112" rx="12" class="work"/>
  <text x="598" y="411" text-anchor="middle" class="h">완료 상태 갱신</text>
  <text x="598" y="442" text-anchor="middle" class="t">completed set·frontier 갱신</text>
  <text x="598" y="467" text-anchor="middle" class="t">준비된 결과 retire</text>

  <path d="M598 375V310" class="loop"/>
  <text x="620" y="344" class="small">같은 gate로 재판정</text>

  <path d="M740 475V555H1135V475H1165" class="arrow"/>
  <text x="825" y="546" class="small">한 번의 처리 결과로 drain 상태 확인</text>
  <polygon points="1300,385 1435,475 1300,565 1165,475" class="decision"/>
  <text x="1300" y="462" text-anchor="middle" class="h">남은 작업 없음?</text>
  <text x="1300" y="490" text-anchor="middle" class="small">상세 조건은 그림 14-3</text>

  <path d="M1300 385V335H1090" class="loop"/>
  <text x="1180" y="320" text-anchor="middle" class="t">아니요 · 다음 result signal 대기</text>

  <path d="M1300 565V640" class="arrow"/>
  <text x="1320" y="607" class="t">예</text>
  <rect x="1110" y="650" width="380" height="96" rx="13" class="finish"/>
  <text x="1300" y="686" text-anchor="middle" class="h">안전 LSA 영속 · DONE 통보</text>
  <text x="1300" y="716" text-anchor="middle" class="t">상위 HA 절차에서 승격 가능</text>

  <rect x="55" y="650" width="950" height="96" rx="13" class="promote"/>
  <text x="530" y="686" text-anchor="middle" class="h">drain에서도 dependency gate 규칙을 바꾸지 않는다</text>
  <text x="530" y="716" text-anchor="middle" class="t">완료 결과가 상태를 바꾸고, 그 결과로 실행 가능해진 pending task만 worker로 보낸다.</text>
</svg>
