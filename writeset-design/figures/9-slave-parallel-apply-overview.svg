<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#64748b}
      .box{rx:14;stroke-width:2}.log{fill:#eff6ff;stroke:#3b82f6}.reader{fill:#f8fafc;stroke:#64748b}.memory{fill:#ecfeff;stroke:#0891b2}
      .gate{fill:#f0fdf4;stroke:#16a34a}.pending{fill:#fff7ed;stroke:#f97316}.queue{fill:#f5f3ff;stroke:#8b5cf6}.worker{fill:#faf5ff;stroke:#9333ea}
      .result{fill:#fff1f2;stroke:#e11d48}.complete{fill:#fffbeb;stroke:#d97706}.db{fill:#f1f5f9;stroke:#475569}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#dc2626;stroke-width:2.5;marker-end:url(#red)}
      .loop{fill:none;stroke:#f97316;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#orange)}.statearrow{fill:none;stroke:#64748b;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#f97316"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="55" y="55" class="title">슬레이브 병렬 적용 전체 구조</text>
  <text x="55" y="86" class="small">reader/coordinator는 로그 수집·실행 판정·완료 상태 갱신을 맡고, worker는 DB 적용 결과만 반환한다.</text>

  <rect x="55" y="145" width="210" height="245" class="box log"/>
  <text x="160" y="182" text-anchor="middle" class="head">copy log</text>
  <rect x="85" y="210" width="150" height="42" class="box log"/><text x="160" y="237" text-anchor="middle" class="body">REPL items</text>
  <rect x="85" y="270" width="150" height="42" class="box gate"/><text x="160" y="297" text-anchor="middle" class="body">WS_LABEL</text>
  <rect x="85" y="330" width="150" height="42" class="box pending"/><text x="160" y="357" text-anchor="middle" class="body">LOG_COMMIT</text>

  <rect x="330" y="115" width="650" height="655" class="box reader"/>
  <text x="655" y="153" text-anchor="middle" class="head">reader / coordinator</text>
  <text x="655" y="174" text-anchor="middle" class="small">결과가 있으면 처리 · 없으면 로그 읽기 계속</text>

  <rect x="370" y="190" width="570" height="120" class="box memory"/>
  <text x="655" y="224" text-anchor="middle" class="head">trid별 LA_APPLY transaction slot</text>
  <rect x="405" y="245" width="230" height="42" class="box memory"/><text x="520" y="271" text-anchor="middle" class="body">T1: LA_ITEM → …</text>
  <rect x="675" y="245" width="230" height="42" class="box memory"/><text x="790" y="271" text-anchor="middle" class="body">T2: LA_ITEM → …</text>

  <rect x="370" y="330" width="570" height="76" class="box memory"/>
  <text x="655" y="361" text-anchor="middle" class="head">COMMIT에서 task 완성</text>
  <text x="655" y="386" text-anchor="middle" class="small">task.apply → LA_APPLY · dependency · commit_lsa</text>

  <rect x="370" y="440" width="570" height="76" class="box gate"/>
  <text x="655" y="471" text-anchor="middle" class="head">dependency gate</text>
  <text x="655" y="496" text-anchor="middle" class="small">선행 조건이 현재 완료 상태에서 충족됐는지 판정</text>

  <rect x="370" y="560" width="170" height="105" class="box pending"/>
  <text x="455" y="594" text-anchor="middle" class="head">pending</text>
  <text x="455" y="619" text-anchor="middle" class="small">dependency 미충족 task</text>
  <text x="455" y="641" text-anchor="middle" class="small">완료 상태 변경 뒤 재판정</text>
  <rect x="570" y="560" width="170" height="105" class="box queue"/>
  <text x="655" y="594" text-anchor="middle" class="head">Gate Order</text>
  <text x="655" y="619" text-anchor="middle" class="small">COMMIT 순서 보존</text>
  <text x="655" y="641" text-anchor="middle" class="small">frontier 계산</text>
  <rect x="770" y="560" width="170" height="105" class="box queue"/>
  <text x="855" y="594" text-anchor="middle" class="head">Dispatch Order</text>
  <text x="855" y="619" text-anchor="middle" class="small">배정 순번·task·slot 보존</text>
  <text x="855" y="641" text-anchor="middle" class="small">result가 돌아오면 연결</text>

  <path d="M265 267H370" class="arrow"/>
  <text x="317" y="250" text-anchor="middle" class="small">순서대로 읽기</text>
  <path d="M655 310V330" class="arrow"/>
  <path d="M655 406V440" class="arrow"/>
  <path d="M515 516V535H455V560" class="loop"/>
  <text x="430" y="539" class="small">미충족</text>
  <path d="M940 368H960V540H655V560" class="statearrow"/>
  <text x="690" y="532" class="small">모든 task의 COMMIT 순서 등록</text>

  <rect x="1040" y="160" width="230" height="115" class="box queue"/>
  <text x="1155" y="196" text-anchor="middle" class="head">worker task queue</text>
  <text x="1155" y="226" text-anchor="middle" class="body">실행 가능한 task</text>
  <text x="1155" y="252" text-anchor="middle" class="small">worker별 queue</text>
  <path d="M795 516V535H855V560" class="arrow"/>
  <text x="814" y="529" text-anchor="middle" class="small">충족</text>
  <path d="M940 612H1005V217H1040" class="arrow"/>
  <text x="982" y="592" text-anchor="middle" class="small">배정 기록 후 enqueue</text>

  <rect x="1040" y="320" width="230" height="150" class="box worker"/>
  <text x="1155" y="357" text-anchor="middle" class="head">worker 0 … N</text>
  <text x="1155" y="390" text-anchor="middle" class="body">task.apply의 item 적용</text>
  <text x="1155" y="418" text-anchor="middle" class="body">flush · DB COMMIT</text>
  <text x="1155" y="448" text-anchor="middle" class="small">전역 완료 상태는 변경하지 않음</text>
  <path d="M1155 275V320" class="arrow"/>

  <rect x="1330" y="320" width="215" height="150" class="box db"/>
  <text x="1437" y="362" text-anchor="middle" class="head">슬레이브 DB</text>
  <text x="1437" y="397" text-anchor="middle" class="body">worker별 session</text>
  <text x="1437" y="427" text-anchor="middle" class="body">COMMIT / rollback</text>
  <path d="M1270 395H1330" class="arrow"/>

  <rect x="1040" y="525" width="230" height="105" class="box result"/>
  <text x="1155" y="560" text-anchor="middle" class="head">worker result queue</text>
  <text x="1155" y="590" text-anchor="middle" class="body">성공 또는 오류</text>
  <text x="1155" y="613" text-anchor="middle" class="small">result를 먼저 queue에 저장</text>
  <path d="M1155 470V525" class="return"/>

  <rect x="1040" y="680" width="505" height="160" class="box complete"/>
  <text x="1292" y="715" text-anchor="middle" class="head">reader/coordinator의 batch 결과 처리</text>
  <text x="1292" y="741" text-anchor="middle" class="small">여러 worker queue의 결과를 묶어서 수거</text>
  <text x="1292" y="763" text-anchor="middle" class="small">결과가 없으면 로그 읽기로 복귀</text>
  <text x="1292" y="791" text-anchor="middle" class="body">완료 집합 갱신 · Gate Order로 frontier 계산</text>
  <text x="1292" y="818" text-anchor="middle" class="body">Dispatch Order 결과 확정 · 안전 완료 위치 영속</text>
  <path d="M1155 630V680" class="return"/>
  <text x="1170" y="658" class="small">수거할 결과가 생기면 reader에 알림</text>
  <path d="M1040 710H1000V800H315V612H370" class="loop"/>
  <text x="620" y="790" text-anchor="middle" class="small">완료 상태 변경 → 같은 gate 조건으로 pending 재판정</text>

  <path d="M655 665V675H1180V680" class="statearrow"/>
  <path d="M855 665V670H1390V680" class="statearrow"/>

  <text x="55" y="870" class="small">다섯 queue/순서 상태: pending · Gate Order · Dispatch Order · worker별 task queue · worker별 result queue</text>
</svg>
