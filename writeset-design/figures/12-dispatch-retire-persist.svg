<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
  <title id="title">Dispatch Order head 확정과 transaction slot 반환</title>
  <desc id="desc">준비된 Dispatch Order head T1을 확정하면서 T1의 entry와 LA_ITEM 목록을 제거하고 LA_APPLY slot은 빈 상태로 반환한다. 준비되지 않은 T2와 먼저 완료된 T3은 보존한다. 남은 slot과 frontier로 committed LSA, committed replication LSA와 required LSA를 계산해 apply-info에 저장한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#64748b}
      .head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#64748b}
      .mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.monoBold{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.dispatch{fill:#fff7ed;stroke:#f97316;stroke-width:2}
      .entry{fill:#fff;stroke:#fb923c;stroke-width:1.8}.slot{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.8}
      .item{fill:#fff;stroke:#60a5fa;stroke-width:1.4}.ready{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
      .waiting{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.removed{fill:#fef2f2;stroke:#ef4444;stroke-width:2;stroke-dasharray:8 6}
      .lsa{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.db{fill:#ecfdf5;stroke:#10b981;stroke-width:2}
      .pointer{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .greenFlow{fill:none;stroke:#059669;stroke-width:2.8;marker-end:url(#greenArrow)}
      .red{stroke:#dc2626;stroke-width:4;stroke-linecap:round}.axis{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
      .step{fill:#172033}.stepText{font-size:14px;font-weight:700;fill:#fff}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#059669"/></marker>
  </defs>

  <rect width="1540" height="900" fill="#fff"/>
  <text x="42" y="48" class="title">준비된 head를 확정하고 transaction slot을 빈 상태로 반환한다</text>
  <text x="42" y="78" class="subtitle">예시: T1은 확정할 수 있지만 T2가 아직 준비되지 않아 T3의 결과와 slot은 그대로 보존한다.</text>

  <!-- 1. Before retire -->
  <circle cx="64" cy="121" r="17" class="step"/><text x="64" y="126" text-anchor="middle" class="stepText">1</text>
  <text x="94" y="127" class="head">retire 전</text>

  <rect x="42" y="148" width="700" height="300" rx="18" class="dispatch"/>
  <text x="72" y="181" class="head">Dispatch Order FIFO</text>
  <text x="695" y="181" text-anchor="end" class="small">배정 순서</text>
  <text x="58" y="238" class="monoBold">head</text>
  <path d="M100 233H126" class="flow"/>

  <rect x="132" y="204" width="178" height="74" rx="10" class="entry"/>
  <text x="221" y="232" text-anchor="middle" class="monoBold">seq=1 · T1</text>
  <rect x="177" y="243" width="88" height="24" rx="6" class="ready"/><text x="221" y="260" text-anchor="middle" class="small">result ready</text>

  <rect x="342" y="204" width="178" height="74" rx="10" class="entry"/>
  <text x="431" y="232" text-anchor="middle" class="monoBold">seq=2 · T2</text>
  <rect x="387" y="243" width="88" height="24" rx="6" class="waiting"/><text x="431" y="260" text-anchor="middle" class="small">waiting</text>

  <rect x="552" y="204" width="158" height="74" rx="10" class="entry"/>
  <text x="631" y="232" text-anchor="middle" class="monoBold">seq=3 · T3</text>
  <rect x="587" y="243" width="88" height="24" rx="6" class="ready"/><text x="631" y="260" text-anchor="middle" class="small">result ready</text>

  <text x="72" y="330" class="head">la_Info.repl_lists</text>
  <rect x="132" y="350" width="178" height="66" rx="10" class="slot"/>
  <text x="221" y="375" text-anchor="middle" class="monoBold">LA_APPLY(T1)</text>
  <text x="221" y="399" text-anchor="middle" class="small">R1a → R1</text>
  <rect x="342" y="350" width="178" height="66" rx="10" class="slot"/>
  <text x="431" y="375" text-anchor="middle" class="monoBold">LA_APPLY(T2)</text>
  <text x="431" y="399" text-anchor="middle" class="small">start=S2 · items 유지</text>
  <rect x="552" y="350" width="158" height="66" rx="10" class="slot"/>
  <text x="631" y="375" text-anchor="middle" class="monoBold">LA_APPLY(T3)</text>
  <text x="631" y="399" text-anchor="middle" class="small">R3 · 결과 보존</text>

  <path d="M221 278V345" class="pointer"/><path d="M431 278V345" class="pointer"/><path d="M631 278V345" class="pointer"/>

  <!-- 2. Retire only T1 -->
  <circle cx="810" cy="121" r="17" class="step"/><text x="810" y="126" text-anchor="middle" class="stepText">2</text>
  <text x="840" y="127" class="head">head T1 확정</text>
  <rect x="788" y="148" width="710" height="300" rx="18" class="panel"/>

  <rect x="820" y="198" width="190" height="94" rx="12" class="removed"/>
  <text x="915" y="228" text-anchor="middle" class="monoBold">seq=1 · T1</text>
  <text x="915" y="254" text-anchor="middle" class="body">Dispatch entry 제거</text>
  <text x="915" y="277" text-anchor="middle" class="small">COMMIT node도 정리</text>
  <path d="M837 213L993 277" class="red"/><path d="M993 213L837 277" class="red"/>

  <rect x="820" y="325" width="190" height="86" rx="12" class="slot"/>
  <text x="915" y="351" text-anchor="middle" class="monoBold">[0] 빈 LA_APPLY slot</text>
  <text x="915" y="376" text-anchor="middle" class="body">LA_ITEM 제거 · tranid=0</text>
  <text x="915" y="399" text-anchor="middle" class="small">다음 트랜잭션이 재사용</text>

  <path d="M1027 262H1067" class="flow"/>
  <text x="1050" y="240" text-anchor="middle" class="small">새 head</text>

  <rect x="1076" y="198" width="180" height="78" rx="10" class="entry"/>
  <text x="1166" y="227" text-anchor="middle" class="monoBold">seq=2 · T2</text>
  <rect x="1122" y="240" width="88" height="24" rx="6" class="waiting"/><text x="1166" y="257" text-anchor="middle" class="small">waiting</text>
  <rect x="1282" y="198" width="180" height="78" rx="10" class="entry"/>
  <text x="1372" y="227" text-anchor="middle" class="monoBold">seq=3 · T3</text>
  <rect x="1328" y="240" width="88" height="24" rx="6" class="ready"/><text x="1372" y="257" text-anchor="middle" class="small">result ready</text>

  <rect x="1076" y="325" width="180" height="86" rx="10" class="slot"/>
  <text x="1166" y="354" text-anchor="middle" class="monoBold">LA_APPLY(T2)</text>
  <text x="1166" y="378" text-anchor="middle" class="small">start_lsa=S2</text>
  <text x="1166" y="399" text-anchor="middle" class="small">slot 유지</text>
  <rect x="1282" y="325" width="180" height="86" rx="10" class="slot"/>
  <text x="1372" y="354" text-anchor="middle" class="monoBold">LA_APPLY(T3)</text>
  <text x="1372" y="378" text-anchor="middle" class="small">result가 먼저 와도</text>
  <text x="1372" y="399" text-anchor="middle" class="small">slot 유지</text>
  <path d="M1166 276V320" class="pointer"/><path d="M1372 276V320" class="pointer"/>

  <!-- Flow to safe state -->
  <path d="M770 466V505H420V535" class="flow"/>
  <text x="590" y="494" text-anchor="middle" class="small">T1 정리 뒤 남은 slot과 연속 완료 경계 사용</text>

  <!-- 3. Safe LSA calculation -->
  <circle cx="64" cy="536" r="17" class="step"/><text x="64" y="541" text-anchor="middle" class="stepText">3</text>
  <text x="94" y="542" class="head">안전한 완료·보존 위치 계산</text>
  <rect x="42" y="566" width="1010" height="280" rx="18" class="lsa"/>

  <line x1="104" y1="696" x2="986" y2="696" class="axis"/>
  <g class="mono">
    <line x1="180" y1="684" x2="180" y2="708" stroke="#64748b" stroke-width="2"/><text x="180" y="730" text-anchor="middle">R1</text>
    <line x1="326" y1="684" x2="326" y2="708" stroke="#64748b" stroke-width="2"/><text x="326" y="730" text-anchor="middle">C1</text>
    <line x1="506" y1="684" x2="506" y2="708" stroke="#64748b" stroke-width="2"/><text x="506" y="730" text-anchor="middle">S2</text>
    <line x1="656" y1="684" x2="656" y2="708" stroke="#64748b" stroke-width="2"/><text x="656" y="730" text-anchor="middle">C2</text>
    <line x1="800" y1="684" x2="800" y2="708" stroke="#64748b" stroke-width="2"/><text x="800" y="730" text-anchor="middle">R3</text>
    <line x1="930" y1="684" x2="930" y2="708" stroke="#64748b" stroke-width="2"/><text x="930" y="730" text-anchor="middle">C3</text>
  </g>

  <path d="M180 671V625" class="greenFlow"/><text x="180" y="608" text-anchor="middle" class="monoBold">committed_rep_lsa=R1</text>
  <path d="M326 671V625" class="greenFlow"/><text x="326" y="583" text-anchor="middle" class="monoBold">frontier=C1</text><text x="326" y="608" text-anchor="middle" class="monoBold">committed_lsa=C1</text>
  <path d="M506 746V790" class="greenFlow"/><text x="506" y="818" text-anchor="middle" class="monoBold">required_lsa=S2</text>
  <path d="M930 671V625" class="greenFlow"/><text x="930" y="608" text-anchor="middle" class="monoBold">max_completed_lsa=C3</text>
  <rect x="604" y="758" width="320" height="56" rx="10" fill="#fff" stroke="#8b5cf6"/>
  <text x="764" y="781" text-anchor="middle" class="body">C2가 hole이므로 안전 경계는 C1</text>
  <text x="764" y="803" text-anchor="middle" class="small">C3의 완료와 T3 slot은 아직 보존</text>

  <!-- 4. Persist -->
  <path d="M1057 706H1090" class="greenFlow"/>
  <circle cx="1128" cy="536" r="17" class="step"/><text x="1128" y="541" text-anchor="middle" class="stepText">4</text>
  <text x="1158" y="542" class="head">apply-info 저장</text>
  <rect x="1098" y="566" width="400" height="280" rx="18" class="db"/>
  <text x="1298" y="607" text-anchor="middle" class="head">_db_ha_apply_info</text>
  <rect x="1142" y="640" width="312" height="132" rx="12" fill="#fff" stroke="#34d399"/>
  <text x="1170" y="674" class="mono">committed_lsa     = C1</text>
  <text x="1170" y="708" class="mono">committed_rep_lsa = R1</text>
  <text x="1170" y="742" class="mono">required_lsa      = S2</text>
  <text x="1298" y="808" text-anchor="middle" class="body">DB COMMIT 성공 뒤 재시작 기준 확정</text>
</svg>
