  <rect x="345" y="218" width="250" height="60" rx="9" class="gate"/><text x="470" y="244" text-anchor="middle" class="m">0 ≤ 0 · 통과</text><text x="470" y="265" text-anchor="middle" class="t">LC / LWM gate</text><path d="M595 248H670" class="flow"/>
  <rect x="675" y="218" width="430" height="60" rx="9" class="worker"/><text x="700" y="253" class="h">worker 1</text><rect x="825" y="231" width="245" height="34" rx="6" fill="#2c7be5"/><text x="948" y="253" text-anchor="middle" class="t" style="fill:#fff">T_PARENT 실행</text>
