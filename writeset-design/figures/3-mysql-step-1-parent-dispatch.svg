<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">1단계 T_PARENT 즉시 배정</title><desc id="d">LWM이 0일 때 LC가 0인 T_PARENT를 coordinator가 읽어 worker 1에 배정한다.</desc>
  <defs><style>.h{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}.t{font:14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}.m{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#26303d}.rail{stroke:#8a99ab;stroke-width:2;marker-end:url(#a)}.ready{fill:#e8f5ec;stroke:#3fa35b;stroke-width:2}.future{fill:#f5f6f8;stroke:#aab4c2;stroke-width:1.4;stroke-dasharray:6 4}.gate{fill:#fff7e8;stroke:#d99a2b;stroke-width:1.7}.worker{fill:#eef5fb;stroke:#5681ad;stroke-width:1.7}.flow{fill:none;stroke:#526174;stroke-width:2;marker-end:url(#a)}.cursor{fill:#2c7be5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker></defs>
  <rect width="1200" height="360" fill="#fff"/><text x="35" y="38" class="h">① T_PARENT · LC=0 ≤ LWM=0</text><text x="985" y="38" class="m">LWM=0</text>
  <text x="35" y="78" class="t">relay log · 읽기 방향</text><line x1="190" y1="73" x2="1155" y2="73" class="rail"/>
  <rect x="40" y="96" width="245" height="70" rx="9" class="ready"/><text x="162" y="125" text-anchor="middle" class="h">T_PARENT</text><text x="162" y="150" text-anchor="middle" class="m">LC=0 · SEQ=1</text>
  <rect x="310" y="96" width="245" height="70" rx="9" class="future"/><text x="432" y="125" text-anchor="middle" class="h">T_CHILD_1</text><text x="432" y="150" text-anchor="middle" class="m">LC=1</text>
  <rect x="580" y="96" width="245" height="70" rx="9" class="future"/><text x="702" y="125" text-anchor="middle" class="h">T_CHILD_2</text><text x="702" y="150" text-anchor="middle" class="m">LC=2</text>
  <rect x="850" y="96" width="305" height="70" rx="9" class="future"/><text x="1002" y="125" text-anchor="middle" class="h">T_INDEPENDENT</text><text x="1002" y="150" text-anchor="middle" class="m">LC=1</text>
