<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d">
  <title id="t">MySQL 슬레이브의 relay-log head-blocking</title>
  <desc id="d">부모 A가 완료되고 첫째 자식 Achild1이 실행 중일 때 코디네이터가 둘째 자식 Achild2의 의존성을 기다리면, 뒤의 독립 B C D는 실행 자격과 유휴 worker가 있어도 아직 읽히거나 배정되지 않는다.</desc>
  <defs>
    <style>.title{font:700 27px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#26303d}.h{font:700 17px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#26303d}.t{font:15px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#526174}.m{font:14px ui-monospace,SFMono-Regular,Consolas,'Droid Sans Mono',monospace;fill:#445062}.blocked{fill:#fff0f0;stroke:#c94b4b;stroke-width:2}.unread{fill:#f5f6f8;stroke:#aab4c2;stroke-width:1.7;stroke-dasharray:7 5}.gate{fill:#fff7e8;stroke:#d99a2b;stroke-width:1.8}.coord{fill:#eef5fb;stroke:#5681ad;stroke-width:1.7}.idle{fill:#e8f5ec;stroke:#3fa35b;stroke-width:1.6}.gaq{fill:#e8f5ec;stroke:#3fa35b;stroke-width:1.5}.queue{fill:#efe6f7;stroke:#9b6fc4;stroke-width:1.5}.arrow{fill:none;stroke:#526174;stroke-width:2.3;marker-end:url(#a)}.stop{stroke:#c94b4b;stroke-width:5}.dash{fill:none;stroke:#c94b4b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#r)}</style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94b4b"/></marker>
  </defs>
  <rect width="1600" height="720" fill="#fff"/><text x="50" y="52" class="title">MySQL 슬레이브 · Achild2의 대기가 뒤의 독립 트랜잭션을 막는 위치</text><text x="50" y="82" class="t">부모 A는 완료됐고 Achild1은 실행 중이다. 코디네이터가 Achild2에서 기다리므로 실행 가능한 B·C·D까지 도달하지 못한다.</text>
  <text x="55" y="135" class="h">relay log · 읽기 방향</text><path d="M250 130H1510" class="arrow"/>
  <rect x="55" y="170" width="300" height="125" rx="10" class="blocked"/><text x="205" y="210" text-anchor="middle" class="h">Achild2 · 둘째 자식</text><text x="205" y="247" text-anchor="middle" class="m">LC=2 &gt; LWM=1</text><text x="205" y="276" text-anchor="middle" class="t">parent_id=1 · 현재 이벤트</text>
  <rect x="390" y="170" width="300" height="125" rx="10" class="unread"/><text x="540" y="210" text-anchor="middle" class="h">B · 독립</text><text x="540" y="247" text-anchor="middle" class="m">LC=1 ≤ LWM=1</text><text x="540" y="276" text-anchor="middle" class="t">아직 읽기·배정 안 됨</text>
  <rect x="725" y="170" width="300" height="125" rx="10" class="unread"/><text x="875" y="210" text-anchor="middle" class="h">C · 독립</text><text x="875" y="247" text-anchor="middle" class="m">LC=1 ≤ LWM=1</text><text x="875" y="276" text-anchor="middle" class="t">아직 읽기·배정 안 됨</text>
  <rect x="1060" y="170" width="300" height="125" rx="10" class="unread"/><text x="1210" y="210" text-anchor="middle" class="h">D · 독립</text><text x="1210" y="247" text-anchor="middle" class="m">LC=1 ≤ LWM=1</text><text x="1210" y="276" text-anchor="middle" class="t">아직 읽기·배정 안 됨</text>
  <line x1="372" y1="155" x2="372" y2="312" class="stop"/><text x="384" y="325" class="t" style="fill:#b23d3d">STOP · reader가 Achild2 뒤로 이동하지 못함</text>
  <rect x="70" y="390" width="270" height="120" rx="11" class="coord"/><text x="205" y="430" text-anchor="middle" class="h">coordinator read cursor</text><text x="205" y="468" text-anchor="middle" class="t">현재 위치: Achild2</text><path d="M205 390V303" class="arrow"/>
  <rect x="420" y="375" width="330" height="150" rx="11" class="gate"/><text x="585" y="417" text-anchor="middle" class="h">LC / LWM gate</text><text x="585" y="455" text-anchor="middle" class="m">LC(Achild2)=2 &gt; LWM=1</text><text x="585" y="492" text-anchor="middle" class="t">Achild1의 완료를 기다림</text><path d="M340 450H420" class="arrow"/>
  <text x="585" y="548" text-anchor="middle" class="t" style="fill:#b23d3d">게이트 앞 pending queue 없음</text>
  <rect x="785" y="365" width="190" height="82" rx="9" class="gaq"/><text x="880" y="397" text-anchor="middle" class="h">GAQ · LWM=1</text><text x="880" y="426" text-anchor="middle" class="t">A 완료 · Achild1 실행 중</text>
  <path d="M785 406H770V417H750" class="arrow"/>
  <rect x="785" y="480" width="190" height="82" rx="9" class="queue"/><text x="880" y="512" text-anchor="middle" class="h">worker queue</text><text x="880" y="541" text-anchor="middle" class="t">gate 뒤 전달 버퍼</text>
  <path d="M975 521H1000" class="arrow"/>
  <rect x="1010" y="365" width="470" height="205" rx="13" fill="#fafbfd" stroke="#b5bfcc"/><text x="1045" y="405" class="h">worker pool · W1 실행 중, 나머지 여유</text>
  <rect x="1050" y="445" width="115" height="75" rx="9" class="gate"/><text x="1108" y="477" text-anchor="middle" class="h">W1</text><text x="1108" y="505" text-anchor="middle" class="t">Achild1 실행</text><rect x="1190" y="445" width="115" height="75" rx="9" class="idle"/><text x="1248" y="477" text-anchor="middle" class="h">W2</text><text x="1248" y="505" text-anchor="middle" class="t">idle</text><rect x="1330" y="445" width="115" height="75" rx="9" class="idle"/><text x="1388" y="477" text-anchor="middle" class="h">WN</text><text x="1388" y="505" text-anchor="middle" class="t">idle</text>
  <path d="M720 525V620H1500V468H1480" class="dash"/><rect x="890" y="600" width="350" height="25" fill="#fff"/><text x="1065" y="617" text-anchor="middle" class="t" style="fill:#b23d3d">게이트를 통과한 이벤트가 없어 worker 미배정</text>
  <rect x="235" y="670" width="1130" height="70" rx="10" fill="#fff0f0" stroke="#c94b4b"/><text x="800" y="713" text-anchor="middle" class="h">결과: B·C·D는 이미 실행 가능하지만 Achild2의 대기가 끝난 뒤에야 읽기와 worker 배정이 시작된다.</text>
</svg>
