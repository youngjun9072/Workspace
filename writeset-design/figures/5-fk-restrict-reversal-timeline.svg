<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">RESTRICT 또는 NO ACTION에서 부모 DELETE가 먼저 완료된 실측</title>
  <desc id="desc">의존성이 누락되어 자식 DELETE와 부모 DELETE가 모두 실행 가능한 상태에서 짧은 부모 DELETE가 0.757초 먼저 완료되고, 부모 없는 자식 1000행이 노출된 시간선이다.</desc>
  <defs>
    <style>
      .title{font:700 28px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#243142}.sub{font:15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#536477}.head{font:700 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#29384a}.body{font:15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#46566a}.strong{font:700 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#29384a}.mono{font:14px 'Noto Sans Mono CJK KR',monospace;fill:#34445a}.panel{fill:#fbfcfe;stroke:#bdc7d3;stroke-width:1.5}.child{fill:#5b8db8;stroke:#346b9a;stroke-width:1.4}.parent{fill:#f2a154;stroke:#c87424;stroke-width:1.4}.window{fill:#e15759;fill-opacity:.12;stroke:#e15759;stroke-width:1.4;stroke-dasharray:6 5}.result{fill:#fff7f6;stroke:#deaaa3;stroke-width:1.5}.note{fill:#f2f7fc;stroke:#96b2cc;stroke-width:1.3}.guide{stroke:#aab5c3;stroke-width:1;stroke-dasharray:4 5}.duration{stroke:#d9534f;stroke-width:2;fill:none;marker-start:url(#left);marker-end:url(#right)}</style>
    <marker id="left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0L0 5L10 10z" fill="#d9534f"/></marker>
    <marker id="right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker>
  </defs>
  <rect width="1500" height="500" fill="#fff"/>
  <text x="50" y="48" class="title">RESTRICT / NO ACTION: 부모 없는 자식이 노출된 역전</text>
  <text x="50" y="78" class="sub">실측 시간축은 1초를 750px로 표시한다. 같은 축척을 CASCADE·SET NULL 그림에도 적용한다.</text>

  <rect x="50" y="105" width="1400" height="72" rx="12" class="note"/>
  <text x="75" y="135" class="head">왜 동시에 실행됐는가</text>
  <text x="75" y="160" class="body">T1과 T2가 모두 과거 부모 INSERT(P0)만 기다려 runnable이 됐다. T2의 선행 완료는 실측 결과이며 항상 일어나는 것은 아니다.</text>

  <rect x="50" y="198" width="1400" height="245" rx="14" class="panel"/>
  <text x="260" y="258" text-anchor="end" class="head">T1 자식 DELETE 50,000행</text>
  <text x="260" y="326" text-anchor="end" class="head">T2 부모 DELETE 1,000행</text>
  <line x1="300" y1="225" x2="300" y2="366" class="guide"/>
  <line x1="1050" y1="225" x2="1050" y2="366" class="guide"/>
  <text x="300" y="389" text-anchor="middle" class="mono">+0.0s</text>
  <text x="1050" y="389" text-anchor="middle" class="mono">+1.0s</text>
  <rect x="396" y="235" width="568" height="113" rx="6" class="window"/>
  <rect x="300" y="239" width="664" height="31" rx="6" class="child"/>
  <text x="312" y="260" class="mono" fill="#fff">17:49:51.028</text><text x="952" y="260" text-anchor="end" class="mono" fill="#fff">51.913</text>
  <rect x="350" y="307" width="46" height="31" rx="6" class="parent"/>
  <text x="344" y="328" text-anchor="end" class="mono">51.094</text><text x="402" y="328" class="mono">51.156</text>
  <path d="M396 364H964" class="duration"/>
  <text x="680" y="405" text-anchor="middle" class="strong">T2가 0.757초 먼저 완료</text>

  <rect x="1090" y="235" width="325" height="142" rx="10" class="result"/>
  <text x="1115" y="268" class="strong">역전 창의 상태</text>
  <text x="1115" y="298" class="body">parent=0 · child=1,000</text>
  <text x="1115" y="326" class="body">자식 존재 검사 생략</text>
  <text x="1115" y="354" class="mono">fail=0 · FK error=0</text>
  <text x="750" y="478" text-anchor="middle" class="sub">빨간 영역은 부모 DELETE 완료부터 자식 DELETE 완료까지 관측된 orphan 노출 구간이다.</text>
</svg>
