ill="#6b7280">T1 COMMIT</text><rect x="896" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="948" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#374151">E1</text><text x="948" y="193" font-size="12" text-anchor="middle" fill="#6b7280">EOF · 유효 끝</text><rect x="1014" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="1066" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#374151">A1</text><text x="1066" y="193" font-size="12" text-anchor="middle" fill="#6b7280">다음 기록 위치</text>
