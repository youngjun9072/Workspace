<text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면에서 바뀐 값</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="354" font-size="17" font-weight="700" fill="#9a3412">LA_ITEM #1</text><text x="440" y="354" font-size="17" fill="#9a3412">생성 · lsa = R1 · target_lsa = D1</text><text x="64" y="378" font-size="17" font-weight="700" fill="#9a3412">LA_ITEM #2</text><text x="440" y="378" font-size="17" fill="#9a3412">생성 · lsa = R2 · target_lsa = D2</text><text x="64" y="402" font-size="17" font-weight="700" fill="#9a3412">la_Info.final_lsa</text><text x="440" y="402" font-size="17" fill="#9a3412">D1 → C1 (C1의 COMMIT 처리는 다음 단계)</text><text x="64" y="426" font-size="14" fill="#6b7280">committed_lsa = C0 · committed_rep_lsa = R0 · required_lsa = Q0 · LA_APPLY(T1).start_lsa = D1 : 그대로</text>
<text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ DB</text><text x="100" y="458" font-size="15" font-weight="400" fill="#6b7280">_db_ha_apply_info: committed_lsa = C0 · committed_rep_lsa = R0 · required_lsa = Q0 (이 장면에서 바뀌지 않음)</text>
<rect x="0" y="476" width="1200" height="64" fill="#0f172a"/>
<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">LA_ITEM.lsa는 복제 지시(R)의 위치, target_lsa는 복원할 데이터(D)의 위치다. 둘 다 아직 메모리에만 있다.</text>
