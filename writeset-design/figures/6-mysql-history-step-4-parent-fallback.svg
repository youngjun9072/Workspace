<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img"><title>T4: FK 부모 변경의 commit-order 폴백</title><desc>부모 변경은 writeset으로 좁히지 않고 commit-order 사용</desc><defs><style>text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:27px;font-weight:700}.paneltitle{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:14px;font-weight:700}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{font-size:14px;fill:#64748b}.step{font-size:15px;font-weight:700;fill:#fff}.oldval{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dc2626}.newval{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#059669;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arr)}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1600" height="820" fill="#fff"/><circle cx="55" cy="45" r="22" fill="#334155"/><text x="55" y="51" class="step" text-anchor="middle">4</text><text x="93" y="54" class="title" text-anchor="start">T4: FK 부모 변경의 commit-order 폴백</text><rect x="35" y="90" width="330" height="590" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="60" y="128" class="paneltitle" text-anchor="start">① 행 연산과 로컬 writeset</text><text x="60" y="166" class="body" text-anchor="start">parent(id=1) INSERT</text><text x="60" y="208" class="small" text-anchor="start">현재 writeset</text><rect x="60" y="228" width="275" height="38" rx="7" fill="#fff" stroke="#93c5fd"/><text x="75" y="253" class="mono" text-anchor="start">H_P1</text><text x="60" y="360" class="mono" text-anchor="start">SEQ = 4</text><text x="60" y="392" class="mono" text-anchor="start">C = 3</text><text x="60" y="432" class="muted" text-anchor="start">C는 FLUSH 전에 보관한</text><text x="60" y="456" class="muted" text-anchor="start">commit-order 입력</text><rect x="395" y="90" width="520" height="590" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="420" y="128" class="paneltitle" text-anchor="start">② 현재 해시로 전역 history 조회</text><text x="420" y="162" class="mono" text-anchor="start">history_start = 3</text><rect x="420" y="180" width="470" height="34" fill="#e2e8f0" stroke="#94a3b8"/><line x1="692.5999999999999" y1="180" x2="692.5999999999999" y2="214" stroke="#94a3b8"/><text x="556.3" y="203" class="small" text-anchor="middle">hash</text><text x="791.3" y="203" class="small" text-anchor="middle">마지막 SEQ</text><rect x="420" y="214" width="470" height="44" fill="#fff" stroke="#cbd5e1"/><text x="655.0" y="242" class="muted" text-anchor="middle">비어 있음</text><text x="420" y="395" class="mono" text-anchor="start">FK가 참조하는 부모 테이블 변경</text><text x="420" y="426" class="mono" text-anchor="start">키별 P 계산을 사용하지 않음</text><rect x="945" y="90" width="620" height="250" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="970" y="128" class="paneltitle" text-anchor="start">③ P와 최종 LC 확정</text><text x="970" y="178" class="mono" text-anchor="start">P = —</text><text x="970" y="218" class="mono" text-anchor="start">폴백: LC = C = 3</text><text x="970" y="262" class="mono" text-anchor="start">GTID: last_committed=3, sequence_number=4</text><rect x="945" y="370" width="620" height="310" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="970" y="408" class="paneltitle" text-anchor="start">④ COMMIT 뒤 history 처리</text><text x="970" y="458" class="body" text-anchor="start">commit-order 폴백: LC = C = 3</text><text x="970" y="492" class="body" text-anchor="start">COMMIT 뒤 clear, history_start=4</text><text x="1210" y="487" class="mono" text-anchor="start">history_start = 4</text><rect x="1210" y="505" width="320" height="34" fill="#e2e8f0" stroke="#94a3b8"/><line x1="1395.6" y1="505" x2="1395.6" y2="539" stroke="#94a3b8"/><text x="1302.8" y="528" class="small" text-anchor="middle">hash</text><text x="1462.8" y="528" class="small" text-anchor="middle">마지막 SEQ</text><rect x="1210" y="539" width="320" height="44" fill="#fff" stroke="#cbd5e1"/><text x="1370.0" y="567" class="muted" text-anchor="middle">비어 있음</text><path d="M365 385 H395" class="arrow"/><path d="M915 215 H945" class="arrow"/><path d="M1255 340 V370" class="arrow"/><rect x="35" y="715" width="1530" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="60" y="758" class="small" text-anchor="start">이 장면의 결과</text><text x="200" y="758" class="body" text-anchor="start">부모 변경은 writeset으로 좁히지 않고 commit-order 사용</text></svg>