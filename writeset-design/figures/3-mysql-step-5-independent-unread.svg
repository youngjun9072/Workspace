<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
  <title id="t">5단계 실행 가능한 T_INDEPENDENT도 아직 읽지 못함</title><desc id="d">같은 relay log 선에서 coordinator는 T_CHILD_2에 멈춰 있고, 뒤의 T_INDEPENDENT는 LC 조건을 만족하지만 GTID를 아직 읽지 못한다.</desc>
  <defs><style>.h{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}.t{font:14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}.m{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#26303d}.rail{stroke:#8a99ab;stroke-width:2;marker-end:url(#a)}.node{fill:#eef5fb;stroke:#5681ad;stroke-width:1.5}.long{fill:#fff3e7;stroke:#d9822b;stroke-width:2}.wait{fill:#fff0f0;stroke:#c94b4b;stroke-width:2}.unread{fill:#f5f6f8;stroke:#aab4c2;stroke-width:1.6;stroke-dasharray:6 4}.stop{stroke:#c94b4b;stroke-width:5}.red{fill:none;stroke:#c94b4b;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#r)}.cursor{fill:#c94b4b}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94b4b"/></marker></defs>
  <rect width="1200" height="350" fill="#fff"/><text x="35" y="38" class="h">⑤ 앞 GTID의 wait가 뒤의 T_INDEPENDENT 읽기를 막는다</text><text x="985" y="38" class="m">LWM=1</text>
  <text x="35" y="78" class="t">relay log · 같은 로그선</text><line x1="205" y1="73" x2="1155" y2="73" class="rail"/>
  <rect x="40" y="96" width="245" height="70" rx="9" class="node"/><text x="162" y="125" text-anchor="middle" class="h">T_PARENT</text><text x="162" y="150" text-anchor="middle" class="t">완료</text>
  <rect x="310" y="96" width="245" height="70" rx="9" class="long"/><text x="432" y="125" text-anchor="middle" class="h">T_CHILD_1 · LONG</text><text x="432" y="150" text-anchor="middle" class="t">실행 중</text>
  <rect x="580" y="96" width="245" height="70" rx="9" class="wait"/><text x="702" y="125" text-anchor="middle" class="h">T_CHILD_2</text><text x="702" y="150" text-anchor="middle" class="m">LC=2 &gt; LWM=1</text>
  <line x1="837" y1="85" x2="837" y2="177" class="stop"/><text x="849" y="195" class="t" style="fill:#b23d3d">STOP</text>
  <rect x="850" y="96" width="305" height="70" rx="9" class="unread"/><text x="1002" y="125" text-anchor="middle" class="h">T_INDEPENDENT</text><text x="1002" y="150" text-anchor="middle" class="m">LC=1 ≤ LWM=1</text>
  <path d="M702 88l-11-16h22z" class="cursor"/><path d="M702 180V235" class="red"/><text x="702" y="260" text-anchor="middle" class="m">wait_for_last_committed_trx(2)</text>
  <path d="M995 180V235" class="red"/><text x="995" y="260" text-anchor="middle" class="h" style="fill:#b23d3d">실행 조건은 충족</text><text x="995" y="286" text-anchor="middle" class="t">coordinator가 도달하지 못해 GTID 미읽기 · worker 미배정</text>
</svg>
