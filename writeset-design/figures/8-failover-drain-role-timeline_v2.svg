<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">copylogdb의 DEAD 기록부터 applylogdb DONE까지</title>
  <desc id="desc">copylogdb의 로그 페이지 요청이 server crashed 오류를 받으면 수신 로그를 정리하고 active copy log header에 DEAD를 기록한다. applylogdb는 이 header와 로그 처리 완료 조건을 확인하고 병렬 작업을 drain한 뒤 DONE을 통보한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#64748b}.step{font-size:14px;font-weight:700;fill:#fff}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#64748b}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.request{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.error{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.copy{fill:#fff7ed;stroke:#f97316;stroke-width:2}.check{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.drain{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.done{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.note{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.redArrow{fill:none;stroke:#e11d48;stroke-width:2.7;marker-end:url(#redArrow)}.greenArrow{fill:none;stroke:#059669;stroke-width:2.7;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#e11d48"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#059669"/></marker>
  </defs>

  <rect width="1600" height="650" fill="#fff"/>
  <text x="42" y="50" class="title">copylogdb가 남긴 원본 서버 상태로 applylogdb의 drain이 시작된다</text>
  <text x="42" y="80" class="sub">heartbeat 선출 경로와 분리해, 로그 수신 오류가 copy log header와 applylogdb 상태 전환으로 이어지는 경로만 표시한다.</text>

  <circle cx="145" cy="132" r="18" fill="#3b82f6"/><text x="145" y="137" text-anchor="middle" class="step">1</text>
  <circle cx="445" cy="132" r="18" fill="#e11d48"/><text x="445" y="137" text-anchor="middle" class="step">2</text>
  <circle cx="785" cy="132" r="18" fill="#f97316"/><text x="785" y="137" text-anchor="middle" class="step">3</text>
  <circle cx="1160" cy="132" r="18" fill="#22c55e"/><text x="1160" y="137" text-anchor="middle" class="step">4</text>

  <rect x="60" y="160" width="270" height="150" rx="14" class="request"/>
  <text x="195" y="194" text-anchor="middle" class="head">copylogdb 로그 페이지 요청</text>
  <text x="195" y="225" text-anchor="middle" class="mono">logwr_get_log_pages()</text>
  <text x="195" y="256" text-anchor="middle" class="body">기존 마스터 cub_server에</text>
  <text x="195" y="280" text-anchor="middle" class="body">다음 로그 페이지 요청</text>

  <path d="M335 235H385" class="redArrow"/>
  <rect x="395" y="160" width="300" height="150" rx="14" class="error"/>
  <text x="545" y="194" text-anchor="middle" class="head">수신 요청 실패</text>
  <text x="545" y="230" text-anchor="middle" class="mono">ER_NET_SERVER_CRASHED</text>
  <text x="545" y="262" text-anchor="middle" class="body">네트워크 계층이 기존 마스터를</text>
  <text x="545" y="286" text-anchor="middle" class="body">server crash로 분류</text>

  <path d="M700 235H750" class="redArrow"/>
  <rect x="760" y="160" width="350" height="150" rx="14" class="copy"/>
  <text x="935" y="194" text-anchor="middle" class="head">active copy log 갱신</text>
  <text x="935" y="224" text-anchor="middle" class="body">semisync이면 수신한 로그 페이지 flush</text>
  <text x="935" y="254" text-anchor="middle" class="mono">header.ha_server_state = DEAD</text>
  <text x="935" y="282" text-anchor="middle" class="body">header page flush 후 copylogdb 종료</text>

  <path d="M1115 235H1165" class="greenArrow"/>
  <rect x="1175" y="160" width="365" height="150" rx="14" class="check"/>
  <text x="1358" y="194" text-anchor="middle" class="head">applylogdb · la_change_state()</text>
  <text x="1358" y="224" text-anchor="middle" class="mono">server = DEAD</text>
  <text x="1358" y="252" text-anchor="middle" class="mono">is_end_of_record = true</text>
  <text x="1358" y="280" text-anchor="middle" class="mono">file = SYNCHRONIZED</text>

  <path d="M1358 315V365" class="greenArrow"/>
  <rect x="990" y="375" width="550" height="118" rx="14" class="drain"/>
  <text x="1265" y="408" text-anchor="middle" class="head">병렬 적용 drain</text>
  <text x="1265" y="439" text-anchor="middle" class="body">신규 task 생성 중단 → pending·worker 작업·COMMIT hole 소진</text>
  <text x="1265" y="468" text-anchor="middle" class="body">안전 LSA 영속 → applylogdb DONE 통보</text>

  <path d="M985 434H905" class="greenArrow"/>
  <rect x="620" y="375" width="275" height="118" rx="14" class="done"/>
  <text x="758" y="414" text-anchor="middle" class="head">applylogdb</text>
  <text x="758" y="448" text-anchor="middle" class="mono">WORKING → DONE</text>
  <text x="758" y="473" text-anchor="middle" class="small">이후 상위 HA 전환 절차에 통보</text>

  <rect x="60" y="535" width="1480" height="72" rx="12" class="note"/>
  <text x="85" y="565" class="head">구분</text>
  <text x="170" y="565" class="body">ER_HA_LW_FAILED_GET_LOG_PAGE는 copylogdb를 종료할 수 있지만 header를 DEAD로 바꾸지 않는다.</text>
  <text x="170" y="590" class="small">heartbeat의 마스터 선출과 로컬 cub_server의 ACTIVE 전환은 이 그림 밖의 별도 HA 제어 경로다.</text>
</svg>
