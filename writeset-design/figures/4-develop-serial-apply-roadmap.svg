<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <style>
      .title{font:700 26px sans-serif;fill:#0f172a}.sub{font:15px sans-serif;fill:#475569}.h{font:700 18px sans-serif;fill:#0f172a}.t{font:15px sans-serif;fill:#334155}.small{font:13px sans-serif;fill:#64748b}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.log{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.mem{fill:#fff7ed;stroke:#f97316;stroke-width:2}.db{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.restart{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1600" height="620" fill="#f8fafc"/>
  <text x="48" y="48" class="title">develop 직렬 applylogdb · 전체 처리 경로</text>
  <text x="48" y="76" class="sub">로그 읽기, 메모리 구성, FIFO 적용, DB 영속, 재시작 재독의 책임을 한 장에 연결</text>

  <rect x="50" y="145" width="240" height="160" rx="16" class="log"/>
  <text x="75" y="180" class="h">1. 마스터 로그</text>
  <text x="75" y="218" class="t">변경 데이터 record</text><text x="75" y="244" class="t">replication record</text><text x="75" y="270" class="t">COMMIT record</text>

  <rect x="350" y="125" width="300" height="200" rx="16" class="mem"/>
  <text x="375" y="160" class="h">2. scan과 메모리 구성</text>
  <text x="375" y="200" class="t">final_lsa가 로그 순서대로 전진</text>
  <text x="375" y="229" class="t">LA_APPLY · LA_ITEM 구성</text>
  <text x="375" y="258" class="t">LA_COMMIT을 FIFO에 등록</text>
  <text x="375" y="293" class="small">아직 DB 적용 완료가 아님</text>

  <rect x="710" y="145" width="250" height="160" rx="16" class="box"/>
  <text x="735" y="180" class="h">3. FIFO 직렬 적용</text>
  <text x="735" y="220" class="t">target_lsa로 데이터 복원</text>
  <text x="735" y="249" class="t">COMMIT 순서대로 적용</text>
  <text x="735" y="278" class="t">완료 LSA 갱신</text>

  <rect x="1020" y="125" width="315" height="200" rx="16" class="db"/>
  <text x="1045" y="160" class="h">4. 데이터와 진행 상태 영속</text>
  <text x="1045" y="200" class="t">변경 데이터 flush</text>
  <text x="1045" y="229" class="t">_db_ha_apply_info UPDATE</text>
  <text x="1045" y="258" class="t">DB transaction COMMIT</text>
  <text x="1045" y="293" class="small">여기까지 성공해야 재시작 기준이 됨</text>

  <path d="M290 225 H350" class="arrow"/><path d="M650 225 H710" class="arrow"/><path d="M960 225 H1020" class="arrow"/>

  <rect x="350" y="405" width="985" height="140" rx="16" class="restart"/>
  <text x="380" y="442" class="h">5. 재시작</text>
  <text x="380" y="478" class="t">DB의 committed_lsa·committed_rep_lsa를 고정 skip 기준으로 복원</text>
  <text x="380" y="507" class="t">required_lsa부터 재독 → 사라진 메모리 구조 재구성</text>
  <text x="380" y="532" class="t">→ 이미 영속된 트랜잭션·item skip</text>
  <path d="M1175 325 V370 H840 V405" class="arrow"/>
  <path d="M350 475 H245 V330 H350" class="arrow"/>
  <text x="70" y="365" class="small">보존된 로그를 다시 읽음</text>
</svg>
