<text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면에서 바뀐 값</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="354" font-size="17" font-weight="700" fill="#9a3412">la_Info.committed_lsa / committed_rep_lsa</text><text x="440" y="354" font-size="17" fill="#9a3412">NULL → C0 / R0  (la_get_last_ha_applied_info())</text><text x="64" y="378" font-size="17" font-weight="700" fill="#9a3412">la_Info.required_lsa</text><text x="440" y="378" font-size="17" fill="#9a3412">NULL → Q</text><text x="64" y="402" font-size="17" font-weight="700" fill="#9a3412">la_Info.final_lsa</text><text x="440" y="402" font-size="17" fill="#9a3412">NULL → F0  (저장 당시 applier의 읽기 위치, C0 바로 뒤)</text><text x="64" y="426" font-size="14" fill="#6b7280">last_committed_lsa · last_committed_rep_lsa: 아직 NULL  ·  LA_APPLY · LA_ITEM: 아직 없음</text>
<text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ DB</text><text x="100" y="458" font-size="15" font-weight="400" fill="#6b7280">_db_ha_apply_info: committed_lsa = C0 · committed_rep_lsa = R0 · required_lsa = Q   (이 장면에서 바뀌지 않음)</text>
<rect x="0" y="476" width="1200" height="64" fill="#0f172a"/>
<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">메모리 구조는 사라졌고 DB 행만 남았다. 이 값이 재시작의 유일한 기준이다.</text>
