<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d">
  <title id="t">4단계 T_CHILD_2 coordinator 대기</title><desc id="d">T_CHILD_1이 장기 실행 중이라 LWM이 1에 머물고 T_CHILD_2의 LC 2가 더 커 coordinator가 기다린다.</desc>
  <defs><style>.h{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}.t{font:14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}.m{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#26303d}.rail{stroke:#8a99ab;stroke-width:2;marker-end:url(#a)}.node{fill:#eef5fb;stroke:#5681ad;stroke-width:1.5}.long{fill:#fff3e7;stroke:#d9822b;stroke-width:2}.wait{fill:#fff0f0;stroke:#c94b4b;stroke-width:2}.future{fill:#f5f6f8;stroke:#aab4c2;stroke-width:1.4;stroke-dasharray:6 4}.gate{fill:#fff7e8;stroke:#d99a2b;stroke-width:1.7}.worker{fill:#fff;stroke:#b5bfcc;stroke-width:1.4}.red{fill:none;stroke:#c94b4b;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#r)}.cursor{fill:#c94b4b}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94b4b"/></marker></defs>
  <rect width="1200" height="370" fill="#fff"/><text x="35" y="38" class="h">④ T_CHILD_2 · LC=2 &gt; LWM=1</text><text x="985" y="38" class="m">LWM=1</text>
  <text x="35" y="78" class="t">relay log</text><line x1="130" y1="73" x2="1155" y2="73" class="rail"/>
  <rect x="40" y="96" width="245" height="70" rx="9" class="node"/><text x="162" y="125" text-anchor="middle" class="h">T_PARENT</text><text x="162" y="150" text-anchor="middle" class="t">완료</text>
  <rect x="310" y="96" width="245" height="70" rx="9" class="long"/><text x="432" y="125" text-anchor="middle" class="h">T_CHILD_1 · LONG</text><text x="432" y="150" text-anchor="middle" class="t">worker 2 실행 중</text>
  <rect x="580" y="96" width="245" height="70" rx="9" class="wait"/><text x="702" y="125" text-anchor="middle" class="h">T_CHILD_2</text><text x="702" y="150" text-anchor="middle" class="m">LC=2 · SEQ=3</text>
  <rect x="850" y="96" width="305" height="70" rx="9" class="future"/><text x="1002" y="125" text-anchor="middle" class="h">T_INDEPENDENT</text><text x="1002" y="150" text-anchor="middle" class="m">LC=1</text>
  <path d="M702 88l-11-16h22z" class="cursor"/><text x="702" y="190" text-anchor="middle" class="t">coordinator read cursor</text><path d="M702 196V225" class="red"/>
  <rect x="530" y="230" width="345" height="62" rx="9" class="gate"/><text x="702" y="256" text-anchor="middle" class="m">LC 2 &gt; LWM 1</text><text x="702" y="279" text-anchor="middle" class="t">wait_for_last_committed_trx(2)</text>
  <rect x="40" y="305" width="505" height="45" rx="8" class="worker"/><text x="60" y="333" class="h">worker 2</text><rect x="175" y="313" width="345" height="29" rx="5" fill="#d9822b"/><text x="347" y="333" text-anchor="middle" class="t" style="fill:#fff">T_CHILD_1 계속 실행 ━━━━━━━━━</text>
