<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526174}.line{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#a)}</style>
  <rect width="1400" height="350" fill="#fff"/>
  <text x="38" y="44" class="title">result queue · worker 완료 결과 반환과 reader 수거</text>
  <rect x="55" y="105" width="285" height="110" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="198" y="142" text-anchor="middle" class="head">worker[i]</text><text x="198" y="174" text-anchor="middle" class="body">DB COMMIT 결과 구성</text><text x="198" y="200" text-anchor="middle" class="small">전역 완료 상태는 직접 변경하지 않음</text>
  <path d="M340 160H490" class="line"/><text x="415" y="145" text-anchor="middle" class="small">enqueue</text>
  <rect x="490" y="105" width="330" height="110" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="142" text-anchor="middle" class="head">LA_APPLY_RESULT_QUEUE[i]</text><text x="655" y="174" text-anchor="middle" class="body">worker별 완료 결과 보관</text><text x="655" y="200" text-anchor="middle" class="small">도착 순서는 COMMIT 순서와 다를 수 있음</text>
  <path d="M820 160H970" class="line"/><text x="895" y="133" text-anchor="middle" class="small">첫 미수거 result만 signal</text><text x="895" y="153" text-anchor="middle" class="small">여러 queue batch 수거</text>
  <rect x="970" y="90" width="375" height="140" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1158" y="126" text-anchor="middle" class="head">reader/coordinator</text><text x="1158" y="158" text-anchor="middle" class="body">result_pending 확인·batch 수거</text><text x="1158" y="187" text-anchor="middle" class="body">완료 상태·frontier 갱신</text><text x="1158" y="214" text-anchor="middle" class="small">이후 pending 재판정·순서 확정</text>
  <text x="55" y="285" class="small">결과 수거와 dispatch 순서 확정을 분리하여 순서 밖 완료를 먼저 보관할 수 있어야 한다.</text>
</svg>
