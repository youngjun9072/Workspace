<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">T1 완료 뒤 pending 목록을 순회해 T2를 재판정</title>
  <desc id="desc">T2는 T1의 commit LSA를 dependency로 가져 pending에 보관된다. reader는 독립 T3과 T4를 계속 worker에 배정한다. 앞서 실행 중이던 T1이 DB commit을 끝내고 첫 미수거 result 알림을 보내면 reader가 result를 batch 수거하고 completed set과 frontier를 갱신한 뒤 pending 목록 전체를 순회한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#1f2a36}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#647385}
      .head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#647385}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
      .stage{fill:#f7f9fc;stroke:#c6d0dc;stroke-width:2}.reader{fill:#eef5fb;stroke:#5681ad;stroke-width:2}
      .blocked{fill:#fff5e9;stroke:#d9822b;stroke-width:2}.ready{fill:#edf8f0;stroke:#3f9d5a;stroke-width:2}
      .worker{fill:#f5f0fa;stroke:#8d67a0;stroke-width:2}.result{fill:#eef5fb;stroke:#5681ad;stroke-width:2}
      .state{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.note{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .readLine{fill:none;stroke:#5681ad;stroke-width:3;marker-end:url(#blueArrow)}
      .holdLine{fill:none;stroke:#d9822b;stroke-width:3;marker-end:url(#orangeArrow)}
      .passLine{fill:none;stroke:#3f9d5a;stroke-width:3;marker-end:url(#greenArrow)}
      .feedback{fill:none;stroke:#8d67a0;stroke-width:2.8;stroke-dasharray:9 7;marker-end:url(#purpleArrow)}
      .stateLine{fill:none;stroke:#059669;stroke-width:2.8;marker-end:url(#stateArrow)}
    </style>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5681ad"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9822b"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3f9d5a"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d67a0"/></marker>
    <marker id="stateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
  </defs>

  <rect width="1600" height="840" fill="#fff"/>
  <text x="50" y="48" class="title">T1을 기다리는 T2는 pending에 두고, 뒤의 독립 task는 계속 배정한다</text>
  <text x="50" y="79" class="subtitle">T1 완료 알림으로 reader가 result를 batch 수거하고 완료 상태를 갱신한 뒤 pending 목록을 순회한다.</text>

  <rect x="40" y="110" width="1520" height="145" rx="18" class="reader"/>
  <text x="70" y="145" class="head">reader의 COMMIT task 처리 순서</text>
  <path d="M175 190H1425" class="readLine"/>
  <rect x="220" y="158" width="205" height="64" rx="12" class="worker"/>
  <text x="322" y="184" text-anchor="middle" class="head">T1</text><text x="322" y="208" text-anchor="middle" class="small">먼저 worker에 배정</text>
  <rect x="485" y="158" width="235" height="64" rx="12" class="blocked"/>
  <text x="602" y="184" text-anchor="middle" class="head">T2</text><text x="602" y="208" text-anchor="middle" class="small">dependency = T1.commit_lsa</text>
  <rect x="805" y="158" width="205" height="64" rx="12" class="ready"/>
  <text x="907" y="184" text-anchor="middle" class="head">T3</text><text x="907" y="208" text-anchor="middle" class="small">독립 task</text>
  <rect x="1100" y="158" width="205" height="64" rx="12" class="ready"/>
  <text x="1202" y="184" text-anchor="middle" class="head">T4</text><text x="1202" y="208" text-anchor="middle" class="small">독립 task</text>
  <text x="1440" y="170" text-anchor="end" class="small">읽기 계속</text>

  <rect x="40" y="290" width="450" height="450" rx="18" class="stage"/>
  <text x="70" y="330" class="head">① T2 · dependency 미충족</text>
  <rect x="90" y="375" width="350" height="100" rx="14" class="blocked"/>
  <text x="265" y="412" text-anchor="middle" class="head">dependency gate</text>
  <text x="265" y="444" text-anchor="middle" class="mono">T1.commit_lsa 아직 미완료</text>
  <path d="M602 222V270H65V350H265V375" class="holdLine"/>
  <rect x="90" y="535" width="350" height="115" rx="14" class="blocked"/>
  <text x="265" y="574" text-anchor="middle" class="head">pending 연결 목록</text>
  <text x="265" y="606" text-anchor="middle" class="mono">head → T2 → …</text>
  <text x="265" y="632" text-anchor="middle" class="small">dependency 값과 task를 그대로 보관</text>
  <path d="M265 475V535" class="holdLine"/>

  <rect x="530" y="290" width="450" height="450" rx="18" class="stage"/>
  <text x="560" y="330" class="head">② T3 · T4 · 즉시 배정</text>
  <rect x="580" y="375" width="350" height="100" rx="14" class="ready"/>
  <text x="755" y="412" text-anchor="middle" class="head">dependency gate 통과</text>
  <text x="755" y="444" text-anchor="middle" class="body">T1과 충돌하는 dependency 없음</text>
  <path d="M907 222V342H680V375" class="passLine"/>
  <path d="M1202 222V270H1000V358H830V375" class="passLine"/>
  <rect x="580" y="535" width="155" height="105" rx="14" class="worker"/>
  <text x="657" y="574" text-anchor="middle" class="head">worker[0]</text><text x="657" y="610" text-anchor="middle" class="body">T3 실행</text>
  <rect x="775" y="535" width="155" height="105" rx="14" class="worker"/>
  <text x="852" y="574" text-anchor="middle" class="head">worker[1]</text><text x="852" y="610" text-anchor="middle" class="body">T4 실행</text>
  <path d="M710 475V515H657V535" class="passLine"/><path d="M800 475V515H852V535" class="passLine"/>

  <rect x="1020" y="290" width="540" height="450" rx="18" class="stage"/>
  <text x="1050" y="330" class="head">③ result 알림 뒤 pending 전체 순회</text>
  <rect x="1080" y="365" width="420" height="78" rx="14" class="result"/>
  <text x="1290" y="397" text-anchor="middle" class="head">알림 1회 · worker result batch 수거</text>
  <text x="1290" y="426" text-anchor="middle" class="mono">T1 DB COMMIT 성공 · commit_lsa=C1</text>
  <rect x="1080" y="480" width="420" height="88" rx="14" class="state"/>
  <text x="1290" y="513" text-anchor="middle" class="head">슬레이브 완료 상태 갱신</text>
  <text x="1290" y="545" text-anchor="middle" class="body">completed set 등록 · frontier 전진</text>
  <path d="M1290 443V480" class="stateLine"/>
  <rect x="1080" y="605" width="420" height="105" rx="14" class="ready"/>
  <text x="1290" y="637" text-anchor="middle" class="head">pending을 head부터 끝까지 순회</text>
  <text x="1290" y="666" text-anchor="middle" class="mono">T2 dependency vs 현재 완료 상태</text>
  <text x="1290" y="694" text-anchor="middle" class="body">충족 → T2 제거 후 worker 배정</text>
  <path d="M1290 568V605" class="stateLine"/>
  <path d="M265 650V758H1045V657H1080" class="feedback"/>

  <rect x="40" y="774" width="1520" height="44" rx="10" class="note"/>
  <text x="800" y="802" text-anchor="middle" class="body">T1이 T2를 직접 호출하지 않는다. T1 결과로 완료 상태를 바꾼 뒤 pending의 모든 task를 같은 gate 조건으로 다시 검사한다.</text>
</svg>
