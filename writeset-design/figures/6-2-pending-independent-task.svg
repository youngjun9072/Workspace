<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">막힌 task 뒤의 독립 task 배정</title>
  <desc id="desc">T2는 선행 조건이 충족되지 않아 pending queue에 보류된다. reader는 멈추지 않고 독립적인 T3과 T4를 worker에 배정한다. worker 완료 결과로 완료 상태가 바뀌면 pending의 T2를 다시 판정한다.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#1f2a36}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#647385}
      .head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#647385}
      .stage{fill:#f7f9fc;stroke:#c6d0dc;stroke-width:2}.reader{fill:#eef5fb;stroke:#5681ad;stroke-width:2}
      .blocked{fill:#fff5e9;stroke:#d9822b;stroke-width:2}.ready{fill:#edf8f0;stroke:#3f9d5a;stroke-width:2}
      .worker{fill:#f5f0fa;stroke:#8d67a0;stroke-width:2}.result{fill:#eef5fb;stroke:#5681ad;stroke-width:2}
      .line{fill:none;stroke:#536273;stroke-width:2.6;marker-end:url(#arrow)}
      .readLine{fill:none;stroke:#5681ad;stroke-width:3;marker-end:url(#blueArrow)}
      .holdLine{fill:none;stroke:#d9822b;stroke-width:3;marker-end:url(#orangeArrow)}
      .passLine{fill:none;stroke:#3f9d5a;stroke-width:3;marker-end:url(#greenArrow)}
      .feedback{fill:none;stroke:#8d67a0;stroke-width:2.8;stroke-dasharray:9 7;marker-end:url(#purpleArrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536273"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5681ad"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9822b"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3f9d5a"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d67a0"/></marker>
  </defs>

  <rect width="1600" height="780" fill="#fff"/>
  <text x="50" y="48" class="title">막힌 task를 보류하고 뒤의 독립 task는 계속 배정한다</text>
  <text x="50" y="79" class="subtitle">reader는 T2를 기다리며 멈추지 않고 T3과 T4까지 읽는다.</text>

  <rect x="40" y="110" width="1520" height="145" rx="18" class="reader"/>
  <text x="70" y="145" class="head">reader의 복제 로그 읽기</text>
  <path d="M245 188H1380" class="readLine"/>
  <rect x="335" y="157" width="210" height="62" rx="12" class="blocked"/>
  <text x="440" y="184" text-anchor="middle" class="head">T2</text>
  <text x="440" y="207" text-anchor="middle" class="small">선행 조건 미충족</text>
  <rect x="680" y="157" width="210" height="62" rx="12" class="ready"/>
  <text x="785" y="184" text-anchor="middle" class="head">T3</text>
  <text x="785" y="207" text-anchor="middle" class="small">독립 task</text>
  <rect x="1025" y="157" width="210" height="62" rx="12" class="ready"/>
  <text x="1130" y="184" text-anchor="middle" class="head">T4</text>
  <text x="1130" y="207" text-anchor="middle" class="small">독립 task</text>
  <text x="1370" y="169" text-anchor="end" class="small">읽기 계속</text>

  <rect x="40" y="290" width="480" height="410" rx="18" class="stage"/>
  <text x="70" y="330" class="head">T2 · 보류</text>
  <rect x="100" y="380" width="360" height="105" rx="14" class="blocked"/>
  <text x="280" y="420" text-anchor="middle" class="head">dependency gate</text>
  <text x="280" y="455" text-anchor="middle" class="body">선행 조건 미충족</text>
  <path d="M440 219V345H280V380" class="holdLine"/>
  <rect x="100" y="545" width="360" height="105" rx="14" class="blocked"/>
  <text x="280" y="586" text-anchor="middle" class="head">pending queue</text>
  <text x="280" y="619" text-anchor="middle" class="body">T2를 실행하지 않고 보관</text>
  <path d="M280 485V545" class="holdLine"/>

  <rect x="560" y="290" width="500" height="410" rx="18" class="stage"/>
  <text x="590" y="330" class="head">T3 · T4 · 즉시 배정</text>
  <rect x="620" y="380" width="380" height="105" rx="14" class="ready"/>
  <text x="810" y="420" text-anchor="middle" class="head">dependency gate 통과</text>
  <text x="810" y="455" text-anchor="middle" class="body">T3과 T4는 선행 충돌 없음</text>
  <path d="M785 219V330H755V380" class="passLine"/>
  <path d="M1130 219V345H865V380" class="passLine"/>
  <rect x="620" y="545" width="170" height="105" rx="14" class="worker"/>
  <text x="705" y="586" text-anchor="middle" class="head">worker[0]</text>
  <text x="705" y="619" text-anchor="middle" class="body">T3 실행</text>
  <rect x="830" y="545" width="170" height="105" rx="14" class="worker"/>
  <text x="915" y="586" text-anchor="middle" class="head">worker[1]</text>
  <text x="915" y="619" text-anchor="middle" class="body">T4 실행</text>
  <path d="M760 485V525H705V545" class="passLine"/>
  <path d="M860 485V525H915V545" class="passLine"/>

  <rect x="1100" y="290" width="460" height="410" rx="18" class="stage"/>
  <text x="1130" y="330" class="head">완료 뒤 T2 재판정</text>
  <rect x="1160" y="380" width="340" height="105" rx="14" class="result"/>
  <text x="1330" y="420" text-anchor="middle" class="head">worker 완료 결과 수거</text>
  <text x="1330" y="455" text-anchor="middle" class="body">완료 상태 갱신</text>
  <path d="M1000 598H1080V432H1160" class="line"/>
  <rect x="1160" y="535" width="340" height="135" rx="14" class="ready"/>
  <text x="1330" y="570" text-anchor="middle" class="head">같은 dependency gate로 재판정</text>
  <text x="1330" y="604" text-anchor="middle" class="body">충족 → worker에 배정</text>
  <text x="1330" y="635" text-anchor="middle" class="body">미충족 → pending 유지</text>
  <path d="M1330 485V535" class="feedback"/>
  <path d="M280 650V735H1100V602H1160" class="feedback"/>
  <text x="790" y="726" text-anchor="middle" class="small">pending에서 꺼낸 T2를 재판정하며, 완료 결과가 곧바로 T2를 실행시키는 것은 아니다.</text>
</svg>
