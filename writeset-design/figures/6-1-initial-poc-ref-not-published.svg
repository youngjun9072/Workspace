<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">초기 PoC에서 FK가 lc만 낮춰 부모 삭제 의존성이 누락되는 흐름</title>
  <desc id="desc">부모 INSERT P0은 부모 키 해시를 history에 게시한다. 자식 DELETE T1은 부모 WRITE를 이용해 lc만 낮추고 부모 키 history는 갱신하지 않는다. 뒤의 부모 DELETE T2도 P0만 찾아 T1과 같은 dependency를 받고, 슬레이브에서 두 작업이 동시에 실행되어 부모 삭제가 먼저 끝날 수 있다.</desc>
  <defs>
    <style>
      .title{font:700 30px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .sub{font:500 17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .laneTitle{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .head{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .body{font:500 15px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .small{font:500 13px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#64748b}
      .mono{font:600 15px 'Noto Sans Mono CJK KR',monospace;fill:#334155}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:14}
      .event{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}
      .probe{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}
      .filter{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}
      .state{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:12}
      .danger{fill:#fff1f2;stroke:#e11d48;stroke-width:2.4;rx:12}
      .arrow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#arrow)}
      .green{fill:none;stroke:#059669;stroke-width:2.4;marker-end:url(#green)}
      .orange{fill:none;stroke:#ea580c;stroke-width:2.4;marker-end:url(#orange)}
      .red{fill:none;stroke:#e11d48;stroke-width:2.6;marker-end:url(#red)}
      .dash{stroke-dasharray:7 6}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#ea580c"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#e11d48"/></marker>
  </defs>

  <rect width="1700" height="900" fill="#fff"/>
  <text x="50" y="50" class="title">초기 PoC: 부모 WRITE를 이용해 lc만 낮춘 결과</text>
  <text x="50" y="82" class="sub">FK는 부모 WRITE와 순서만 연결하고 history를 갱신하지 않아, 뒤의 부모 DELETE가 자식 작업을 찾지 못한다</text>

  <rect x="45" y="110" width="1610" height="155" class="lane"/>
  <text x="70" y="142" class="laneTitle">1 · 기준 이력 생성</text>
  <rect x="215" y="150" width="265" height="82" class="event"/>
  <text x="347" y="181" text-anchor="middle" class="head">P0 · 부모 INSERT</text>
  <text x="347" y="208" text-anchor="middle" class="body">부모 키 H를 WRITE로 수집</text>
  <path d="M480 191 H650" class="arrow"/>
  <rect x="650" y="150" width="360" height="82" class="state"/>
  <text x="830" y="181" text-anchor="middle" class="head">P0 COMMIT 후 publish</text>
  <text x="830" y="208" text-anchor="middle" class="mono">history[H] = P0.commit_lsa</text>

  <rect x="45" y="285" width="1610" height="260" class="lane"/>
  <text x="70" y="317" class="laneTitle">2 · T1 자식 DELETE의 FK 처리</text>
  <rect x="90" y="355" width="260" height="130" class="event"/>
  <text x="220" y="387" text-anchor="middle" class="head">T1 · 자식 DELETE</text>
  <text x="220" y="418" text-anchor="middle" class="body">old FK 값 수집</text>
  <text x="220" y="446" text-anchor="middle" class="mono">부모 키 hash=H 조회</text>
  <text x="220" y="472" text-anchor="middle" class="small">부모의 마지막 WRITE를 찾는 키</text>

  <path d="M350 420 H415" class="green"/>
  <rect x="415" y="355" width="300" height="130" class="probe"/>
  <text x="565" y="387" text-anchor="middle" class="head">commit probe</text>
  <text x="565" y="418" text-anchor="middle" class="mono">history[H] → P0</text>
  <text x="565" y="446" text-anchor="middle" class="body">부모 WRITE를 이용해 lc만 낮춤</text>
  <text x="565" y="472" text-anchor="middle" class="mono">T1.dependency = P0</text>

  <path d="M715 420 H780" class="orange"/>
  <rect x="780" y="355" width="330" height="130" class="filter"/>
  <text x="945" y="387" text-anchor="middle" class="head">commit publish</text>
  <text x="945" y="418" text-anchor="middle" class="mono">자식의 WRITE 키만 게시</text>
  <text x="945" y="446" text-anchor="middle" class="body">부모 키 H는 T1 시퀀스로 갱신하지 않음</text>
  <text x="945" y="472" text-anchor="middle" class="small">T1.commit_lsa를 게시하지 않음</text>

  <path d="M1110 420 H1180" class="orange"/>
  <rect x="1180" y="355" width="400" height="130" class="state"/>
  <text x="1380" y="387" text-anchor="middle" class="head">부모 키 history가 바뀌지 않음</text>
  <text x="1380" y="423" text-anchor="middle" class="mono">history[H] = P0.commit_lsa</text>
  <text x="1380" y="455" text-anchor="middle" class="body">T1의 FK 참조 흔적 없음</text>

  <rect x="45" y="565" width="1610" height="155" class="lane"/>
  <text x="70" y="597" class="laneTitle">3 · 뒤의 부모 WRITE가 T1을 놓침</text>
  <rect x="180" y="615" width="285" height="76" class="event"/>
  <text x="322" y="645" text-anchor="middle" class="head">T2 · 부모 DELETE</text>
  <text x="322" y="672" text-anchor="middle" class="mono">부모 키 hash=H — WRITE</text>
  <path d="M465 653 H610" class="green"/>
  <rect x="610" y="615" width="330" height="76" class="probe"/>
  <text x="775" y="645" text-anchor="middle" class="mono">history.find(H) → P0</text>
  <text x="775" y="672" text-anchor="middle" class="body">T1은 history에 없음</text>
  <path d="M940 653 H1080" class="red"/>
  <rect x="1080" y="615" width="385" height="76" class="danger"/>
  <text x="1272" y="645" text-anchor="middle" class="mono">T2.dependency = P0</text>
  <text x="1272" y="672" text-anchor="middle" class="body">T2.dependency ≠ T1</text>

  <path d="M1272 691 V750" class="red"/>
  <rect x="255" y="750" width="1190" height="105" class="danger"/>
  <text x="850" y="783" text-anchor="middle" class="head">슬레이브: P0이 이미 완료됐으면 T1과 T2가 모두 즉시 실행 가능</text>
  <text x="850" y="815" text-anchor="middle" class="mono">T1.dependency=P0    ·    T2.dependency=P0</text>
  <text x="850" y="842" text-anchor="middle" class="body">긴 자식 DELETE가 실행 중인 사이 짧은 부모 DELETE가 먼저 완료되어 마스터 순서가 뒤집힐 수 있음</text>
</svg>
