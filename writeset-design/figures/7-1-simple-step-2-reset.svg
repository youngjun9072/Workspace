<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="790" viewBox="0 0 1680 790" role="img" aria-labelledby="title desc"><title id="title">STEP 2 T2: statement 폴백과 history 초기화</title><desc id="desc">키를 완전하게 수집하지 못했으므로 C1까지 연속 완료를 기다리고, C2를 새 history 시작점으로 남긴다.</desc><defs><style>
    text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:27px;font-weight:700}.paneltitle{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px;font-weight:600}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{font-size:13px;fill:#64748b}.step{font-size:14px;font-weight:700;fill:#fff}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.probe{fill:none;stroke:#f97316;stroke-width:2.4;marker-end:url(#orange)}.publish{fill:none;stroke:#10b981;stroke-width:2.4;marker-end:url(#green)}
    </style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#10b981"/></marker></defs><rect width="1680" height="790" fill="#fff"/><circle cx="55" cy="49" r="22" fill="#334155"/><text x="55" y="55" class="step" text-anchor="middle">2</text><text x="93" y="57" class="title" text-anchor="start">T2: statement 폴백과 history 초기화</text><rect x="35" y="100" width="350" height="525" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="58" y="134" class="paneltitle" text-anchor="start">① 현재 transaction과 로컬 writeset</text><text x="58" y="170" class="body" text-anchor="start">statement replication</text><text x="58" y="197" class="body" text-anchor="start">ws_overflow = true</text><text x="58" y="232" class="small" text-anchor="start">로컬 writeset</text><rect x="58" y="247" width="275" height="48" rx="7" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/><text x="195" y="276" class="small" text-anchor="middle">사용 불가 (ws_overflow)</text><text x="58" y="317" class="mono" text-anchor="start">history_start = C0</text><text x="58" y="345" class="mono" text-anchor="start">prev_commit = C1</text><text x="58" y="373" class="mono" text-anchor="start">parent 계산 생략</text><rect x="420" y="100" width="520" height="525" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="448" y="140" class="paneltitle" text-anchor="start">② 전역 history probe 전 상태</text><text x="448" y="167" class="mono" text-anchor="start">history_start = C0</text><rect x="448" y="188" width="464" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="618" y1="188" x2="618" y2="220" stroke="#94a3b8"/><line x1="743" y1="188" x2="743" y2="220" stroke="#94a3b8"/><text x="533" y="210" class="small" text-anchor="middle">hash</text><text x="680" y="210" class="small" text-anchor="middle">write_seq</text><text x="827.5" y="210" class="small" text-anchor="middle">ref_seq</text><rect x="448" y="220" width="464" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="618" y1="220" x2="618" y2="258" stroke="#cbd5e1"/><line x1="743" y1="220" x2="743" y2="258" stroke="#cbd5e1"/><text x="533" y="245" class="mono" text-anchor="middle">H_S1</text><text x="680" y="245" class="mono" text-anchor="middle">C1</text><text x="827.5" y="245" class="mono" text-anchor="middle">—</text><rect x="448" y="258" width="464" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="618" y1="258" x2="618" y2="296" stroke="#cbd5e1"/><line x1="743" y1="258" x2="743" y2="296" stroke="#cbd5e1"/><text x="533" y="283" class="mono" text-anchor="middle">H_S2</text><text x="680" y="283" class="mono" text-anchor="middle">C1</text><text x="827.5" y="283" class="mono" text-anchor="middle">—</text><text x="448" y="395" class="paneltitle" text-anchor="start">알고리즘 1·2 실행</text><text x="448" y="426" class="mono" text-anchor="start">ws_overflow=true</text><text x="448" y="453" class="mono" text-anchor="start">알고리즘 1·2의 키별 probe 생략</text><text x="448" y="480" class="mono" text-anchor="start">lc = prev_commit C1</text><path d="M385 280 H420" class="probe"/><text x="402" y="269" class="small" text-anchor="middle">probe</text><rect x="975" y="100" width="670" height="250" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1000" y="135" class="paneltitle" text-anchor="start">③ 선행 후보 parent로 최종 lc와 COMMIT 확정</text><text x="1000" y="177" class="mono" text-anchor="start">lc(dependency_seq) = prev_commit = C1</text><text x="1000" y="210" class="mono" text-anchor="start">dependency_is_ref=true</text><text x="1000" y="243" class="mono" text-anchor="start">LOG_DUMMY_WS_LABEL: dependency_seq=C1</text><text x="1000" y="276" class="mono" text-anchor="start">LOG_COMMIT 위치 = C2</text><path d="M940 225 H975" class="arrow"/><rect x="975" y="375" width="670" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1000" y="410" class="paneltitle" text-anchor="start">④ COMMIT 뒤 history publish</text><text x="1000" y="446" class="mono" text-anchor="start">history.clear()</text><text x="1000" y="472" class="mono" text-anchor="start">history_start = C2</text><text x="1000" y="498" class="mono" text-anchor="start">불완전한 writeset은 게시하지 않음</text><text x="1260" y="410" class="paneltitle" text-anchor="start">갱신 뒤 history</text><text x="1260" y="437" class="mono" text-anchor="start">history_start = C2</text><rect x="1260" y="458" width="350" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="1430" y1="458" x2="1430" y2="490" stroke="#94a3b8"/><line x1="1555" y1="458" x2="1555" y2="490" stroke="#94a3b8"/><text x="1345" y="480" class="small" text-anchor="middle">hash</text><text x="1492" y="480" class="small" text-anchor="middle">write_seq</text><text x="1582.5" y="480" class="small" text-anchor="middle">ref_seq</text><rect x="1260" y="490" width="350" height="46" fill="#fff" stroke="#94a3b8"/><text x="1435.0" y="519" class="muted" text-anchor="middle">비어 있음</text><path d="M1310 350 V375" class="publish"/><rect x="120" y="675" width="1440" height="76" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="840" y="707" class="paneltitle" text-anchor="middle">핵심</text><text x="840" y="735" class="body" text-anchor="middle">키를 완전하게 수집하지 못했으므로 C1까지 연속 완료를 기다리고, C2를 새 history 시작점으로 남긴다.</text></svg>