<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <style>
      .title{font:700 30px sans-serif;fill:#0f172a}
      .sub{font:500 17px sans-serif;fill:#475569}
      .head{font:700 19px sans-serif;fill:#0f172a}
      .body{font:500 16px sans-serif;fill:#334155}
      .small{font:500 14px sans-serif;fill:#64748b}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:13}
      .repl{fill:#eff6ff;stroke:#3b82f6}
      .label{fill:#f0fdf4;stroke:#16a34a}
      .commit{fill:#fff7ed;stroke:#ea580c}
      .reader{fill:#f8fafc;stroke:#64748b}
      .task{fill:#f5f3ff;stroke:#7c3aed}
      .error{fill:#fff1f2;stroke:#e11d48}
      .note{fill:#fffbeb;stroke:#d97706}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#blue)}
      .bad{fill:none;stroke:#be123c;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#be123c"/></marker>
  </defs>

  <rect width="1600" height="780" fill="#fff"/>
  <text x="50" y="52" class="title">복제 로그에서 transaction task 만들기</text>
  <text x="50" y="84" class="sub">reader가 같은 trid의 변경·dependency·COMMIT을 모으고, COMMIT에서 하나의 실행 단위로 닫는다</text>

  <text x="55" y="132" class="head">복제 로그의 물리적 순서</text>
  <path d="M280 126 H1530" class="arrow"/>

  <rect x="65" y="165" width="235" height="115" class="box repl"/>
  <text x="182" y="202" text-anchor="middle" class="head">REPLICATION_DATA</text>
  <text x="182" y="233" text-anchor="middle" class="body">trid = T1</text>
  <text x="182" y="260" text-anchor="middle" class="small">행 변경 항목</text>

  <rect x="350" y="165" width="235" height="115" class="box repl"/>
  <text x="467" y="202" text-anchor="middle" class="head">REPLICATION_…</text>
  <text x="467" y="233" text-anchor="middle" class="body">trid = T1</text>
  <text x="467" y="260" text-anchor="middle" class="small">추가 변경 항목</text>

  <rect x="635" y="150" width="315" height="145" class="box label"/>
  <text x="792" y="188" text-anchor="middle" class="head">LOG_DUMMY_WS_LABEL</text>
  <text x="792" y="219" text-anchor="middle" class="body">공통 로그 헤더: trid = T1</text>
  <text x="792" y="249" text-anchor="middle" class="body">dependency LSA · 대기 방식</text>
  <text x="792" y="277" text-anchor="middle" class="small">writeset 해시가 아니라 계산 결과만 전달</text>

  <rect x="1000" y="165" width="235" height="115" class="box commit"/>
  <text x="1117" y="202" text-anchor="middle" class="head">LOG_COMMIT</text>
  <text x="1117" y="233" text-anchor="middle" class="body">trid = T1</text>
  <text x="1117" y="260" text-anchor="middle" class="small">본인 COMMIT LSA</text>

  <path d="M182 280 V355" class="flow"/>
  <path d="M467 280 V355" class="flow"/>
  <path d="M792 295 V355" class="flow"/>
  <path d="M1117 280 V355" class="flow"/>

  <rect x="65" y="355" width="1170" height="170" class="box reader"/>
  <text x="100" y="393" class="head">reader의 trid별 조립 상태</text>
  <line x1="370" y1="415" x2="370" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="730" y1="415" x2="730" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="990" y1="415" x2="990" y2="500" stroke="#cbd5e1" stroke-width="2"/>
  <text x="215" y="446" text-anchor="middle" class="head">변경 목록 누적</text>
  <text x="215" y="478" text-anchor="middle" class="small">COMMIT 전까지 보관</text>
  <text x="550" y="446" text-anchor="middle" class="head">dependency 임시 보관</text>
  <text x="550" y="478" text-anchor="middle" class="small">같은 trid와 함께 유지</text>
  <text x="860" y="446" text-anchor="middle" class="head">COMMIT에서 닫기</text>
  <text x="860" y="478" text-anchor="middle" class="small">본인 LSA 확정</text>
  <text x="1110" y="446" text-anchor="middle" class="head">결합 조건 확인</text>
  <text x="1110" y="478" text-anchor="middle" class="small">trid · 필수 레코드</text>

  <path d="M1235 440 H1300" class="arrow"/>

  <rect x="1300" y="345" width="250" height="190" class="box task"/>
  <text x="1425" y="385" text-anchor="middle" class="head">완성된 T1 task</text>
  <text x="1425" y="422" text-anchor="middle" class="body">변경 목록</text>
  <text x="1425" y="454" text-anchor="middle" class="body">dependency + 대기 방식</text>
  <text x="1425" y="486" text-anchor="middle" class="body">COMMIT LSA</text>
  <text x="1425" y="516" text-anchor="middle" class="small">완성 후 dependency gate로 전달</text>

  <path d="M1110 525 V600 H1285" class="bad"/>
  <text x="1172" y="583" class="small">누락 · trid 불일치</text>

  <rect x="1285" y="575" width="265" height="105" class="box error"/>
  <text x="1417" y="613" text-anchor="middle" class="head">안전 경로로 전환</text>
  <text x="1417" y="645" text-anchor="middle" class="body">오류 또는 commit-order 폴백</text>
  <text x="1417" y="670" text-anchor="middle" class="small">빈 COMMIT은 별도로 구분</text>

  <rect x="65" y="585" width="1080" height="105" class="box note"/>
  <text x="95" y="622" class="head">task 완성과 적용 완료는 다른 상태</text>
  <text x="95" y="654" class="body">task를 만들거나 로그 읽기 위치가 전진해도 완료 LSA는 움직이지 않는다.</text>
  <text x="95" y="680" class="small">dependency가 막히면 task만 pending에 두고 reader는 다음 로그를 계속 읽는다.</text>

  <text x="65" y="744" class="small">아직 COMMIT을 만나지 않은 장기 트랜잭션은 변경 목록을 계속 보관해야 하므로, 그 수집 비용까지 제거하는 구조는 아니다.</text>
</svg>
