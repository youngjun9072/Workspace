<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="850" viewBox="0 0 1700 850" role="img" aria-labelledby="t d">
  <title id="t">MySQL 슬레이브 코디네이터의 의존성 판정과 worker 전달</title>
  <desc id="d">relay log의 GTID에서 sequence_number와 last_committed를 읽고 GAQ의 LWM과 비교한 뒤, 게이트를 통과해야 worker를 선택하고 queue에 전달하는 알고리즘이다.</desc>
  <defs>
    <style>.title{font:700 27px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#26303d}.h{font:700 17px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#26303d}.t{font:15px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#526174}.m{font:14px ui-monospace,SFMono-Regular,Consolas,'Droid Sans Mono',monospace;fill:#445062}.flow{fill:#eef5fb;stroke:#5681ad;stroke-width:1.7}.state{fill:#e8f5ec;stroke:#3fa35b;stroke-width:1.7}.wait{fill:#fff0f0;stroke:#c94b4b;stroke-width:1.8}.work{fill:#f5edf7;stroke:#97558a;stroke-width:1.7}.arrow{fill:none;stroke:#526174;stroke-width:2.3;marker-end:url(#a)}.loop{fill:none;stroke:#c94b4b;stroke-width:2.3;marker-end:url(#r)}.yes{font:700 15px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#258844}.no{font:700 15px 'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Droid Sans Fallback','Droid Sans',sans-serif;fill:#b23d3d}</style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c94b4b"/></marker>
  </defs>
  <rect width="1700" height="850" fill="#fff"/><text x="50" y="52" class="title">Algorithm 3 · 슬레이브 코디네이터의 의존성 판정과 전달</text><text x="50" y="82" class="t">현재 트랜잭션은 LC/LWM 게이트를 통과한 뒤에만 worker를 선택하고 queue에 전달된다.</text>
  <rect x="55" y="135" width="205" height="125" rx="11" class="flow"/><text x="158" y="175" text-anchor="middle" class="h">relay-log reader</text><text x="158" y="210" text-anchor="middle" class="t">현재 GTID 이벤트</text><text x="158" y="240" text-anchor="middle" class="m">read next event</text>
  <rect x="315" y="125" width="235" height="145" rx="11" class="flow"/><text x="433" y="165" text-anchor="middle" class="h">GTID 라벨 읽기</text><text x="433" y="202" text-anchor="middle" class="m">S = sequence_number</text><text x="433" y="232" text-anchor="middle" class="m">LC = last_committed</text>
  <rect x="590" y="125" width="260" height="145" rx="11" class="state"/><text x="720" y="158" text-anchor="middle" class="h">GAQ (Group Assigned Queue)</text><text x="720" y="194" text-anchor="middle" class="t">배정한 group을 commit 순서로 보관</text><text x="720" y="224" text-anchor="middle" class="t">done 상태로 연속 완료 LWM 계산</text>
  <polygon points="975,120 1100,198 975,276 850,198" fill="#fff7e8" stroke="#d99a2b" stroke-width="1.9"/><text x="975" y="190" text-anchor="middle" class="h">LC ≤ LWM?</text><text x="975" y="220" text-anchor="middle" class="t">실행 가능 판정</text>
  <rect x="1160" y="125" width="230" height="145" rx="11" class="work"/><text x="1275" y="165" text-anchor="middle" class="h">worker 선택</text><text x="1275" y="202" text-anchor="middle" class="t">가장 여유 있는 worker</text><text x="1275" y="232" text-anchor="middle" class="m">get_least_occupied_worker()</text>
  <rect x="1445" y="125" width="205" height="145" rx="11" class="work"/><text x="1548" y="165" text-anchor="middle" class="h">worker queue</text><text x="1548" y="202" text-anchor="middle" class="t">현재 이벤트 전달</text><text x="1548" y="232" text-anchor="middle" class="m">append_item_to_jobs()</text>
  <path d="M260 198H315" class="arrow"/><path d="M550 198H590" class="arrow"/><path d="M850 198H852" class="arrow"/><path d="M1100 198H1160" class="arrow"/><text x="1124" y="185" text-anchor="middle" class="yes">YES</text><path d="M1390 198H1445" class="arrow"/>
  <rect x="1425" y="345" width="245" height="95" rx="10" class="flow"/><text x="1548" y="383" text-anchor="middle" class="h">다음 relay-log 이벤트</text><text x="1548" y="414" text-anchor="middle" class="t">enqueue 뒤 reader 전진</text><path d="M1548 270V345" class="arrow"/>
  <rect x="845" y="385" width="260" height="125" rx="11" class="wait"/><text x="975" y="425" text-anchor="middle" class="h">현재 이벤트에서 대기</text><text x="975" y="462" text-anchor="middle" class="m">wait_for_last_committed_trx()</text><text x="975" y="490" text-anchor="middle" class="t">필요한 완료 경계를 기다림</text><path d="M975 276V385" class="loop"/><text x="995" y="330" class="no">NO</text>
  <rect x="505" y="395" width="270" height="105" rx="11" class="state"/><text x="640" y="434" text-anchor="middle" class="h">GAQ의 done 상태 반영</text><text x="640" y="470" text-anchor="middle" class="t">마지막 연속 완료 group까지 LWM 전진</text><path d="M845 448H775" class="loop"/><path d="M505 448H30V105H975V120" class="loop"/><text x="48" y="350" class="t" style="fill:#b23d3d">LWM 갱신 후 gate 재판정</text>
  <rect x="845" y="560" width="540" height="100" rx="10" class="wait"/><text x="1115" y="600" text-anchor="middle" class="h">head-blocking 지점</text><text x="1115" y="635" text-anchor="middle" class="t">대기 중에는 reader가 다음 relay-log 이벤트로 이동하지 못한다.</text><path d="M975 510V560" class="loop"/>
  <rect x="120" y="700" width="1460" height="95" rx="11" fill="#fafbfd" stroke="#b5bfcc"/><text x="160" y="737" class="h">기호</text><text x="255" y="737" class="m">S</text><text x="280" y="737" class="t">현재 트랜잭션 순번</text><text x="570" y="737" class="m">LC</text><text x="605" y="737" class="t">선행 완료 경계</text><text x="880" y="737" class="m">LWM</text><text x="930" y="737" class="t">GAQ가 확인한 연속 완료 경계</text><text x="160" y="770" class="t">worker 선택은 게이트 통과 뒤에만 수행되며, GAQ는 대기 중인 현재 이벤트를 건너뛰는 pending queue가 아니다.</text>
</svg>
