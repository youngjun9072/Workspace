<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc"><title id="title">STEP 10 T10: 더 작은 REF 이력과 더 큰 WRITE 이력</title><desc id="desc">최댓값 C9는 WRITE 이력에서 왔어도 C8의 REF 이력이 포함됐으므로 C9까지 연속 완료를 기다린다.</desc><defs><style>
    text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17212b}.title{font-size:28px;font-weight:700}.paneltitle{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:13px;font-weight:600}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{font-size:13px;fill:#64748b}.step{font-size:14px;font-weight:700;fill:#fff}.oldval{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dc2626}.newval{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#059669;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.probe{fill:none;stroke:#f97316;stroke-width:2.4;marker-end:url(#orange)}.publish{fill:none;stroke:#10b981;stroke-width:2.4;marker-end:url(#green)}
    </style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#10b981"/></marker></defs><rect width="1800" height="900" fill="#fff"/><circle cx="55" cy="45" r="22" fill="#334155"/><text x="55" y="51" class="step" text-anchor="middle">10</text><text x="93" y="53" class="title" text-anchor="start">T10: 더 작은 REF 이력과 더 큰 WRITE 이력</text><rect x="35" y="78" width="1730" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="104" class="small" text-anchor="start">history_start</text><text x="168" y="104" class="body" text-anchor="start">history 초기화 때 남긴 보수적 하한</text><text x="570" y="104" class="small" text-anchor="start">P (parent_lsa)</text><text x="704" y="104" class="body" text-anchor="start">history_start와 키별 후보를 누적한 최댓값</text><text x="1120" y="104" class="small" text-anchor="start">dependency_seq</text><text x="1245" y="104" class="body" text-anchor="start">슬레이브에 전달할 선행 조건</text><text x="60" y="128" class="small" text-anchor="start">C (prev_commit_lsa)</text><text x="220" y="128" class="body" text-anchor="start">현재 probe가 읽은 commit-order 기준</text><text x="570" y="128" class="small" text-anchor="start">write_seq / ref_seq</text><text x="720" y="128" class="body" text-anchor="start">같은 키의 마지막 변경 / 마지막 참조 위치</text><rect x="35" y="165" width="345" height="575" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="58" y="200" class="paneltitle" text-anchor="start">① 현재 행에서 충돌 키 수집</text><text x="58" y="238" class="body" text-anchor="start">parent(id=1) UPDATE</text><text x="58" y="266" class="body" text-anchor="start">independent(id=1) UPDATE</text><text x="58" y="304" class="small" text-anchor="start">로컬 writeset</text><rect x="58" y="320" width="275" height="42" rx="7" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><text x="75" y="347" class="mono" text-anchor="start">H_P1</text><text x="310" y="347" class="small" text-anchor="end">WRITE</text><rect x="58" y="372" width="275" height="42" rx="7" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><text x="75" y="399" class="mono" text-anchor="start">H_I1</text><text x="310" y="399" class="small" text-anchor="end">WRITE</text><text x="58" y="436" class="mono" text-anchor="start">history_start = C4</text><text x="58" y="465" class="mono" text-anchor="start">C = prev_commit_lsa = C9</text><text x="58" y="494" class="body" text-anchor="start">P = history_start = C4에서 시작</text><rect x="410" y="165" width="610" height="575" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="435" y="200" class="paneltitle" text-anchor="start">② 로컬 키로 과거 COMMIT 조회</text><text x="438" y="230" class="paneltitle" text-anchor="start">조회 전 전역 history</text><text x="438" y="257" class="mono" text-anchor="start">history_start = C4</text><rect x="438" y="278" width="550" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="608" y1="278" x2="608" y2="310" stroke="#94a3b8"/><line x1="733" y1="278" x2="733" y2="310" stroke="#94a3b8"/><text x="523" y="300" class="small" text-anchor="middle">hash</text><text x="670" y="300" class="small" text-anchor="middle">write_seq</text><text x="860.5" y="300" class="small" text-anchor="middle">ref_seq</text><rect x="438" y="310" width="550" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="608" y1="310" x2="608" y2="348" stroke="#cbd5e1"/><line x1="733" y1="310" x2="733" y2="348" stroke="#cbd5e1"/><text x="523" y="335" class="mono" text-anchor="middle">H_P1</text><text x="670" y="335" class="mono" text-anchor="middle">C5</text><text x="860.5" y="335" class="mono" text-anchor="middle">C8</text><rect x="438" y="348" width="550" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="608" y1="348" x2="608" y2="386" stroke="#cbd5e1"/><line x1="733" y1="348" x2="733" y2="386" stroke="#cbd5e1"/><text x="523" y="373" class="mono" text-anchor="middle">H_I1</text><text x="670" y="373" class="mono" text-anchor="middle">C9</text><text x="860.5" y="373" class="mono" text-anchor="middle">—</text><rect x="438" y="386" width="550" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="608" y1="386" x2="608" y2="424" stroke="#cbd5e1"/><line x1="733" y1="386" x2="733" y2="424" stroke="#cbd5e1"/><text x="523" y="411" class="mono" text-anchor="middle">H_C10</text><text x="670" y="411" class="mono" text-anchor="middle">C7</text><text x="860.5" y="411" class="mono" text-anchor="middle">—</text><rect x="438" y="424" width="550" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="608" y1="424" x2="608" y2="462" stroke="#cbd5e1"/><line x1="733" y1="424" x2="733" y2="462" stroke="#cbd5e1"/><text x="523" y="449" class="mono" text-anchor="middle">H_C11</text><text x="670" y="449" class="mono" text-anchor="middle">C8</text><text x="860.5" y="449" class="mono" text-anchor="middle">—</text><text x="438" y="475" class="paneltitle" text-anchor="start">candidate 계산과 P 변화</text><text x="438" y="509" class="mono" text-anchor="start">P 시작 = history_start = C4</text><text x="438" y="538" class="mono" text-anchor="start">H_P1 WRITE 후보 = max(C5, C8) = C8 (REF 이력)</text><text x="438" y="567" class="mono" text-anchor="start">H_I1 WRITE 후보 = max(C9, NULL) = C9</text><text x="438" y="596" class="mono" text-anchor="start">P = max(C4, C8, C9) = C9</text><text x="438" y="625" class="mono" text-anchor="start">C8의 REF 이력 조건은 별도로 유지</text><path d="M380 420 H410" class="probe"/><rect x="1050" y="165" width="715" height="260" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1075" y="201" class="paneltitle" text-anchor="start">③ 슬레이브에 전달할 dependency 확정</text><text x="1075" y="244" class="body" text-anchor="start">REF 이력 후보 포함 → dependency = P, frontier 대기</text><text x="1075" y="284" class="mono" text-anchor="start">dependency_seq = P = C9</text><text x="1075" y="320" class="mono" text-anchor="start">frontier_wait=true</text><text x="1075" y="365" class="body" text-anchor="start">WS_LABEL: dependency=C9, frontier_wait=true</text><path d="M1020 295 H1050" class="arrow"/><rect x="1050" y="455" width="715" height="285" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1075" y="491" class="paneltitle" text-anchor="start">④ COMMIT C10 뒤 history 갱신</text><text x="1075" y="530" class="mono" text-anchor="start">H_P1.write_seq = C10</text><text x="1075" y="558" class="mono" text-anchor="start">H_I1.write_seq = C10</text><text x="1378" y="500" class="paneltitle" text-anchor="start">갱신 뒤 전역 history</text><text x="1378" y="527" class="mono" text-anchor="start">history_start = C4</text><rect x="1378" y="548" width="350" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="1548" y1="548" x2="1548" y2="580" stroke="#94a3b8"/><line x1="1673" y1="548" x2="1673" y2="580" stroke="#94a3b8"/><text x="1463" y="570" class="small" text-anchor="middle">hash</text><text x="1610" y="570" class="small" text-anchor="middle">write_seq</text><text x="1700.5" y="570" class="small" text-anchor="middle">ref_seq</text><rect x="1378" y="580" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1548" y1="580" x2="1548" y2="618" stroke="#cbd5e1"/><line x1="1673" y1="580" x2="1673" y2="618" stroke="#cbd5e1"/><text x="1463" y="605" class="mono" text-anchor="middle">H_P1</text><text x="1582" y="605" class="oldval" text-anchor="middle">C5</text><line x1="1570" y1="600" x2="1594" y2="600" stroke="#dc2626" stroke-width="2"/><text x="1610" y="605" class="muted" text-anchor="middle">→</text><text x="1638" y="605" class="newval" text-anchor="middle">C10</text><text x="1700.5" y="605" class="mono" text-anchor="middle">C8</text><rect x="1378" y="618" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1548" y1="618" x2="1548" y2="656" stroke="#cbd5e1"/><line x1="1673" y1="618" x2="1673" y2="656" stroke="#cbd5e1"/><text x="1463" y="643" class="mono" text-anchor="middle">H_I1</text><text x="1582" y="643" class="oldval" text-anchor="middle">C9</text><line x1="1570" y1="638" x2="1594" y2="638" stroke="#dc2626" stroke-width="2"/><text x="1610" y="643" class="muted" text-anchor="middle">→</text><text x="1638" y="643" class="newval" text-anchor="middle">C10</text><text x="1700.5" y="643" class="mono" text-anchor="middle">—</text><rect x="1378" y="656" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1548" y1="656" x2="1548" y2="694" stroke="#cbd5e1"/><line x1="1673" y1="656" x2="1673" y2="694" stroke="#cbd5e1"/><text x="1463" y="681" class="mono" text-anchor="middle">H_C10</text><text x="1610" y="681" class="mono" text-anchor="middle">C7</text><text x="1700.5" y="681" class="mono" text-anchor="middle">—</text><rect x="1378" y="694" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1548" y1="694" x2="1548" y2="732" stroke="#cbd5e1"/><line x1="1673" y1="694" x2="1673" y2="732" stroke="#cbd5e1"/><text x="1463" y="719" class="mono" text-anchor="middle">H_C11</text><text x="1610" y="719" class="mono" text-anchor="middle">C8</text><text x="1700.5" y="719" class="mono" text-anchor="middle">—</text><path d="M1405 425 V455" class="publish"/><rect x="35" y="772" width="1730" height="91" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="805" class="small" text-anchor="start">한 장면의 순서</text><text x="190" y="805" class="body" text-anchor="start">행 연산·키 수집  →  과거 이력 조회  →  선행 후보 선택  →  dependency 기록  →  COMMIT  →  history 갱신</text><text x="60" y="839" class="small" text-anchor="start">이 장면의 결과</text><text x="190" y="839" class="body" text-anchor="start">최댓값 C9는 WRITE 이력에서 왔어도 C8의 REF 이력이 포함됐으므로 C9까지 연속 완료를 기다린다.</text></svg>