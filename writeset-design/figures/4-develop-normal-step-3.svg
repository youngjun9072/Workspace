<text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면에서 바뀐 값</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="358" font-size="17" font-weight="700" fill="#9a3412">LA_COMMIT(T1)</text><text x="440" y="358" font-size="17" fill="#9a3412">생성 · log_lsa = C1 · 전역 FIFO commit list에 등록</text><text x="64" y="386" font-size="17" font-weight="700" fill="#9a3412">la_Info.final_lsa</text><text x="440" y="386" font-size="17" fill="#9a3412">C1 (COMMIT 레코드 처리 중)</text><text x="64" y="418" font-size="14" fill="#6b7280">committed_lsa = C0 · committed_rep_lsa = R0 : 직전 적용 위치에 머묾 · LA_ITEM #1·#2 : 그대로</text>
<text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ DB</text><text x="100" y="458" font-size="15" font-weight="400" fill="#6b7280">_db_ha_apply_info: committed_lsa = C0 · committed_rep_lsa = R0 · required_lsa = Q0 (이 장면에서 바뀌지 않음)</text>
<rect x="0" y="476" width="1200" height="64" fill="#0f172a"/>
<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">LA_COMMIT.log_lsa는 종료 레코드와 T1의 LA_APPLY를 잇는다. 이 노드가 FIFO head에 오면 T1의 item 적용이 시작된다.</text>
