<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">start_lsa는 별도 START 레코드가 아니라 T1을 처음 만난 위치다. 미완 트랜잭션의 로그 보존 하한 후보가 된다.</text>
