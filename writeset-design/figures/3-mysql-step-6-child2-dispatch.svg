<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">6단계 T_CHILD_1 완료 뒤 T_CHILD_2 배정</title><desc id="d">T_CHILD_1 완료로 LWM이 1에서 2로 전진하고 condition signal이 coordinator를 깨우며 T_CHILD_2가 재판정 후 worker 1에 배정된다.</desc>
  <defs><style>.h{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}.t{font:14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}.m{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#26303d}.rail{stroke:#8a99ab;stroke-width:2;marker-end:url(#a)}.node{fill:#eef5fb;stroke:#5681ad;stroke-width:1.5}.ready{fill:#e8f5ec;stroke:#3fa35b;stroke-width:2}.future{fill:#f5f6f8;stroke:#aab4c2;stroke-width:1.4;stroke-dasharray:6 4}.gate{fill:#fff7e8;stroke:#d99a2b;stroke-width:1.7}.worker{fill:#fff;stroke:#b5bfcc;stroke-width:1.4}.flow{fill:none;stroke:#526174;stroke-width:2;marker-end:url(#a)}.sig{fill:none;stroke:#9b6fc4;stroke-width:2.2;marker-end:url(#p)}.cursor{fill:#2c7be5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b6fc4"/></marker></defs>
  <rect width="1200" height="380" fill="#fff"/><text x="35" y="38" class="h">⑥ T_CHILD_1 완료 → LWM=2 → wake-up</text><rect x="950" y="16" width="205" height="36" rx="18" fill="#efe6f7" stroke="#9b6fc4"/><text x="1052" y="40" text-anchor="middle" class="m">LWM 1 → 2</text>
  <text x="35" y="78" class="t">relay log</text><line x1="130" y1="73" x2="1155" y2="73" class="rail"/>
  <rect x="40" y="96" width="245" height="70" rx="9" class="node"/><text x="162" y="125" text-anchor="middle" class="h">T_PARENT</text><text x="162" y="150" text-anchor="middle" class="t">완료</text>
  <rect x="310" y="96" width="245" height="70" rx="9" class="node"/><text x="432" y="125" text-anchor="middle" class="h">T_CHILD_1</text><text x="432" y="150" text-anchor="middle" class="t">완료 · SEQ=2</text>
  <rect x="580" y="96" width="245" height="70" rx="9" class="ready"/><text x="702" y="125" text-anchor="middle" class="h">T_CHILD_2</text><text x="702" y="150" text-anchor="middle" class="m">LC=2 ≤ LWM=2</text>
  <rect x="850" y="96" width="305" height="70" rx="9" class="future"/><text x="1002" y="125" text-anchor="middle" class="h">T_INDEPENDENT</text><text x="1002" y="150" text-anchor="middle" class="m">LC=1</text>
  <path d="M702 88l-11-16h22z" class="cursor"/><path d="M432 173C480 220 560 220 625 185" class="sig"/><text x="475" y="233" class="t" style="fill:#76529d">완료 표시 · condition signal</text>
  <rect x="550" y="245" width="300" height="62" rx="9" class="gate"/><text x="700" y="271" text-anchor="middle" class="m">wake-up → 2 ≤ 2</text><text x="700" y="294" text-anchor="middle" class="t">재판정 후 통과</text><path d="M850 276H905" class="flow"/>
  <rect x="910" y="245" width="245" height="62" rx="9" class="worker"/><text x="935" y="271" class="h">worker 1</text><rect x="935" y="280" width="190" height="19" rx="5" fill="#2c7be5"/><text x="1030" y="296" text-anchor="middle" class="t" style="fill:#fff">T_CHILD_2</text>
</svg>
