<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="500" viewBox="0 0 1250 500">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526174}.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:14px}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#a)}.join{fill:none;stroke:#94a3b8;stroke-width:2}</style>
  <rect width="1250" height="500" fill="#fff"/>
  <text x="38" y="44" class="title">REPL·WS_LABEL·COMMIT에서 transaction task 구성</text>
  <rect x="45" y="92" width="210" height="74" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="150" y="122" text-anchor="middle" class="head">REPL items</text><text x="150" y="149" text-anchor="middle" class="small">trid=T1 · 변경 목록</text>
  <rect x="310" y="92" width="250" height="74" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="435" y="122" text-anchor="middle" class="head">WS_LABEL</text><text x="435" y="149" text-anchor="middle" class="small">trid=T1 · dependency</text>
  <rect x="615" y="92" width="230" height="74" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="730" y="122" text-anchor="middle" class="head">COMMIT</text><text x="730" y="149" text-anchor="middle" class="small">trid=T1 · commit_lsa</text>
  <path d="M150 166V200" class="join"/><path d="M435 166V200" class="join"/><path d="M730 166V200" class="join"/><path d="M150 200H730" class="join"/><path d="M440 200V235" class="line"/><text x="465" y="224" class="small">같은 trid 확인</text>
  <rect x="235" y="235" width="410" height="155" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="440" y="270" text-anchor="middle" class="head">LA_APPLY_TASK · T1</text><line x1="260" y1="286" x2="620" y2="286" stroke="#cbd5e1"/><text x="265" y="317" class="mono">apply → T1의 LA_APPLY</text><text x="265" y="347" class="mono">dependency_seq · dependency_is_read</text><text x="265" y="377" class="mono">commit_lsa</text>
  <path d="M645 313H820" class="line"/><text x="732" y="296" text-anchor="middle" class="small">완성된 task 전달</text>
  <rect x="820" y="250" width="375" height="126" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1008" y="290" text-anchor="middle" class="head">dependency gate</text><text x="1008" y="322" text-anchor="middle" class="body">la_gate_is_satisfied()</text><text x="1008" y="350" text-anchor="middle" class="small">판정과 queue 배정은 8-2.4에서 설명</text>
  <text x="45" y="448" class="small">WS_LABEL은 같은 trid의 COMMIT에만 연결하고, task는 복제 항목을 복사하지 않고 LA_APPLY를 가리켜야 한다.</text>
</svg>
