<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img"><title>재시작 — reader는 C0로, 복구 상한은 R로 고정</title><defs><marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker></defs><rect width="1200" height="540" fill="#fff"/><text x="40" y="48" font-size="28" font-weight="700" fill="#111827">2/5 · 재시작 — reader는 C0로, 복구 상한은 R로 고정</text><text x="40" y="88" font-size="16" font-weight="700" fill="#374151">① COMMIT LSA와 복구 경계</text><line x1="40" y1="177" x2="1160" y2="177" stroke="#374151" stroke-width="3"/><rect x="48" y="150" width="124" height="54" rx="7" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="110" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C0</text><text x="110" y="193" font-size="12" text-anchor="middle" fill="#6b7280">안전 완료</text><rect x="238" y="150" width="124" height="54" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="300" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C1</text><text x="300" y="193" font-size="12" text-anchor="middle" fill="#6b7280">hole</text><rect x="428" y="150" width="124" height="54" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="490" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C2</text><text x="490" y="193" font-size="12" text-anchor="middle" fill="#6b7280">먼저 완료</text><rect x="618" y="150" width="124" height="54" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="680" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C3</text><text x="680" y="193" font-size="12" text-anchor="middle" fill="#6b7280">먼저 완료</text><rect x="808" y="150" width="124" height="54" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="870" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R</text><text x="870" y="193" font-size="12" text-anchor="middle" fill="#6b7280">복구 상한</text><rect x="998" y="150" width="124" height="54" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1060" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C4</text><text x="1060" y="193" font-size="12" text-anchor="middle" fill="#6b7280">정상 구간</text><line x1="110" y1="138" x2="110" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="0.0" y="104" width="220" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="110" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">reader 시작 = C0</text><line x1="870" y1="260" x2="870" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="720.0" y="226" width="300" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="870" y="249" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">recovery_boundary_lsa = R</text><line x1="122" y1="286" x2="844" y2="286" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/><text x="122" y="278" font-size="15" font-weight="700" fill="#ea580c">(C0, R] 재독</text><text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면의 처리</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="358" font-size="17" font-weight="700" fill="#9a3412">복원</text><text x="370" y="358" font-size="17" fill="#9a3412">영속 committed_lsa=C0에서 다시 읽기 시작</text><text x="64" y="388" font-size="17" font-weight="700" fill="#9a3412">고정</text><text x="370" y="388" font-size="17" fill="#9a3412">덮어쓰기 전 final_lsa=R을 recovery boundary로 보존</text><text x="64" y="418" font-size="17" font-weight="700" fill="#9a3412">복구 범위</text><text x="370" y="418" font-size="17" fill="#9a3412">(C0, R]만 재적용 오류 skip 후보로 구분</text><text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ 상태</text><text x="100" y="458" font-size="15" fill="#6b7280">R은 reader 시작점이 아니라 이전 실행이 읽었던 범위의 상한이다.</text><rect x="0" y="476" width="1200" height="64" fill="#0f172a"/><text x="40" y="507" font-size="15" font-weight="700" fill="#f8fafc">병렬 적용 재시작 · error skip</text><text x="1160" y="507" font-size="14" text-anchor="end" fill="#cbd5e1">장면 2/5</text></svg>