<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <style>
      .title{font:700 30px sans-serif;fill:#0f172a}
      .sub{font:500 17px sans-serif;fill:#475569}
      .head{font:700 19px sans-serif;fill:#0f172a}
      .body{font:500 16px sans-serif;fill:#334155}
      .small{font:500 14px sans-serif;fill:#64748b}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:14}
      .tx1{fill:#eff6ff;stroke:#2563eb}
      .tx2{fill:#f5f3ff;stroke:#7c3aed}
      .key{fill:#f8fafc;stroke:#64748b}
      .hash{fill:#ecfdf5;stroke:#059669}
      .hit{fill:#fff7ed;stroke:#ea580c}
      .free{fill:#f0fdf4;stroke:#16a34a}
      .note{fill:#fffbeb;stroke:#d97706}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect width="1600" height="720" fill="#fff"/>
  <text x="50" y="52" class="title">트랜잭션의 행 연산에서 writeset 충돌 판정까지</text>
  <text x="50" y="84" class="sub">논리 키를 같은 규칙으로 해시하고, 두 집합에 같은 해시가 있는지만 비교한다</text>

  <rect x="55" y="130" width="245" height="205" class="box tx1"/>
  <text x="177" y="170" text-anchor="middle" class="head">트랜잭션 T1</text>
  <text x="82" y="210" class="body">INSERT · UPDATE · DELETE</text>
  <text x="82" y="246" class="body">PK · UNIQUE · FK 접근</text>
  <text x="82" y="292" class="small">행 전체가 아니라</text>
  <text x="82" y="316" class="small">충돌을 결정하는 키만 추출</text>

  <rect x="55" y="390" width="245" height="205" class="box tx2"/>
  <text x="177" y="430" text-anchor="middle" class="head">트랜잭션 T2</text>
  <text x="82" y="470" class="body">INSERT · UPDATE · DELETE</text>
  <text x="82" y="506" class="body">PK · UNIQUE · FK 접근</text>
  <text x="82" y="552" class="small">T1과 같은 구성·정규화</text>
  <text x="82" y="576" class="small">규칙을 사용</text>

  <path d="M300 232 H375" class="arrow"/>
  <path d="M300 492 H375" class="arrow"/>

  <rect x="375" y="130" width="330" height="205" class="box key"/>
  <text x="540" y="170" text-anchor="middle" class="head">T1 충돌 식별자 구성</text>
  <text x="540" y="216" text-anchor="middle" class="body">테이블 + 인덱스 + 키 값</text>
  <text x="540" y="250" text-anchor="middle" class="body">↓ 동일한 형식으로 정규화</text>
  <text x="540" y="294" text-anchor="middle" class="small">예: parent.PK(7), user.UQ(email)</text>

  <rect x="375" y="390" width="330" height="205" class="box key"/>
  <text x="540" y="430" text-anchor="middle" class="head">T2 충돌 식별자 구성</text>
  <text x="540" y="476" text-anchor="middle" class="body">테이블 + 인덱스 + 키 값</text>
  <text x="540" y="510" text-anchor="middle" class="body">↓ 동일한 형식으로 정규화</text>
  <text x="540" y="554" text-anchor="middle" class="small">예: parent.PK(7), order.PK(20)</text>

  <path d="M705 232 H780" class="arrow"/>
  <path d="M705 492 H780" class="arrow"/>

  <rect x="780" y="130" width="315" height="205" class="box hash"/>
  <text x="937" y="170" text-anchor="middle" class="head">writeset(T1)</text>
  <text x="820" y="218" class="body">{</text>
  <text x="850" y="218" class="body">H(parent.PK, 7),</text>
  <text x="850" y="254" class="body">H(user.UQ, email),</text>
  <text x="850" y="290" class="body">H(...)</text>
  <text x="1040" y="290" class="body">}</text>

  <rect x="780" y="390" width="315" height="205" class="box hash"/>
  <text x="937" y="430" text-anchor="middle" class="head">writeset(T2)</text>
  <text x="820" y="478" class="body">{</text>
  <text x="850" y="478" class="body">H(parent.PK, 7),</text>
  <text x="850" y="514" class="body">H(order.PK, 20),</text>
  <text x="850" y="550" class="body">H(...)</text>
  <text x="1040" y="550" class="body">}</text>

  <path d="M1095 232 H1170" class="arrow"/>
  <path d="M1095 492 H1170" class="arrow"/>

  <rect x="1170" y="170" width="375" height="180" class="box hit"/>
  <text x="1357" y="212" text-anchor="middle" class="head">교집합 있음</text>
  <text x="1357" y="254" text-anchor="middle" class="body">H(parent.PK, 7)이 같음</text>
  <text x="1357" y="294" text-anchor="middle" class="head">→ 보수적으로 선행 관계 생성</text>
  <text x="1357" y="326" text-anchor="middle" class="small">동일 키 접근 또는 해시 충돌</text>

  <rect x="1170" y="405" width="375" height="150" class="box free"/>
  <text x="1357" y="447" text-anchor="middle" class="head">교집합 없음</text>
  <text x="1357" y="489" text-anchor="middle" class="head">→ 서로 독립으로 판정 가능</text>
  <text x="1357" y="526" text-anchor="middle" class="small">필요한 키를 빠짐없이 수집했다는 전제</text>

  <path d="M1128 335 V390" class="dash"/>
  <rect x="375" y="635" width="1170" height="55" class="box note"/>
  <text x="960" y="669" text-anchor="middle" class="body">판정 단계는 해시의 원래 제약 종류를 다시 해석하지 않고, 같은 충돌 식별자인지만 비교한다.</text>
</svg>
