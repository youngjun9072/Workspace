<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1660" viewBox="0 0 1800 1660">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <marker id="return-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker>
  </defs>
  <style>
    text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.axislabel{font-size:15px;font-weight:700}
    .lane{rx:12;fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.store{rx:10;fill:#fff7ed;stroke:#f97316;stroke-width:2}.asis{rx:10;fill:#f1f5f9;stroke:#64748b;stroke-width:2}.worker{rx:10;fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.concept{rx:9;fill:#ecfeff;stroke:#0891b2;stroke-width:2}
    .axis{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.guide{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:6 6}.event{fill:#fff;stroke:#475569;stroke-width:2}.queueflow{stroke:#f97316;stroke-width:3;fill:none;marker-end:url(#arrow)}.return{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#return-arrow)}
  </style>
  <rect width="1800" height="1660" fill="#fff"/>
  <text x="900" y="46" text-anchor="middle" class="title">COMMIT task의 queue 진입·이탈 시점</text>

  <!-- As-Is comparison: no queue handoff. -->
  <text x="65" y="104" class="head">AS-IS</text>
  <rect x="65" y="125" width="1670" height="105" class="asis"/>
  <circle cx="220" cy="177" r="12" class="event"/><text x="220" y="157" text-anchor="middle" class="small">COMMIT 확인</text>
  <path d="M232 177H1490" class="axis"/><text x="850" y="167" text-anchor="middle" class="body">reader가 commit list에서 꺼내 직접 적용·commit</text>
  <circle cx="1510" cy="177" r="12" class="event"/><text x="1510" y="157" text-anchor="middle" class="small">완료 반영</text>

  <!-- One shared To-Be time axis. -->
  <text x="65" y="285" class="head">TO-BE</text>
  <path d="M180 350H1640" class="axis"/>
  <circle cx="220" cy="350" r="9" class="event"/><circle cx="520" cy="350" r="9" class="event"/><circle cx="850" cy="350" r="9" class="event"/><circle cx="1120" cy="350" r="9" class="event"/><circle cx="1500" cy="350" r="9" class="event"/>
  <text x="220" y="320" text-anchor="middle" class="axislabel">COMMIT task 완성</text>
  <text x="520" y="320" text-anchor="middle" class="axislabel">dependency 판정</text>
  <text x="850" y="320" text-anchor="middle" class="axislabel">worker 배정</text>
  <text x="1120" y="320" text-anchor="middle" class="axislabel">worker 완료</text>
  <text x="1500" y="310" text-anchor="middle" class="axislabel">reader 결과 수거</text><text x="1500" y="331" text-anchor="middle" class="axislabel">· 완료 반영</text>
  <path d="M220 366V1280M520 366V1280M850 366V1280M1120 366V1280M1500 366V1280" class="guide"/>

  <!-- Queue lane 1. -->
  <rect x="65" y="405" width="1670" height="155" class="lane"/>
  <text x="90" y="438" class="head">COMMIT order queue</text><text x="90" y="465" class="small">stores: COMMIT LSA</text>
  <circle cx="220" cy="505" r="12" class="event"/><text x="220" y="485" text-anchor="middle" class="small">enqueue · task 완성</text>
  <rect x="245" y="485" width="1230" height="40" class="store"/><text x="860" y="511" text-anchor="middle" class="body">로그에서 확인한 COMMIT 순서 보관</text>
  <path d="M1475 505H1488" class="queueflow"/><circle cx="1500" cy="505" r="12" class="event"/><text x="1500" y="485" text-anchor="middle" class="small">dequeue · head 완료 확인</text>

  <!-- Queue lane 2. -->
  <rect x="65" y="585" width="1670" height="155" class="lane"/>
  <text x="90" y="618" class="head">pending queue</text><text x="90" y="645" class="small">stores: task</text>
  <circle cx="520" cy="685" r="12" class="event"/><text x="520" y="665" text-anchor="middle" class="small">enqueue · dependency 미충족</text>
  <rect x="545" y="665" width="280" height="40" class="store"/><text x="685" y="691" text-anchor="middle" class="body">대기 중인 task</text>
  <path d="M825 685H838" class="queueflow"/><circle cx="850" cy="685" r="12" class="event"/><text x="850" y="665" text-anchor="middle" class="small">dequeue · 이후 dependency 충족</text>
  <path d="M850 673V385" class="return"/><text x="866" y="590" class="small" fill="#b91c1c">ready task를 worker 배정으로 반환</text>

  <!-- Queue lane 3. -->
  <rect x="65" y="765" width="1670" height="155" class="lane"/>
  <text x="90" y="798" class="head">dispatch order queue</text><text x="90" y="825" class="small">stores: tracking entry</text>
  <circle cx="850" cy="865" r="12" class="event"/><text x="850" y="845" text-anchor="middle" class="small">enqueue · worker 배정</text>
  <rect x="875" y="845" width="600" height="40" class="store"/><text x="1175" y="871" text-anchor="middle" class="body">배정 순서와 result 대응 상태 보관</text>
  <path d="M1475 865H1488" class="queueflow"/><circle cx="1500" cy="865" r="12" class="event"/><text x="1500" y="845" text-anchor="middle" class="small">dequeue · head result 처리 완료</text>

  <!-- Queue lane 4 plus one worker timing marker. -->
  <rect x="65" y="945" width="1670" height="155" class="lane"/>
  <text x="90" y="978" class="head">worker input queue</text><text x="90" y="1005" class="small">stores: task</text>
  <circle cx="850" cy="1045" r="12" class="event"/><text x="850" y="1025" text-anchor="middle" class="small">enqueue · worker 배정</text>
  <rect x="875" y="1025" width="130" height="40" class="store"/><text x="940" y="1051" text-anchor="middle" class="body">task</text>
  <path d="M1005 1045H1018" class="queueflow"/><circle cx="1030" cy="1045" r="12" class="event"/><text x="1030" y="1025" text-anchor="middle" class="small">dequeue · worker 시작</text>
  <rect x="1050" y="1008" width="165" height="74" class="worker"/><text x="1132" y="1038" text-anchor="middle" class="head">[worker]</text><text x="1132" y="1065" text-anchor="middle" class="small">task 실행 구간</text>

  <!-- Queue lane 5. -->
  <rect x="65" y="1125" width="1670" height="155" class="lane"/>
  <text x="90" y="1158" class="head">worker result queue</text><text x="90" y="1185" class="small">stores: result</text>
  <circle cx="1120" cy="1225" r="12" class="event"/><text x="1120" y="1205" text-anchor="middle" class="small">enqueue · worker 완료</text>
  <rect x="1145" y="1205" width="330" height="40" class="store"/><text x="1310" y="1231" text-anchor="middle" class="body">완료 result</text>
  <path d="M1475 1225H1488" class="queueflow"/><circle cx="1500" cy="1225" r="12" class="event"/><text x="1500" y="1205" text-anchor="middle" class="small">알림 확인 · batch 수거</text>

  <!-- Conceptual reader processing after result dequeue: target success boundary. -->
  <text x="65" y="1320" class="head">result 수거 뒤 reader의 목표 처리 순서</text>
  <path d="M1500 1237V1345H135V1365" class="axis"/><text x="1330" y="1332" class="small">result 수거 후</text>
  <rect x="120" y="1365" width="225" height="100" class="concept"/><text x="232" y="1403" text-anchor="middle" class="body">배정 기록과</text><text x="232" y="1432" text-anchor="middle" class="body">result 대응</text>
  <path d="M345 1415H365" class="axis"/>
  <rect x="365" y="1365" width="175" height="100" class="concept"/><text x="452" y="1403" text-anchor="middle" class="body">성공 확인</text><text x="452" y="1432" text-anchor="middle" class="small">오류면 완료 갱신 금지</text>
  <path d="M540 1415H560" class="axis"/>
  <rect x="560" y="1365" width="190" height="100" class="concept"/><text x="655" y="1403" text-anchor="middle" class="body">완료 상태 갱신</text><text x="655" y="1432" text-anchor="middle" class="small">성공 결과만 반영</text>
  <path d="M750 1415H770" class="axis"/>
  <rect x="770" y="1365" width="320" height="100" class="concept"/><text x="930" y="1396" text-anchor="middle" class="body">COMMIT 순서 queue의</text><text x="930" y="1423" text-anchor="middle" class="body">완료된 head 소비</text><text x="930" y="1450" text-anchor="middle" class="small">연속 완료 경계 전진</text>
  <path d="M1090 1415H1110" class="axis"/>
  <rect x="1110" y="1365" width="190" height="100" class="concept"/><text x="1205" y="1403" text-anchor="middle" class="body">pending 재판정</text><text x="1205" y="1432" text-anchor="middle" class="small">ready task 재배정</text>
  <path d="M1300 1415H1320" class="axis"/>
  <rect x="1320" y="1365" width="300" height="100" class="concept"/><text x="1470" y="1403" text-anchor="middle" class="body">순서대로 retire</text><text x="1470" y="1432" text-anchor="middle" class="small">committed_lsa에 경계 반영</text>

  <line x1="110" y1="1560" x2="175" y2="1560" class="queueflow"/><text x="190" y="1566" class="small">queue 안에서 보관되는 방향</text>
  <line x1="520" y1="1560" x2="585" y2="1560" class="return"/><text x="600" y="1566" class="small">pending task의 재배정 복귀</text>
  <rect x="1010" y="1543" width="50" height="34" class="worker"/><text x="1075" y="1566" class="small">worker 실행 timing marker</text>
</svg>
