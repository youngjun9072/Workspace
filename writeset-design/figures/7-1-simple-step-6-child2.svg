= C2</text><rect x="448" y="188" width="464" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="618" y1="188" x2="618" y2="220" stroke="#94a3b8"/><line x1="743" y1="188" x2="743" y2="220" stroke="#94a3b8"/><text x="533" y="210" class="small" text-anchor="middle">hash</text><text x="680" y="210" class="small" text-anchor="middle">write_seq</text><text x="827.5" y="210" class="small" text-anchor="middle">ref_seq</text><rect x="448" y="220" width="464" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="618" y1="220" x2="618" y2="258" stroke="#cbd5e1"/><line x1="743" y1="220" x2="743" y2="258" stroke="#cbd5e1"/><text x="533" y="245" class="mono" text-anchor="middle">H_P1</text><text x="680" y="245" class="mono" text-anchor="middle">C3</text><text x="827.5" y="245" class="mono" text-anchor="middle">C5</text><rect x="448" y="258" width="464" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="618" y1="258" x2="618" y2="296" stroke="#cbd5e1"/><line x1="743" y1="258" x2="743" y2="296" stroke="#cbd5e1"/><text x="533" y="283" class="mono" text-anchor="middle">H_I1</text><text x="680" y="283" class="mono" text-anchor="middle">C4</text><text x="827.5" y="283" class="mono" text-anchor="middle">—</text><rect x="448" y="296" width="464" height="38" fill="#ffffff" stroke="#cbd5e1"/><line x1="618" y1="296" x2="618" y2="334" stroke="#cbd5e1"/><line x1="743" y1="296" x2="743" y2="334" stroke="#cbd5e1"/><text x="533" y="321" class="mono" text-anchor="middle">H_C10</text><text x="680" y="321" class="mono" text-anchor="middle">C5</text><text x="827.5" y="321" class="mono" text-anchor="middle">—</text><text x="448" y="395" class="paneltitle" text-anchor="start">알고리즘 1·2 실행</text><text x="448" y="426" class="mono" text-anchor="start">parent 초기값 = C2</text><text x="448" y="453" class="mono" text-anchor="start">H_C11 WRITE: 슬롯 없음 → candidate=NULL</text><text x="448" y="480" class="mono" text-anchor="start">H_P1 REF: write_seq C3만 조회</text><text x="448" y="507" class="mono" text-anchor="start">ref_seq C5는 REF probe에서 읽지 않음</text><text x="448" y="534" class="mono" text-anchor="start">parent: C2 → C3</text><path d="M385 280 H420" class="probe"/><text x="402" y="269" class="small" text-anchor="middle">probe</text><rect x="975" y="100" width="670" height="250" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1000" y="135" class="paneltitle" text-anchor="start">③ 선행 후보 parent로 최종 lc와 COMMIT 확정</text><text x="1000" y="177" class="mono" text-anchor="start">lc(dependency_seq) = min(parent C3, prev_commit C5) = C3</text><text x="1000" y="210" class="mono" text-anchor="start">dependency_is_ref=false</text><text x="1000" y="243" class="mono" text-anchor="start">LOG_DUMMY_WS_LABEL: dependency_seq=C3</text><text x="1000" y="276" class="mono" text-anchor="start">LOG_COMMIT 위치 = C6</text><path d="M940 225 H975" class="arrow"/><rect x="975" y="375" width="670" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1000" y="410" class="paneltitle" text-anchor="start">④ COMMIT 뒤 history publish</text><text x="1000" y="446" class="mono" text-anchor="start">H_C11.write_seq = C6</text><text x="1000" y="472" class="mono" text-anchor="start">H_P1.ref_seq = max(C5, C6) = C6</text><text x="1260" y="410" class="paneltitle" text-anchor="start">갱신 뒤 history</text><text x="1260" y="437" class="mono" text-anchor="start">history_start = C2</text><rect x="1260" y="458" width="350" height="32" fill="#e2e8f0" stroke="#94a3b8"/><line x1="1430" y1="458" x2="1430" y2="490" stroke="#94a3b8"/><line x1="1555" y1="458" x2="1555" y2="490" stroke="#94a3b8"/><text x="1345" y="480" class="small" text-anchor="middle">hash</text><text x="1492" y="480" class="small" text-anchor="middle">write_seq</text><text x="1582.5" y="480" class="small" text-anchor="middle">ref_seq</text><rect x="1260" y="490" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1430" y1="490" x2="1430" y2="528" stroke="#cbd5e1"/><line x1="1555" y1="490" x2="1555" y2="528" stroke="#cbd5e1"/><text x="1345" y="515" class="mono" text-anchor="middle">H_P1</text><text x="1492" y="515" class="mono" text-anchor="middle">C3</text><text x="1582.5" y="515" class="mono" text-anchor="middle">C6</text><rect x="1260" y="528" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1430" y1="528" x2="1430" y2="566" stroke="#cbd5e1"/><line x1="1555" y1="528" x2="1555" y2="566" stroke="#cbd5e1"/><text x="1345" y="553" class="mono" text-anchor="middle">H_I1</text><text x="1492" y="553" class="mono" text-anchor="middle">C4</text><text x="1582.5" y="553" class="mono" text-anchor="middle">—</text><rect x="1260" y="566" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1430" y1="566" x2="1430" y2="604" stroke="#cbd5e1"/><line x1="1555" y1="566" x2="1555" y2="604" stroke="#cbd5e1"/><text x="1345" y="591" class="mono" text-anchor="middle">H_C10</text><text x="1492" y="591" class="mono" text-anchor="middle">C5</text><text x="1582.5" y="591" class="mono" text-anchor="middle">—</text><rect x="1260" y="604" width="350" height="38" fill="#ecfdf5" stroke="#cbd5e1"/><line x1="1430" y1="604" x2="1430" y2="642" stroke="#cbd5e1"/><line x1="1555" y1="604" x2="1555" y2="642" stroke="#cbd5e1"/><text x="1345" y="629" class="mono" text-anchor="middle">H_C11</text><text x="1492" y="629" class="mono" text-anchor="middle">C6</text><text x="1582.5" y="629" class="mono" text-anchor="middle">—</text><path d="M1310 350 V375" class="publish"/><rect x="120" y="675" width="1440" height="76" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="840" y="707" class="paneltitle" text-anchor="middle">핵심</text><text x="840" y="735" class="body" text-anchor="middle">둘째 자식도 부모 WRITE C3만 기다린다. 앞선 REF C5를 dependency로 삼지 않아 T5와 T6은 서로 병렬 가능하다.</text></svg>