<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="590" viewBox="0 0 1260 590" role="img" aria-labelledby="title desc">
  <title id="title">Dispatch Order가 필요한 이유</title>
  <desc id="desc">task가 LA_APPLY 포인터를 worker에 전달한 뒤 reader가 다음 로그를 읽는 동안에도 transaction slot을 유지하고, result를 원래 task에 연결해 확정한 뒤 slot을 해제하는 세 단계.</desc>
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#64748b}
      .step{font-size:17px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#64748b}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.slot{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.task{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.worker{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.result{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.order{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.release{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.purple{fill:none;stroke:#7c3aed;stroke-width:2.7;marker-end:url(#purpleArrow)}.green{fill:none;stroke:#16a34a;stroke-width:2.7;marker-end:url(#greenArrow)}.dash{stroke-dasharray:8 6}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <rect width="1260" height="590" fill="#fff"/>
  <text x="40" y="45" class="title">task를 넘긴 시점과 transaction slot을 비울 수 있는 시점은 다르다</text>
  <text x="40" y="74" class="sub">Dispatch Order는 두 시점 사이에서 배정 순번과 LA_APPLY 포인터를 보존한다.</text>

  <rect x="40" y="110" width="350" height="290" rx="18" class="panel"/>
  <text x="65" y="143" class="step">① task 생성과 전달</text>
  <rect x="75" y="175" width="150" height="150" rx="13" class="slot"/>
  <text x="150" y="205" text-anchor="middle" class="head">LA_APPLY(T1)</text>
  <text x="150" y="235" text-anchor="middle" class="body">LA_ITEM #1</text>
  <text x="150" y="262" text-anchor="middle" class="body">LA_ITEM #2</text>
  <text x="150" y="292" text-anchor="middle" class="small">transaction slot</text>
  <rect x="265" y="195" width="95" height="105" rx="13" class="task"/>
  <text x="312" y="225" text-anchor="middle" class="head">task</text>
  <text x="312" y="254" text-anchor="middle" class="mono">seq=21</text>
  <text x="312" y="279" text-anchor="middle" class="mono">apply→T1</text>
  <path d="M265 268H230" class="purple"/>
  <text x="215" y="350" text-anchor="middle" class="small">item을 복사하지 않고 기존 slot을 가리킴</text>

  <rect x="455" y="110" width="350" height="290" rx="18" class="panel"/>
  <text x="480" y="143" class="step">② worker 처리 중</text>
  <rect x="490" y="180" width="135" height="110" rx="13" class="worker"/>
  <text x="557" y="214" text-anchor="middle" class="head">worker</text>
  <text x="557" y="244" text-anchor="middle" class="body">T1 적용 중</text>
  <text x="557" y="270" text-anchor="middle" class="small">DB COMMIT 전</text>
  <rect x="665" y="180" width="105" height="110" rx="13" class="slot"/>
  <text x="717" y="213" text-anchor="middle" class="head">T1 slot</text>
  <text x="717" y="244" text-anchor="middle" class="body">유지</text>
  <text x="717" y="270" text-anchor="middle" class="small">재사용 금지</text>
  <path d="M625 235H660" class="purple dash"/>
  <text x="630" y="330" text-anchor="middle" class="body">reader는 T2·T3 로그를 계속 읽어도</text>
  <text x="630" y="356" text-anchor="middle" class="body">T1의 item 목록은 그대로 남겨 둔다.</text>

  <rect x="870" y="110" width="350" height="290" rx="18" class="panel"/>
  <text x="895" y="143" class="step">③ result 확정 뒤 해제</text>
  <rect x="900" y="180" width="135" height="105" rx="13" class="result"/>
  <text x="967" y="213" text-anchor="middle" class="head">result</text>
  <text x="967" y="242" text-anchor="middle" class="mono">seq=21</text>
  <text x="967" y="267" text-anchor="middle" class="small">DB COMMIT 성공</text>
  <rect x="1070" y="180" width="115" height="105" rx="13" class="release"/>
  <text x="1127" y="213" text-anchor="middle" class="head">T1 slot</text>
  <text x="1127" y="243" text-anchor="middle" class="body">해제</text>
  <text x="1127" y="268" text-anchor="middle" class="small">재사용 가능</text>
  <path d="M1035 232H1065" class="green"/>
  <text x="1045" y="330" text-anchor="middle" class="body">배정 순번으로 원래 task를 찾아</text>
  <text x="1045" y="356" text-anchor="middle" class="body">결과를 확정한 뒤에만 비운다.</text>

  <path d="M390 255H450" class="line"/>
  <path d="M805 255H865" class="line"/>

  <rect x="250" y="455" width="760" height="92" rx="15" class="order"/>
  <text x="280" y="488" class="head">Dispatch Order</text>
  <text x="470" y="488" class="mono">dispatch_seq=21</text>
  <text x="655" y="488" class="mono">apply→LA_APPLY(T1)</text>
  <text x="875" y="488" class="body">result 확정까지 보존</text>
  <text x="630" y="522" text-anchor="middle" class="small">task가 worker queue에서 사라져도 reader/coordinator가 원래 transaction slot을 잃지 않게 한다.</text>
  <path d="M312 300V450" class="purple"/>
  <path d="M967 285V450" class="green"/>
</svg>
