  <rect x="855" y="125" width="540" height="66" rx="12" class="fn"/>
  <text x="1125" y="165" text-anchor="middle" class="head">log_append_repl_info_and_commit_log()</text>
  <path d="M1125 191 V225" class="arrow"/>
