<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;font-size:15px}
      .title{font-size:25px;font-weight:700}.side{font-size:21px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#64748b}.newText{font-size:13px;font-weight:700;fill:#b91c1c}
      .fn{fill:#f8fafc;stroke:#64748b;stroke-width:2}.mutex{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5}.repl{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.label{fill:#fef2f2;stroke:#dc2626;stroke-width:2.5}.commit{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.added{fill:#dc2626;fill-opacity:.035;stroke:#dc2626;stroke-width:3}
      .arrow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.divider{stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="1500" height="610" fill="#fff"/>
