<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      text{font-family:'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#64748b}.side{font-size:22px;font-weight:700}.category{font-size:15px;font-weight:700;fill:#475569}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:13px;fill:#64748b}.num{font-size:15px;font-weight:700;fill:#fff}
      .header{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.row{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.mysql{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.cubrid{fill:#f5f3ff;stroke:#7c5cc4;stroke-width:2}.history{fill:#fff7ed;stroke:#f97316;stroke-width:2}.log{fill:#eef6ff;stroke:#3978b8;stroke-width:2}.publish{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}.lock{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.empty{fill:#fafafa;stroke:#e5e7eb;stroke-width:1.5;stroke-dasharray:6 5}.grid{stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#fff"/>
  <text x="50" y="48" class="title">MySQL LC·SEQ와 CUBRID dependency·COMMIT LSA의 기능별 대응</text>
  <text x="50" y="78" class="sub">같은 의미의 동작을 같은 행에 놓았다. 원 안의 번호는 각 시스템 안에서 실제로 실행되는 순서이며, 직접 대응이 없는 칸은 비워 두었다.</text>

  <rect x="45" y="110" width="1510" height="80" rx="14" class="header"/>
  <line x1="650" y1="110" x2="650" y2="1080" class="grid"/>
  <line x1="950" y1="110" x2="950" y2="1080" class="grid"/>
  <text x="347" y="158" text-anchor="middle" class="side">MySQL</text>
  <text x="800" y="158" text-anchor="middle" class="category">비교 기준</text>
  <text x="1252" y="158" text-anchor="middle" class="side">CUBRID</text>

  <rect x="45" y="190" width="1510" height="126" class="row"/>
  <text x="800" y="244" text-anchor="middle" class="category">선행 dependency 계산</text>
  <text x="800" y="270" text-anchor="middle" class="small">과거 이력에서 기다릴 위치를 결정</text>
  <rect x="85" y="210" width="525" height="86" rx="12" class="history"/>
  <circle cx="117" cy="238" r="17" fill="#f97316"/><text x="117" y="244" text-anchor="middle" class="num">②</text>
  <text x="347" y="241" text-anchor="middle" class="head">history에서 후보 P 계산</text>
  <text x="347" y="269" text-anchor="middle" class="body">commit-order C와 결합해 최종 LC 확정</text>
  <rect x="990" y="210" width="525" height="86" rx="12" class="history"/>
  <circle cx="1022" cy="238" r="17" fill="#f97316"/><text x="1022" y="244" text-anchor="middle" class="num">①</text>
  <text x="1252" y="241" text-anchor="middle" class="head">history에서 선행 LSA 계산</text>
  <text x="1252" y="269" text-anchor="middle" class="body">WRITE·REF 규칙으로 dependency_seq 확정</text>

  <rect x="45" y="316" width="1510" height="126" class="row"/>
  <text x="800" y="370" text-anchor="middle" class="category">본인 순서 좌표 확정</text>
  <text x="800" y="396" text-anchor="middle" class="small">현재 트랜잭션을 뒤 트랜잭션이 참조할 위치</text>
  <rect x="85" y="336" width="525" height="86" rx="12" class="mysql"/>
  <circle cx="117" cy="364" r="17" fill="#3b82f6"/><text x="117" y="370" text-anchor="middle" class="num">①</text>
  <text x="347" y="367" text-anchor="middle" class="head">현재 SEQ 할당</text>
  <text x="347" y="395" text-anchor="middle" class="body">history 조회 전에 본인 순번이 존재</text>
  <rect x="990" y="336" width="525" height="86" rx="12" class="cubrid"/>
  <circle cx="1022" cy="364" r="17" fill="#7c5cc4"/><text x="1022" y="370" text-anchor="middle" class="num">④</text>
  <text x="1252" y="367" text-anchor="middle" class="head">COMMIT LSA 확정</text>
  <text x="1252" y="395" text-anchor="middle" class="body">COMMIT 레코드를 기록할 때 본인 위치 생성</text>

  <rect x="45" y="442" width="1510" height="126" class="row"/>
  <text x="800" y="496" text-anchor="middle" class="category">dependency와 본인 좌표를</text>
  <text x="800" y="520" text-anchor="middle" class="category">하나의 메타데이터에 함께 기록</text>
  <rect x="85" y="462" width="525" height="86" rx="12" class="log"/>
  <circle cx="117" cy="490" r="17" fill="#3978b8"/><text x="117" y="496" text-anchor="middle" class="num">③</text>
  <text x="347" y="493" text-anchor="middle" class="head">GTID 이벤트 기록</text>
  <text x="347" y="521" text-anchor="middle" class="body">{ last_committed=LC, sequence_number=SEQ }</text>
  <rect x="990" y="462" width="525" height="86" rx="12" class="empty"/>

  <rect x="45" y="568" width="1510" height="126" class="row"/>
  <text x="800" y="622" text-anchor="middle" class="category">dependency만 별도 메타데이터로 기록</text>
  <text x="800" y="648" text-anchor="middle" class="small">본인 좌표는 뒤의 COMMIT 레코드 위치로 표현</text>
  <rect x="85" y="588" width="525" height="86" rx="12" class="empty"/>
  <rect x="990" y="588" width="525" height="86" rx="12" class="log"/>
  <circle cx="1022" cy="616" r="17" fill="#3978b8"/><text x="1022" y="622" text-anchor="middle" class="num">③</text>
  <text x="1252" y="619" text-anchor="middle" class="head">LOG_DUMMY_WS_LABEL 기록</text>
  <text x="1252" y="647" text-anchor="middle" class="body">{ dependency_seq, dependency_is_ref }</text>

  <rect x="45" y="694" width="1510" height="126" class="row"/>
  <text x="800" y="748" text-anchor="middle" class="category">변경·COMMIT 로그 기록</text>
  <text x="800" y="774" text-anchor="middle" class="small">슬레이브가 적용할 트랜잭션 로그 묶음</text>
  <rect x="85" y="714" width="525" height="86" rx="12" class="mysql"/>
  <circle cx="117" cy="742" r="17" fill="#3b82f6"/><text x="117" y="748" text-anchor="middle" class="num">④</text>
  <text x="347" y="745" text-anchor="middle" class="head">binlog cache 기록</text>
  <text x="347" y="773" text-anchor="middle" class="body">TABLE_MAP · ROW · COMMIT 이벤트</text>
  <rect x="990" y="704" width="525" height="106" rx="12" class="cubrid"/>
  <circle cx="1022" cy="732" r="17" fill="#7c5cc4"/><text x="1022" y="738" text-anchor="middle" class="num">②</text>
  <text x="1252" y="735" text-anchor="middle" class="head">REPL 레코드 기록</text>
  <circle cx="1022" cy="777" r="17" fill="#7c5cc4"/><text x="1022" y="783" text-anchor="middle" class="num">④</text>
  <text x="1252" y="780" text-anchor="middle" class="head">COMMIT 레코드 기록</text>

  <rect x="45" y="820" width="1510" height="126" class="row"/>
  <text x="800" y="874" text-anchor="middle" class="category">현재 위치를 history에 게시</text>
  <text x="800" y="900" text-anchor="middle" class="small">뒤 트랜잭션의 충돌 조회 입력</text>
  <rect x="85" y="840" width="525" height="86" rx="12" class="publish"/>
  <circle cx="117" cy="868" r="17" fill="#22c55e"/><text x="117" y="874" text-anchor="middle" class="num">②</text>
  <text x="347" y="871" text-anchor="middle" class="head">history[hash] = 현재 SEQ</text>
  <text x="347" y="899" text-anchor="middle" class="body">dependency 계산과 같은 history 처리에서 수행</text>
  <rect x="990" y="840" width="525" height="86" rx="12" class="publish"/>
  <circle cx="1022" cy="868" r="17" fill="#22c55e"/><text x="1022" y="874" text-anchor="middle" class="num">⑤</text>
  <text x="1252" y="871" text-anchor="middle" class="head">COMMIT LSA를 history에 게시</text>
  <text x="1252" y="899" text-anchor="middle" class="body">게시한 뒤 행 잠금 해제</text>

  <rect x="45" y="946" width="1510" height="126" class="row"/>
  <text x="800" y="1000" text-anchor="middle" class="category">보호 구간</text>
  <text x="800" y="1026" text-anchor="middle" class="small">위 번호가 실행되는 순서를 보장하는 범위</text>
  <rect x="85" y="966" width="525" height="86" rx="12" class="lock"/>
  <text x="347" y="997" text-anchor="middle" class="head">binlog 기록 잠금</text>
  <text x="347" y="1025" text-anchor="middle" class="body">① → ② → ③ → ④를 순서대로 처리</text>
  <rect x="990" y="956" width="525" height="106" rx="12" class="lock"/>
  <text x="1252" y="987" text-anchor="middle" class="head">세 보호 구간</text>
  <text x="1252" y="1015" text-anchor="middle" class="body">history 조회 → 로그 기록 → history 게시</text>
  <text x="1252" y="1040" text-anchor="middle" class="small">하나의 같은 잠금으로 묶지 않음</text>
</svg>
