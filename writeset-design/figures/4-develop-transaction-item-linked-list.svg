<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text{font-family:'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033;font-size:15px}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.head{font-size:17px;font-weight:700}.label{font-size:14px;font-weight:700}.small{font-size:13px}.tiny{font-size:12px}
      .data{fill:#fff7ed;stroke:#f97316;stroke-width:2}.repl{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.commit{fill:#f0fdf4;stroke:#22c55e;stroke-width:2}
      .owner{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.apply{fill:#faf5ff;stroke:#a855f7;stroke-width:1.8}.queue{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.8}
      .blueLine{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#blue)}.orangeLine{fill:none;stroke:#ea580c;stroke-width:2;marker-end:url(#orange)}
      .greenLine{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#green)}.purpleLine{fill:none;stroke:#7c3aed;stroke-width:2;marker-end:url(#purple)}
      .dash{fill:none;stroke:#7c3aed;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#purple)}
    </style>
  </defs>

  <rect width="1280" height="650" fill="#fff"/>
  <text x="48" y="45" class="title">develop: 트랜잭션과 item이 로그 위치를 보관하는 방법</text>
  <text x="48" y="72" class="subtitle">같은 로그 타임라인의 위치를 LA_APPLY, LA_ITEM과 별도 LA_COMMIT 노드가 서로 다른 목적으로 가리킨다.</text>

  <text x="76" y="137" class="small" fill="#64748b">오래된 로그</text>
  <line x1="76" y1="155" x2="1110" y2="155" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1105" y="137" text-anchor="end" class="small" fill="#64748b">새 로그</text>

  <rect x="230" y="180" width="110" height="62" rx="8" class="data"/>
  <text x="285" y="207" text-anchor="middle" class="label">변경 데이터</text>
  <text x="285" y="229" text-anchor="middle" class="small">D1</text>

  <rect x="370" y="180" width="110" height="62" rx="8" class="repl"/>
  <text x="425" y="207" text-anchor="middle" class="label">복제 지시</text>
  <text x="425" y="229" text-anchor="middle" class="small">R1</text>

  <rect x="510" y="180" width="110" height="62" rx="8" class="data"/>
  <text x="565" y="207" text-anchor="middle" class="label">변경 데이터</text>
  <text x="565" y="229" text-anchor="middle" class="small">D2</text>

  <rect x="650" y="180" width="110" height="62" rx="8" class="repl"/>
  <text x="705" y="207" text-anchor="middle" class="label">복제 지시</text>
  <text x="705" y="229" text-anchor="middle" class="small">R2</text>

  <rect x="790" y="180" width="110" height="62" rx="8" class="commit"/>
  <text x="845" y="207" text-anchor="middle" class="label">COMMIT</text>
  <text x="845" y="229" text-anchor="middle" class="small">C1</text>

  <rect x="83" y="180" width="112" height="62" rx="8" class="apply"/>
  <text x="139" y="204" text-anchor="middle" class="label">LA_APPLY</text>
  <text x="139" y="225" text-anchor="middle" class="tiny">T1 범위 상태</text>
  <path d="M139 242 V274 H285 V248" class="purpleLine"/>
  <text x="197" y="291" text-anchor="middle" class="tiny" fill="#6d28d9">start_lsa = D1</text>
  <path d="M139 180 V113 H705 V174" class="dash"/>
  <text x="565" y="108" text-anchor="middle" class="tiny" fill="#6d28d9">long transaction에서만 last_lsa = R2</text>
  <path d="M195 232 H211 V330 H230" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#purple)"/>
  <text x="116" y="327" class="tiny" fill="#6d28d9">item list 소유</text>

  <rect x="230" y="345" width="250" height="100" rx="11" class="owner"/>
  <text x="355" y="371" text-anchor="middle" class="head">LA_ITEM #1</text>
  <rect x="244" y="387" width="111" height="42" rx="7" fill="#fff7ed" stroke="#f97316"/>
  <text x="299" y="413" text-anchor="middle" class="small">target_lsa = D1</text>
  <rect x="369" y="387" width="96" height="42" rx="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="417" y="413" text-anchor="middle" class="small">lsa = R1</text>
  <path d="M299 387 V248" class="orangeLine"/>
  <path d="M417 387 V248" class="blueLine"/>

  <rect x="510" y="345" width="250" height="100" rx="11" class="owner"/>
  <text x="635" y="371" text-anchor="middle" class="head">LA_ITEM #2</text>
  <rect x="524" y="387" width="111" height="42" rx="7" fill="#fff7ed" stroke="#f97316"/>
  <text x="579" y="413" text-anchor="middle" class="small">target_lsa = D2</text>
  <rect x="649" y="387" width="96" height="42" rx="7" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="697" y="413" text-anchor="middle" class="small">lsa = R2</text>
  <path d="M579 387 V248" class="orangeLine"/>
  <path d="M697 387 V248" class="blueLine"/>
  <path d="M480 395 H504" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="492" y="383" text-anchor="middle" class="tiny">next</text>

  <rect x="790" y="345" width="180" height="100" rx="11" class="queue"/>
  <text x="880" y="373" text-anchor="middle" class="head">LA_COMMIT</text>
  <text x="880" y="405" text-anchor="middle" class="label">log_lsa = C1</text>
  <text x="880" y="426" text-anchor="middle" class="tiny">COMMIT · SYSOP_END · ABORT</text>
  <text x="880" y="441" text-anchor="middle" class="tiny">별도 전역 commit list 노드</text>
  <path d="M845 345 V248" class="greenLine"/>

  <rect x="78" y="486" width="1110" height="104" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="103" y="516" class="label" fill="#6d28d9">LA_APPLY</text>
  <text x="218" y="516" class="small">트랜잭션의 시작 위치와 long transaction의 재탐색 상한을 보관한다.</text>
  <text x="103" y="544" class="label" fill="#1d4ed8">LA_ITEM</text>
  <text x="218" y="544" class="small">item을 linked list로 보관하며, `lsa`는 복제 지시 R, `target_lsa`는 실제 변경 데이터 D를 가리킨다.</text>
  <text x="103" y="572" class="label" fill="#15803d">LA_COMMIT</text>
  <text x="218" y="572" class="small">item 목록과 분리된 전역 commit list에서 트랜잭션 종료 위치 C를 보관한다.</text>
</svg>
