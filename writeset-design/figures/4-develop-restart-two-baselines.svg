<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">재시작 시 고정하는 두 완료 기준선</title>
  <desc id="desc">로그 시간축에 replication record 세 개와 COMMIT, 다음 replication record 세 개와 COMMIT을 배치한다. 첫 COMMIT C0는 last_committed_lsa, 그 직전 replication record R3는 last_committed_rep_lsa 기준선이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#526174}.axis{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.rep{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.commit{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.repbase{stroke:#f97316;stroke-width:4;stroke-dasharray:8 6}.commitbase{stroke:#dc2626;stroke-width:4;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1500" height="520" fill="#ffffff"/>
  <text x="50" y="52" class="title">재시작 시 직전 영속 상태에서 두 완료 기준선을 고정한다</text>
  <rect x="55" y="92" width="660" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="715" y="92" width="730" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="385" y="125" text-anchor="middle" class="head">직전 실행에서 영속된 범위</text>
  <text x="1080" y="125" text-anchor="middle" class="head">재시작 후 다시 처리할 범위</text>
  <line x1="95" y1="260" x2="1410" y2="260" class="axis"/>
  <g>
    <rect x="120" y="225" width="100" height="70" rx="10" class="rep"/><text x="170" y="254" text-anchor="middle" class="head">R1</text><text x="170" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="260" y="225" width="100" height="70" rx="10" class="rep"/><text x="310" y="254" text-anchor="middle" class="head">R2</text><text x="310" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="400" y="225" width="100" height="70" rx="10" class="rep"/><text x="450" y="254" text-anchor="middle" class="head">R3</text><text x="450" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="580" y="220" width="110" height="80" rx="10" class="commit"/><text x="635" y="253" text-anchor="middle" class="head">C0</text><text x="635" y="280" text-anchor="middle" class="small">COMMIT</text>
    <rect x="790" y="225" width="100" height="70" rx="10" class="rep"/><text x="840" y="254" text-anchor="middle" class="head">R4</text><text x="840" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="930" y="225" width="100" height="70" rx="10" class="rep"/><text x="980" y="254" text-anchor="middle" class="head">R5</text><text x="980" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="1070" y="225" width="100" height="70" rx="10" class="rep"/><text x="1120" y="254" text-anchor="middle" class="head">R6</text><text x="1120" y="279" text-anchor="middle" class="small">REPL</text>
    <rect x="1250" y="220" width="110" height="80" rx="10" class="commit"/><text x="1305" y="253" text-anchor="middle" class="head">C1</text><text x="1305" y="280" text-anchor="middle" class="small">COMMIT</text>
  </g>
  <line x1="450" y1="150" x2="450" y2="365" class="repbase"/>
  <rect x="245" y="145" width="410" height="42" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="450" y="172" text-anchor="middle" class="body">last_committed_rep_lsa = R3</text>
  <line x1="635" y1="185" x2="635" y2="395" class="commitbase"/>
  <rect x="480" y="365" width="310" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="635" y="392" text-anchor="middle" class="body">last_committed_lsa = C0</text>
  <text x="385" y="457" text-anchor="middle" class="body">C0 이하 트랜잭션은 전체를 건너뛴다</text>
  <text x="1080" y="457" text-anchor="middle" class="body">C0 뒤의 트랜잭션은 item을 확인해 적용한다</text>
  <text x="1080" y="487" text-anchor="middle" class="small">두 기준선은 재시작 동안 고정되며 DB 저장값의 하한으로도 사용한다</text>
</svg>
