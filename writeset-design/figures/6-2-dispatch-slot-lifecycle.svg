<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">reader의 item 수집과 Dispatch Order를 이용한 transaction slot 정리</title>
  <desc id="desc">reader가 REPL 로그를 읽어 la_Info.repl_lists의 transaction slot에 item을 넣고, T1 COMMIT 로그로 완성한 task를 dependency gate에서 판정한다. 통과한 task는 Dispatch Order에 등록되고 worker로 전달된다. worker 결과는 Dispatch Order에 연결되며 head 확정 시 T1 transaction slot을 정리한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526174}.line{fill:none;stroke:#475569;stroke-width:2.6;marker-end:url(#arrow)}.collect{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blueArrow)}.retire{fill:none;stroke:#dc2626;stroke-width:3;marker-end:url(#redArrow)}</style>
  </defs>
  <rect width="1500" height="650" fill="#ffffff"/>
  <text x="45" y="47" class="title">reader가 수집한 transaction slot을 worker 결과가 돌아올 때까지 보존한다</text>
  <rect x="55" y="135" width="235" height="120" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="172" y="180" text-anchor="middle" class="head">① reader/coordinator</text><text x="172" y="214" text-anchor="middle" class="body">로그 레코드 순서대로 읽기</text>
  <text x="510" y="91" class="head">la_Info.repl_lists[] · transaction별 LA_APPLY slot</text>
  <rect x="490" y="115" width="705" height="105" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="515" y="151" class="head">T1 slot</text>
  <rect x="660" y="134" width="105" height="48" rx="8" fill="#fff" stroke="#94a3b8"/><text x="712" y="164" text-anchor="middle" class="body">item 1</text><rect x="790" y="134" width="105" height="48" rx="8" fill="#fff" stroke="#94a3b8"/><text x="842" y="164" text-anchor="middle" class="body">item 2</text><rect x="920" y="134" width="105" height="48" rx="8" fill="#fff" stroke="#94a3b8"/><text x="972" y="164" text-anchor="middle" class="body">item 3</text><text x="1105" y="165" text-anchor="middle" class="small">COMMIT 대기</text>
  <rect x="490" y="245" width="705" height="105" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="515" y="281" class="head">T2 slot</text>
  <rect x="660" y="264" width="105" height="48" rx="8" fill="#fff" stroke="#94a3b8"/><text x="712" y="294" text-anchor="middle" class="body">item 1</text><rect x="790" y="264" width="115" height="48" rx="8" fill="#fff" stroke="#94a3b8"/><text x="847" y="294" text-anchor="middle" class="body">item 2</text><text x="1080" y="294" text-anchor="middle" class="small">reader가 계속 수집</text>
  <path d="M290 172 C360 125 415 157 480 157" class="collect"/><text x="340" y="126" class="body" fill="#2563eb">② REPL 로그: item 넣기</text><path d="M290 205 C370 225 395 286 480 286" class="collect"/>
  <rect x="270" y="430" width="300" height="100" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="420" y="469" text-anchor="middle" class="head">dependency gate</text><text x="420" y="500" text-anchor="middle" class="body">COMMIT에서 완성한 task 판정</text><path d="M172 255 C172 340 280 350 335 420" class="line"/><text x="183" y="348" class="body">② T1 COMMIT 로그</text>
  <rect x="700" y="410" width="360" height="120" rx="15" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="880" y="446" text-anchor="middle" class="head">③ Dispatch Order FIFO</text><rect x="740" y="463" width="280" height="48" rx="8" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="880" y="484" text-anchor="middle" class="body">head · dispatch 순번 1 · T1</text><text x="880" y="503" text-anchor="middle" class="small">task.apply → T1 slot을 결과 반환까지 보존</text><path d="M570 480H690" class="line"/><text x="630" y="464" text-anchor="middle" class="small">dispatch 순번·T1 slot 함께 기록</text>
  <rect x="1190" y="420" width="250" height="100" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="1315" y="458" text-anchor="middle" class="head">④ worker</text><text x="1315" y="489" text-anchor="middle" class="body">T1 적용·DB COMMIT</text><path d="M500 530 C710 595 1060 580 1190 500" class="line"/><text x="855" y="580" text-anchor="middle" class="small">gate를 통과한 T1 task 전달</text>
  <path d="M1190 470 H1070" class="retire"/><text x="1130" y="450" text-anchor="middle" class="body" fill="#dc2626">⑤ result.seq=1 (dispatch 순번)</text><text x="1130" y="495" text-anchor="middle" class="small" fill="#dc2626">기존 T1 entry에 결과 연결</text>
  <path d="M1000 410 C1120 360 1240 285 1195 190" class="retire"/><text x="1220" y="250" class="body" fill="#dc2626">⑤ head 결과 확정 후</text><text x="1210" y="165" class="body" fill="#dc2626">T1 slot·item 정리</text>
  <text x="45" y="625" class="small">Dispatch Order는 worker가 T1을 처리하는 동안 task.apply가 가리키는 T1 slot을 유지한다. result를 T1 entry에 연결하고 head에서 확정한 뒤에만 해당 slot과 item을 정리한다.</text>
</svg>
