<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<defs><marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker></defs>
<rect width="1200" height="540" fill="#fff"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#111827">4/6 · D1·D2를 복원해 적용한다 — committed_rep_lsa가 R1, R2로 전진</text>
<text x="40" y="88" font-size="16" font-weight="700" fill="#374151">① 로그와 포인터</text>
<line x1="40" y1="177" x2="1160" y2="177" stroke="#374151" stroke-width="3"/>
<rect x="70" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="122" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R0</text><text x="122" y="193" font-size="12" text-anchor="middle" fill="#6b7280">직전 item</text><rect x="188" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="240" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C0</text><text x="240" y="193" font-size="12" text-anchor="middle" fill="#6b7280">직전 COMMIT</text><rect x="306" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="358" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">D1</text><text x="358" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 data · id=1</text><rect x="424" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="476" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">D2</text><text x="476" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 data · id=2</text><rect x="542" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="594" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R1</text><text x="594" y="193" font-size="12" text-anchor="middle" fill="#6b7280">target=D1</text><rect x="660" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="712" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R2</text><text x="712" y="193" font-size="12" text-anchor="middle" fill="#6b7280">target=D2</text><rect x="778" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#374151" stroke-width="2"/><text x="830" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C1</text><text x="830" y="193" font-size="12" text-anchor="middle" fill="#6b7280">T1 COMMIT</text><rect x="896" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="948" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#374151">E1</text><text x="948" y="193" font-size="12" text-anchor="middle" fill="#6b7280">EOF · 유효 끝</text><rect x="1014" y="150" width="104" height="54" rx="7" fill="#fff" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="1066" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#374151">A1</text><text x="1066" y="193" font-size="12" text-anchor="middle" fill="#6b7280">다음 기록 위치</text>

<line x1="358" y1="226" x2="358" y2="204" stroke="#ea580c" stroke-width="2"/><rect x="256" y="226" width="203" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="358" y="249" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">D1 복원 · UPDATE id=1</text><line x1="476" y1="138" x2="476" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="374" y="104" width="203" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="476" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">D2 복원 · UPDATE id=2</text><line x1="712" y1="138" x2="712" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="604" y="104" width="215" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="712" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">committed_rep_lsa = R2</text>
<line x1="130" y1="292" x2="686" y2="292" stroke="#ea580c" stroke-width="3" marker-end="url(#arrO)"/><text x="130" y="284" font-size="15" font-weight="700" text-anchor="start" fill="#ea580c">committed_rep_lsa R0 → R1 → R2 (item 성공마다 전진)</text>
<text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면에서 바뀐 값</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="358" font-size="17" font-weight="700" fill="#9a3412">la_Info.committed_rep_lsa</text><text x="440" y="358" font-size="17" fill="#9a3412">R0 → R1 → R2 (item 적용 함수가 성공할 때마다)</text><text x="64" y="386" font-size="17" font-weight="700" fill="#9a3412">적용 데이터</text><text x="440" y="386" font-size="17" fill="#9a3412">D1·D2의 변경 적용 (applier의 미커밋 DB 트랜잭션)</text><text x="64" y="418" font-size="14" fill="#6b7280">committed_lsa = C0 · final_lsa = C1 · required_lsa = Q0 : 그대로</text>
<text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ DB</text><text x="100" y="458" font-size="15" font-weight="400" fill="#6b7280">_db_ha_apply_info: committed_lsa = C0 · committed_rep_lsa = R0 · required_lsa = Q0   (아직 DB commit 전)</text>
<rect x="0" y="476" width="1200" height="64" fill="#0f172a"/>
<text x="600" y="514" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">committed_rep_lsa는 성공한 item의 경계다. D1·D2의 변경과 함께 아직 미커밋 DB 트랜잭션 안에 있다.</text>
</svg>