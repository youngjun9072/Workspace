<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family:'Noto Sans KR','Malgun Gothic',sans-serif; fill:#172033; }
      .title { font-size:25px; font-weight:700; }
      .subtitle { font-size:14px; fill:#64748b; }
      .page-title { font-size:17px; font-weight:700; fill:#1e3a5f; }
      .label { font-size:15px; font-weight:700; }
      .small { font-size:13px; fill:#526273; }
      .tuple { font-size:16px; font-weight:700; fill:#1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="46" y="45" class="title">LSA가 로그 안에서 전진하는 순서</text>
  <text x="46" y="72" class="subtitle">LSA = (pageid, offset) · pageid를 먼저 비교하고, 같은 page에서는 offset을 비교한다.</text>

  <rect x="48" y="108" width="710" height="190" rx="15" fill="#eef5ff" stroke="#7aa7da" stroke-width="2"/>
  <text x="72" y="140" class="page-title">Page 120</text>
  <line x1="88" y1="220" x2="714" y2="220" stroke="#94a3b8" stroke-width="4"/>

  <line x1="245" y1="190" x2="245" y2="251" stroke="#2563eb" stroke-width="3"/>
  <circle cx="245" cy="220" r="8" fill="#2563eb"/>
  <text x="245" y="174" text-anchor="middle" class="tuple">(120, 40)</text>
  <text x="245" y="273" text-anchor="middle" class="small">offset 40</text>

  <line x1="570" y1="190" x2="570" y2="251" stroke="#2563eb" stroke-width="3"/>
  <circle cx="570" cy="220" r="8" fill="#2563eb"/>
  <text x="570" y="174" text-anchor="middle" class="tuple">(120, 96)</text>
  <text x="570" y="273" text-anchor="middle" class="small">offset 96</text>

  <path d="M262 220 H548" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="405" y="207" text-anchor="middle" class="small">같은 page: offset 증가</text>

  <rect x="802" y="108" width="350" height="190" rx="15" fill="#effaf5" stroke="#6eae8e" stroke-width="2"/>
  <text x="826" y="140" class="page-title">Page 121</text>
  <line x1="842" y1="220" x2="1112" y2="220" stroke="#94a3b8" stroke-width="4"/>

  <line x1="930" y1="190" x2="930" y2="251" stroke="#16a34a" stroke-width="3"/>
  <circle cx="930" cy="220" r="8" fill="#16a34a"/>
  <text x="930" y="174" text-anchor="middle" class="tuple" fill="#15803d">(121, 16)</text>
  <text x="930" y="273" text-anchor="middle" class="small">offset 16</text>

  <path d="M588 220 H907" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="748" y="207" text-anchor="middle" class="label" fill="#1d4ed8">다음 page로 전진</text>
  <text x="748" y="246" text-anchor="middle" class="small">offset이 작아져도 pageid가 크다</text>

  <rect x="48" y="330" width="1104" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="357" text-anchor="middle" class="label">(120, 40) &lt; (120, 96) &lt; (121, 16)</text>
  <text x="600" y="379" text-anchor="middle" class="small">offset 표지의 간격은 비교 원리를 설명하기 위한 개념도이며 실제 byte 간격을 나타내지 않는다.</text>
</svg>
