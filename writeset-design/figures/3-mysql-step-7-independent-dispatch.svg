<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">7단계 T_INDEPENDENT를 다른 worker에 배정</title><desc id="d">T_CHILD_2 배정 뒤 coordinator가 다음 GTID인 T_INDEPENDENT를 읽고 LC 조건을 확인해 다른 worker에 배정한다.</desc>
  <defs><style>.h{font:700 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#26303d}.t{font:14px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#445062}.m{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#26303d}.rail{stroke:#8a99ab;stroke-width:2;marker-end:url(#a)}.node{fill:#eef5fb;stroke:#5681ad;stroke-width:1.5}.ready{fill:#e8f5ec;stroke:#3fa35b;stroke-width:2}.worker{fill:#fff;stroke:#b5bfcc;stroke-width:1.4}.flow{fill:none;stroke:#526174;stroke-width:2;marker-end:url(#a)}.cursor{fill:#2c7be5}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526174"/></marker></defs>
  <rect width="1200" height="360" fill="#fff"/><text x="35" y="38" class="h">⑦ 다음 GTID를 읽어 T_INDEPENDENT를 다른 worker에 배정</text><text x="985" y="38" class="m">LWM=2</text>
  <text x="35" y="78" class="t">relay log · 읽기 재개</text><line x1="195" y1="73" x2="1155" y2="73" class="rail"/>
  <rect x="40" y="96" width="245" height="70" rx="9" class="node"/><text x="162" y="125" text-anchor="middle" class="h">T_PARENT</text><text x="162" y="150" text-anchor="middle" class="t">완료</text>
  <rect x="310" y="96" width="245" height="70" rx="9" class="node"/><text x="432" y="125" text-anchor="middle" class="h">T_CHILD_1</text><text x="432" y="150" text-anchor="middle" class="t">완료</text>
  <rect x="580" y="96" width="245" height="70" rx="9" class="node"/><text x="702" y="125" text-anchor="middle" class="h">T_CHILD_2</text><text x="702" y="150" text-anchor="middle" class="t">worker 1에 배정됨</text>
  <rect x="850" y="96" width="305" height="70" rx="9" class="ready"/><text x="1002" y="125" text-anchor="middle" class="h">T_INDEPENDENT</text><text x="1002" y="150" text-anchor="middle" class="m">LC=1 ≤ LWM=2</text>
  <path d="M1002 88l-11-16h22z" class="cursor"/><text x="1002" y="190" text-anchor="middle" class="t">coordinator read cursor</text><path d="M1002 196V225" class="flow"/>
  <rect x="385" y="230" width="770" height="88" rx="9" class="worker"/><text x="410" y="259" class="h">worker 1</text><rect x="540" y="239" width="230" height="30" rx="5" fill="#2c7be5"/><text x="655" y="259" text-anchor="middle" class="t" style="fill:#fff">T_CHILD_2 실행</text><text x="410" y="297" class="h">worker 3</text><rect x="800" y="277" width="320" height="30" rx="5" fill="#3fa35b"/><text x="960" y="297" text-anchor="middle" class="t" style="fill:#fff">T_INDEPENDENT 실행</text>
  <text x="40" y="345" class="t">두 트랜잭션은 함께 실행되지만, T_INDEPENDENT의 시작은 앞선 coordinator wait만큼 늦어졌다.</text>
</svg>
