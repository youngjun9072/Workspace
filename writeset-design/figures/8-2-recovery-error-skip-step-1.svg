<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" role="img"><title>장애 직전 — 안전 경계 뒤에 hole이 남는다</title><defs><marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker></defs><rect width="1200" height="540" fill="#fff"/><text x="40" y="48" font-size="28" font-weight="700" fill="#111827">1/5 · 장애 직전 — 안전 경계 뒤에 hole이 남는다</text><text x="40" y="88" font-size="16" font-weight="700" fill="#374151">① COMMIT LSA와 복구 경계</text><line x1="40" y1="177" x2="1160" y2="177" stroke="#374151" stroke-width="3"/><rect x="48" y="150" width="124" height="54" rx="7" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="110" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C0</text><text x="110" y="193" font-size="12" text-anchor="middle" fill="#6b7280">안전 완료</text><rect x="238" y="150" width="124" height="54" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><text x="300" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C1</text><text x="300" y="193" font-size="12" text-anchor="middle" fill="#6b7280">hole</text><rect x="428" y="150" width="124" height="54" rx="7" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="490" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C2</text><text x="490" y="193" font-size="12" text-anchor="middle" fill="#6b7280">먼저 완료</text><rect x="618" y="150" width="124" height="54" rx="7" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="680" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C3</text><text x="680" y="193" font-size="12" text-anchor="middle" fill="#6b7280">먼저 완료</text><rect x="808" y="150" width="124" height="54" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="870" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">R</text><text x="870" y="193" font-size="12" text-anchor="middle" fill="#6b7280">복구 상한</text><rect x="998" y="150" width="124" height="54" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1060" y="173" font-size="19" font-weight="700" text-anchor="middle" fill="#111827">C4</text><text x="1060" y="193" font-size="12" text-anchor="middle" fill="#6b7280">정상 구간</text><line x1="110" y1="138" x2="110" y2="150" stroke="#15803d" stroke-width="2"/><rect x="5.0" y="104" width="210" height="34" rx="17" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="110" y="127" font-size="15" font-weight="700" text-anchor="middle" fill="#15803d">committed_lsa = C0</text><line x1="870" y1="260" x2="870" y2="150" stroke="#ea580c" stroke-width="2"/><rect x="760.0" y="226" width="220" height="34" rx="17" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="870" y="249" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">saved final_lsa = R</text><text x="40" y="318" font-size="16" font-weight="700" fill="#374151">② 이 장면의 처리</text><rect x="40" y="330" width="1120" height="104" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="64" y="358" font-size="17" font-weight="700" fill="#9a3412">C1</text><text x="370" y="358" font-size="17" fill="#9a3412">worker 결과 없음 · 연속 완료 경계가 멈춘 hole</text><text x="64" y="388" font-size="17" font-weight="700" fill="#9a3412">C2 · C3</text><text x="370" y="388" font-size="17" fill="#9a3412">DB COMMIT은 끝났지만 C1 뒤의 순서 밖 완료</text><text x="64" y="418" font-size="17" font-weight="700" fill="#9a3412">R</text><text x="370" y="418" font-size="17" fill="#9a3412">reader가 읽어 영속한 이전 실행의 final_lsa</text><text x="40" y="458" font-size="16" font-weight="700" fill="#374151">③ 상태</text><text x="100" y="458" font-size="15" fill="#6b7280">DB에는 committed_lsa=C0와 final_lsa=R이 남고, 메모리의 Gate Order·완료 집합은 사라진다.</text><rect x="0" y="476" width="1200" height="64" fill="#0f172a"/><text x="40" y="507" font-size="15" font-weight="700" fill="#f8fafc">병렬 적용 재시작 · error skip</text><text x="1160" y="507" font-size="14" text-anchor="end" fill="#cbd5e1">장면 1/5</text></svg>