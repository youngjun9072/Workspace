<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <style>
      text{font-family:'Droid Sans','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#64748b}.head{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#64748b}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.6}.tx{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.slot{fill:#fff;stroke:#94a3b8;stroke-width:1.8}.hot{fill:#fff1f2;stroke:#e11d48;stroke-width:2.2}.ok{fill:#f0fdf4;stroke:#22c55e;stroke-width:2.2}.axis{stroke:#64748b;stroke-width:3}.tick{stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1500" height="780" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">1. T1~T7이 전역 history 10칸을 채운 상태</text>
  <text x="750" y="78" text-anchor="middle" class="sub">각 트랜잭션은 probe → 본인 commit_lsa 확정 → WRITE publish 순서로 진행한다</text>

  <rect x="55" y="108" width="1390" height="220" rx="18" class="panel"/>
  <text x="85" y="143" class="head">COMMIT LSA 순서와 publish</text>
  <line x1="150" y1="213" x2="1350" y2="213" class="axis"/>
  <g text-anchor="middle">
    <rect x="105" y="178" width="130" height="70" rx="12" class="tx"/><text x="170" y="205" class="head">T1 · C1</text><text x="170" y="229" class="small">A, B WRITE</text>
    <rect x="300" y="178" width="130" height="70" rx="12" class="tx"/><text x="365" y="205" class="head">T2 · C2</text><text x="365" y="229" class="small">C WRITE</text>
    <rect x="495" y="178" width="130" height="70" rx="12" class="hot"/><text x="560" y="205" class="head">T3 · C3</text><text x="560" y="229" class="small">A 갱신, D WRITE</text>
    <rect x="690" y="178" width="130" height="70" rx="12" class="tx"/><text x="755" y="205" class="head">T4 · C4</text><text x="755" y="229" class="small">E, F WRITE</text>
    <rect x="885" y="178" width="130" height="70" rx="12" class="tx"/><text x="950" y="205" class="head">T5 · C5</text><text x="950" y="229" class="small">G WRITE</text>
    <rect x="1080" y="178" width="130" height="70" rx="12" class="tx"/><text x="1145" y="205" class="head">T6 · C6</text><text x="1145" y="229" class="small">H, I WRITE</text>
    <rect x="1275" y="178" width="130" height="70" rx="12" class="ok"/><text x="1340" y="205" class="head">T7 · C7</text><text x="1340" y="229" class="small">J WRITE</text>
  </g>
  <text x="85" y="294" class="body">T3가 H_A.write_seq를 C1에서 C3으로 갱신한다. 나머지는 빈 슬롯에 처음 게시된다.</text>

  <rect x="55" y="356" width="1390" height="348" rx="18" class="panel"/>
  <text x="85" y="393" class="head">전역 history · history_start = C0 · 사용 10 / 최대 10</text>
  <g text-anchor="middle">
    <rect x="95" y="430" width="240" height="92" rx="12" class="hot"/><text x="215" y="462" class="head">H_A</text><text x="215" y="491" class="body">write_seq: C3</text><text x="215" y="512" class="small">T3에서 갱신</text>
    <rect x="365" y="430" width="240" height="92" rx="12" class="slot"/><text x="485" y="462" class="head">H_B</text><text x="485" y="491" class="body">write_seq: C1</text>
    <rect x="635" y="430" width="240" height="92" rx="12" class="slot"/><text x="755" y="462" class="head">H_C</text><text x="755" y="491" class="body">write_seq: C2</text>
    <rect x="905" y="430" width="240" height="92" rx="12" class="slot"/><text x="1025" y="462" class="head">H_D</text><text x="1025" y="491" class="body">write_seq: C3</text>
    <rect x="1175" y="430" width="240" height="92" rx="12" class="slot"/><text x="1295" y="462" class="head">H_E</text><text x="1295" y="491" class="body">write_seq: C4</text>
    <rect x="95" y="552" width="240" height="92" rx="12" class="slot"/><text x="215" y="584" class="head">H_F</text><text x="215" y="613" class="body">write_seq: C4</text>
    <rect x="365" y="552" width="240" height="92" rx="12" class="slot"/><text x="485" y="584" class="head">H_G</text><text x="485" y="613" class="body">write_seq: C5</text>
    <rect x="635" y="552" width="240" height="92" rx="12" class="slot"/><text x="755" y="584" class="head">H_H</text><text x="755" y="613" class="body">write_seq: C6</text>
    <rect x="905" y="552" width="240" height="92" rx="12" class="slot"/><text x="1025" y="584" class="head">H_I</text><text x="1025" y="613" class="body">write_seq: C6</text>
    <rect x="1175" y="552" width="240" height="92" rx="12" class="ok"/><text x="1295" y="584" class="head">H_J</text><text x="1295" y="613" class="body">write_seq: C7</text>
  </g>
  <text x="750" y="680" text-anchor="middle" class="body">모든 슬롯의 ref_seq는 비어 있음(−) · 다음 신규 키 publish 시 세대 교체가 필요</text>
</svg>
