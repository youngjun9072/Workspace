<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <style>
      .title{font:700 29px 'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 16px 'Noto Sans KR',sans-serif;fill:#475569}.head{font:700 19px 'Noto Sans KR',sans-serif;fill:#0f172a}.body{font:500 16px 'Noto Sans KR',sans-serif;fill:#334155}.small{font:500 14px 'Noto Sans KR',sans-serif;fill:#475569}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}.node{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:9}.write{fill:#fff1f2;stroke:#e11d48;stroke-width:2.5;rx:9}.ref{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5;rx:9}.done{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5;rx:9}.call{fill:#fff7ed;stroke:#ea580c;stroke-width:2.2;rx:12}.axis{stroke:#64748b;stroke-width:3}.base{stroke:#cbd5e1;stroke-width:8;stroke-linecap:round}.progress{stroke:#16a34a;stroke-width:8;stroke-linecap:round}.tick{stroke:#64748b;stroke-width:2}</style>
  </defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="700" y="45" text-anchor="middle" class="title">parent.id=7의 WRITE/REF 완료 관계 · 장면 1</text>
  <text x="700" y="73" text-anchor="middle" class="sub">T0 parent(7) 생성 → T1 child(10→7) 삽입 → T2 child(11→7) 삽입 → T3 parent(7) 삭제</text>

  <rect x="80" y="96" width="1240" height="126" class="panel"/>
  <text x="115" y="126" class="head">마스터 로그 축</text>
  <line x1="220" y1="166" x2="1180" y2="166" class="axis"/>
  <rect x="190" y="142" width="100" height="48" class="write"/><text x="240" y="172" text-anchor="middle" class="head">T0</text>
  <rect x="480" y="142" width="100" height="48" class="node"/><text x="530" y="172" text-anchor="middle" class="head">T1</text>
  <rect x="770" y="142" width="100" height="48" class="node"/><text x="820" y="172" text-anchor="middle" class="head">T2</text>
  <rect x="1060" y="142" width="100" height="48" class="node"/><text x="1110" y="172" text-anchor="middle" class="head">T3</text>
  <text x="240" y="210" text-anchor="middle" class="small">parent(7) 생성 WRITE</text><text x="530" y="210" text-anchor="middle" class="small">child(10→7) REF</text><text x="820" y="210" text-anchor="middle" class="small">child(11→7) REF</text><text x="1110" y="210" text-anchor="middle" class="small">parent(7) 삭제 WRITE</text>

  <rect x="80" y="246" width="580" height="176" class="panel"/>
  <text x="110" y="279" class="head">마스터 history[H(parent PK, 7)]</text>
  <rect x="110" y="300" width="520" height="48" class="write"/><text x="130" y="331" class="body">write_seq (이전 WRITE 위치) = T0 COMMIT</text>
  <rect x="110" y="360" width="520" height="42" class="node"/><text x="130" y="387" class="body">read_seq (이전 REF 위치 최댓값) = NULL</text>

  <rect x="740" y="246" width="580" height="176" class="panel"/>
  <text x="770" y="279" class="head">슬레이브 적용 상태</text>
  <rect x="770" y="300" width="520" height="48" class="done"/><text x="790" y="331" class="body">완료: T0 부모 생성</text>
  <text x="790" y="374" class="body">T1 · T2 · T3: 아직 배정 전</text>
  <text x="790" y="400" class="small">부모 생성이 먼저 적용된 상태</text>

  <rect x="80" y="448" width="1240" height="154" class="panel"/>
  <text x="110" y="481" class="head">완료 집합과 gap-free frontier</text>
  <text x="110" y="510" class="body">completed = {T0}</text>
  <line x1="240" y1="552" x2="1110" y2="552" class="base"/><line x1="240" y1="552" x2="240" y2="552" class="progress"/>
  <line x1="240" y1="536" x2="240" y2="568" class="tick"/><line x1="530" y1="536" x2="530" y2="568" class="tick"/><line x1="820" y1="536" x2="820" y2="568" class="tick"/><line x1="1110" y1="536" x2="1110" y2="568" class="tick"/>
  <text x="240" y="589" text-anchor="middle" class="body">T0 ▲ frontier</text><text x="530" y="589" text-anchor="middle" class="body">T1</text><text x="820" y="589" text-anchor="middle" class="body">T2</text><text x="1110" y="589" text-anchor="middle" class="body">T3</text>

  <rect x="250" y="624" width="900" height="54" class="call"/>
  <text x="700" y="658" text-anchor="middle" class="head">T0이 H(parent PK, 7)의 WRITE 이력을 게시한다</text>
</svg>
