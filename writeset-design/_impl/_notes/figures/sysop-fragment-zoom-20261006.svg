<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="424" font-family="DejaVu Sans, sans-serif">
<rect width="1390" height="424" fill="#fff"/>
<text x="30" y="34" font-size="20" font-weight="bold" fill="#111">Zoom: a serial(AUTO_INCREMENT) transaction keeps its order WITHOUT stalling others (~240ms window)</text>
<text x="30" y="58" font-size="13" fill="#555">blue = transaction body commit   orange = serial fragment apply   bold red = the serial transaction trid=4075</text>
<text x="30" y="76" font-size="13" fill="#555">x-axis = milliseconds (0 = the moment trid=4075 body commit must wait for its own serial fragment)</text>
